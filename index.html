  'Personal Cultivation':'#7c6a9c','Innovation & Strategy':'#3f7d8c',
  'Cooperative Leadership':'#b07a3c','ChangeMaking Experiments':'#a8543f',
  'Teampreneurship & Customer Co-creation':'#5b7f52','Self Driven Learning':'#4a6da8',
  'Empathy & Diversity':'#b0567a','Team & Community Learning':'#6f8f6a',
  'Business Model Creation':'#8a7340','Leading Thoughts':'#7a5f8f',
  'Branding & Communication':'#c07a4a','Financial Skill':'#4f7a6a',
  'Digital Skill':'#556b8a','Legal Skill':'#8a6a5a','Design Thinking':'#a06a8c'
};
function color(c){ return COLORS[c] || '#8b8378'; }
function today(){ return Math.floor(Date.now()/DAY); }

/* ---------- estado ---------- */
var db;
try { db = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ db = {}; }
if(!db.p) db.p = {};
if(!db.prefs) db.prefs = {};
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){} }

/* ---------- planificación (SM-2 simplificado) ---------- */
function next(st, g){
  st = st ? {n:st.n, ef:st.ef, iv:st.iv} : {n:0, ef:2.5, iv:0};
  if(g === 0){ st.n = 0; st.iv = 0; st.ef = Math.max(1.3, st.ef - 0.2); }
  else if(g === 1){
    st.iv = st.n === 0 ? 1 : (st.n === 1 ? 3 : Math.round(st.iv * st.ef));
    st.n++;
  } else {
    st.ef = Math.min(2.9, st.ef + 0.13);
    st.iv = st.n === 0 ? 4 : Math.max(4, Math.round(st.iv * st.ef * 1.25));
    st.n++;
  }
  st.iv = Math.min(st.iv, 365);
  st.due = today() + st.iv;
  return st;
}
function plazo(d){
  if(d <= 0) return 'hoy';
  if(d === 1) return 'mañana';
  if(d < 30) return 'en ' + d + ' días';
  if(d < 60) return 'en 1 mes';
  if(d < 365) return 'en ' + Math.round(d/30) + ' meses';
  return 'en 1 año';
}

/* ---------- cola ---------- */
var queue = [], cur = null, hechas = 0, total = 0, forzar = false;

function filtrar(){
  var lb = db.prefs.libro || '', cp = db.prefs.comp || '';
  return CARDS.filter(function(c){
    return (!lb || c.libro === lb) && (!cp || c.competencia === cp);
  });
}
function shuffle(a){
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function construir(){
  var pool = filtrar(), t = today(), q;
  if(db.prefs.modo === 'all' || forzar){
    q = shuffle(pool.slice());
  } else {
    q = shuffle(pool.filter(function(c){
      var s = db.p[c.id];
      return !s || s.due <= t;
    }));
  }
  queue = q; total = q.length; hechas = 0; forzar = false;
  siguiente();
}

/* ---------- estadísticas ---------- */
function stats(){
  var pool = filtrar(), t = today(), hoy=0, curso=0, firme=0;
  pool.forEach(function(c){
    var s = db.p[c.id];
    if(!s || s.due <= t) hoy++;
    if(s){ if(s.iv >= 21) firme++; else if(s.n > 0) curso++; }
  });
  document.getElementById('s-hoy').textContent = hoy;
  document.getElementById('s-curso').textContent = curso;
  document.getElementById('s-firme').textContent = firme;
  document.getElementById('meta').textContent = pool.length + ' tarjetas en este filtro';
}

/* ---------- pintar ---------- */
var $ = function(id){ return document.getElementById(id); };

function siguiente(){
  stats();
  $('bar').style.width = total ? (hechas/total*100) + '%' : '0%';
  cur = queue.shift() || null;
  if(!cur){ vacio(); return; }
  $('done').classList.add('hide');
  $('card').classList.remove('hide');
  pintar(cur);
}

function pintar(c){
  var col = color(c.competencia);
  $('card').style.setProperty('--dot', col);

  var libro = '<span class="chip"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2.5 3.2v9.6c0 .3.3.5.6.4 1.4-.5 3.5-.5 4.9.2 1.4-.7 3.5-.7 4.9-.2.3.1.6-.1.6-.4V3.2c0-.3-.3-.5-.6-.4-1.4.5-3.5.5-4.9-.2-1.4.7-3.5.7-4.9.2-.3-.1-.6.1-.6.4Z"/><path d="M8 2.8v10"/></svg>' + esc(c.libro) + '</span>';
  var comp = '<span class="chip" style="--dot:' + col + '"><i class="dot"></i>' + esc(c.competencia) + '</span>';
  $('chips').innerHTML = libro + comp;

  $('q').textContent = c.question;
  $('a-title').textContent = c.titulo;
  $('a-body').textContent = c.answer;

  if(c.highlight){
    $('quote-wrap').classList.remove('hide');
    $('quote').textContent = c.highlight;
    $('pag').textContent = c.pagina ? 'Página ' + c.pagina : '';
    $('pag').style.display = c.pagina ? '' : 'none';
  } else { $('quote-wrap').classList.add('hide'); }

  var A = c.aplicacion || {}, html = '';
  [['Personal','personal'],['Proyecto · Reelz','proyecto'],['Teamcompany · SPARK','teamcompany']]
    .forEach(function(p){
      if(A[p[1]]) html += '<div class="app"><dt>'+p[0]+'</dt><dd>'+esc(A[p[1]])+'</dd></div>';
    });
  $('apps').innerHTML = html;

  $('obs').href = 'obsidian://open?vault=' + encodeURIComponent(VAULT) +
    '&file=' + encodeURIComponent('02-Notas-permanentes/' + c.fichero.replace(/\.md$/, ''));

  var st = db.p[c.id];
  $('p1').textContent = plazo(next(st,1).iv);
  $('p2').textContent = plazo(next(st,2).iv);

  ocultarRespuesta();
  window.scrollTo({top:0, behavior:'smooth'});
}

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function ocultarRespuesta(){
  $('answer').classList.remove('show');
  $('reveal').classList.remove('hide');
}
function mostrarRespuesta(){
  $('answer').classList.add('show');
  $('reveal').classList.add('hide');
}

function vacio(){
  $('card').classList.add('hide');
  $('done').classList.remove('hide');
  var pool = filtrar(), t = today(), prox = null;
  pool.forEach(function(c){
    var s = db.p[c.id];
    if(s && s.due > t && (prox === null || s.due < prox)) prox = s.due;
  });
  if(!pool.length){
    $('done-t').textContent = 'Nada por aquí';
    $('done-p').textContent = 'Ese filtro no tiene tarjetas. Prueba con otro libro o competencia.';
    $('anyway').style.display = 'none';
  } else {
    $('done-t').textContent = hechas ? 'Sesión terminada' : 'Todo repasado';
    $('done-p').textContent = prox !== null
      ? 'La siguiente tanda te espera ' + plazo(prox - t) + '. Si tienes ganas, puedes seguir igualmente.'
      : 'No queda nada pendiente en este filtro.';
    $('anyway').style.display = '';
  }
  $('bar').style.width = '100%';
  stats();
}

/* ---------- interacción ---------- */
$('show').addEventListener('click', mostrarRespuesta);

Array.prototype.forEach.call(document.querySelectorAll('.g'), function(b){
  b.addEventListener('click', function(){
    if(!cur) return;
    var g = +b.dataset.g;
    var st = next(db.p[cur.id], g);
    db.p[cur.id] = st; save();
    if(g === 0){
      queue.splice(Math.min(queue.length, 4), 0, cur);   // vuelve más tarde en la sesión
    } else {
      hechas++;
    }
    siguiente();
  });
});

document.addEventListener('keydown', function(e){
  if(e.target.tagName === 'SELECT') return;
  if($('card').classList.contains('hide')) return;
  var abierta = $('answer').classList.contains('show');
  if((e.code === 'Space' || e.key === 'Enter') && !abierta){ e.preventDefault(); mostrarRespuesta(); return; }
  if(abierta && ['1','2','3'].indexOf(e.key) > -1){
    e.preventDefault();
    document.querySelector('.g[data-g="' + (+e.key - 1) + '"]').click();
  }
});

$('anyway').addEventListener('click', function(){ forzar = true; construir(); });

$('reset').addEventListener('click', function(){
  if(confirm('Esto borra el historial de repaso de todas las tarjetas. ¿Seguro?')){
    db.p = {}; save(); construir();
  }
});

/* ---------- traspaso de progreso entre dispositivos ----------
   El historial vive en este navegador. Estos dos botones lo mueven
   de un dispositivo a otro mediante un código de texto.            */
function codificar(obj){
  return btoa(unescape(encodeURIComponent(JSON.stringify(obj))));
}
function decodificar(txt){
  return JSON.parse(decodeURIComponent(escape(atob(txt.trim()))));
}

$('exportar').addEventListener('click', function(){
  var n = Object.keys(db.p).length;
  if(!n){ alert('Todavía no hay progreso que copiar.'); return; }
  var codigo = 'LEINN1:' + codificar(db.p);
  var ok = function(){
    alert('Copiado. Pégalo en el otro dispositivo con "Pegar progreso".\n\n' +
          n + ' tarjetas con historial.');
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(codigo).then(ok, function(){ prompt('Copia este código:', codigo); });
  } else {
    prompt('Copia este código:', codigo);
  }
});

$('importar').addEventListener('click', function(){
  var txt = prompt('Pega aquí el código copiado del otro dispositivo:');
  if(!txt) return;
  txt = txt.trim();
  if(txt.indexOf('LEINN1:') === 0) txt = txt.slice(7);
  var datos;
  try { datos = decodificar(txt); } catch(e){ alert('Ese código no es válido.'); return; }
  if(!datos || typeof datos !== 'object'){ alert('Ese código no es válido.'); return; }
  var n = Object.keys(datos).length;
  if(!confirm('Vas a sustituir el historial de este dispositivo por el del código (' +
              n + ' tarjetas). ¿Seguir?')) return;
  var limpio = {};
  Object.keys(datos).forEach(function(k){
    var s = datos[k];
    if(s && typeof s.due === 'number' && typeof s.iv === 'number'){
      limpio[k] = {n:+s.n || 0, ef:+s.ef || 2.5, iv:+s.iv || 0, due:+s.due};
    }
  });
  db.p = limpio; save(); construir();
  alert('Listo: ' + Object.keys(limpio).length + ' tarjetas restauradas.');
});

['libro','comp','modo'].forEach(function(k){
  var el = $('f-' + (k === 'comp' ? 'comp' : k));
  el.addEventListener('change', function(){
    db.prefs[k] = el.value; save(); construir();
  });
});

/* ---------- arranque ---------- */
function opciones(sel, valores, pref){
  valores.sort(function(a,b){ return a.localeCompare(b,'es'); }).forEach(function(v){
    var o = document.createElement('option');
    o.value = v; o.textContent = v;
    sel.appendChild(o);
  });
  if(pref && valores.indexOf(pref) > -1) sel.value = pref;
}
opciones($('f-libro'), Array.from(new Set(CARDS.map(function(c){ return c.libro; }))), db.prefs.libro);
opciones($('f-comp'),  Array.from(new Set(CARDS.map(function(c){ return c.competencia; }))), db.prefs.comp);
if(db.prefs.modo) $('f-modo').value = db.prefs.modo;

construir();

/* ---------- funcionamiento sin conexión (solo en la versión publicada) ---------- */
if('serviceWorker' in navigator && location.protocol === 'https:'){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){ /* da igual, sigue funcionando */ });
  });
}
})();
</script>

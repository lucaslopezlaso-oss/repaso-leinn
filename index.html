<style>
:root{
  color-scheme: light;
  --paper:#faf7f2;
  --paper-2:#f3ede3;
  --card:#fffefc;
  --ink:#1f1c18;
  --ink-2:#4a443c;
  --ink-3:#8b8378;
  --line:rgba(31,28,24,.09);
  --line-2:rgba(31,28,24,.05);
  --accent:#a8552f;
  --accent-soft:rgba(168,85,47,.09);
  --sage:#5b7f52;
  --clay:#a8543f;
  --serif: ui-serif, "New York", "Iowan Old Style", Georgia, Cambria, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  --r:18px;
  --shadow: 0 1px 2px rgba(31,28,24,.05), 0 10px 26px -12px rgba(31,28,24,.14), 0 30px 60px -30px rgba(31,28,24,.16);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:contain;
  color:var(--ink);
  background:
    radial-gradient(1000px 520px at 12% -8%, rgba(168,85,47,.07), transparent 62%),
    radial-gradient(880px 480px at 92% 4%, rgba(91,127,82,.06), transparent 58%),
    linear-gradient(180deg,var(--paper) 0%, var(--paper-2) 100%);
  background-attachment:fixed;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  font-size:15px;
  line-height:1.55;
}
.wrap{
  max-width:760px;margin:0 auto;
  padding:calc(26px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right))
          calc(72px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));
}
button,select{touch-action:manipulation}

/* ---------- cabecera ---------- */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand h1{
  font-family:var(--serif);font-size:23px;font-weight:600;letter-spacing:-.015em;
  margin:0;line-height:1.2;
}
.brand .sub{font-size:11.5px;color:var(--ink-3);letter-spacing:.09em;text-transform:uppercase;font-weight:600}
.streak{
  display:flex;gap:14px;font-size:11px;color:var(--ink-3);
  letter-spacing:.05em;text-transform:uppercase;font-weight:600;white-space:nowrap
}
.streak b{display:block;font-size:17px;color:var(--ink);font-weight:600;letter-spacing:-.01em;
  font-family:var(--serif);text-transform:none;margin-top:1px}

/* ---------- filtros ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.sel{position:relative;flex:1 1 auto;min-width:132px}
.sel::after{
  content:"";position:absolute;right:13px;top:50%;width:6px;height:6px;pointer-events:none;
  border-right:1.6px solid var(--ink-3);border-bottom:1.6px solid var(--ink-3);
  transform:translateY(-70%) rotate(45deg);
}
select{
  appearance:none;-webkit-appearance:none;width:100%;
  font-family:var(--sans);font-size:12.5px;font-weight:550;color:var(--ink-2);
  padding:9px 30px 9px 13px;border:1px solid var(--line);border-radius:11px;
  background:rgba(255,255,255,.72);cursor:pointer;transition:.18s;
  text-overflow:ellipsis;
}
select:hover{background:#fff;border-color:rgba(31,28,24,.16)}
select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* ---------- barra de progreso ---------- */
.bar{height:3px;border-radius:99px;background:rgba(31,28,24,.07);overflow:hidden;margin-bottom:22px}
.bar i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--accent),#c98a54);transition:width .45s cubic-bezier(.4,0,.2,1)}

/* ---------- tarjeta ---------- */
.card{
  background:var(--card);border:1px solid var(--line-2);border-radius:var(--r);
  box-shadow:var(--shadow);padding:26px 26px 24px;position:relative;
}
.card::before{
  content:"";position:absolute;inset:0 0 auto 0;height:2px;
  border-radius:var(--r) var(--r) 0 0;
  background:linear-gradient(90deg,var(--dot,var(--accent)),transparent 72%);opacity:.5
}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  font-size:10.5px;font-weight:650;letter-spacing:.055em;text-transform:uppercase;
  padding:4.5px 10px;border-radius:99px;border:1px solid var(--line);
  background:rgba(31,28,24,.022);color:var(--ink-2);white-space:nowrap
}
.chip .dot{width:6px;height:6px;border-radius:99px;background:var(--dot,var(--ink-3));flex:none}
.chip svg{width:10px;height:10px;opacity:.5;flex:none}

.q{
  font-family:var(--serif);font-size:25px;line-height:1.3;letter-spacing:-.018em;
  font-weight:500;margin:0;color:var(--ink);text-wrap:balance;
}
@media(max-width:520px){.q{font-size:21px}.card{padding:22px 20px}}

.reveal{margin-top:22px}
.btn{
  font-family:var(--sans);font-size:13.5px;font-weight:600;letter-spacing:.005em;
  padding:12px 20px;border-radius:12px;border:1px solid var(--ink);
  background:var(--ink);color:#fdfcfa;cursor:pointer;transition:.16s;width:100%;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px -6px rgba(31,28,24,.4)}
.btn:active{transform:translateY(0)}
.btn .k{opacity:.42;font-size:11px;margin-left:7px;font-weight:500}

/* ---------- respuesta ---------- */
.answer{display:none}
.answer.show{display:block;animation:rise .42s cubic-bezier(.16,1,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.rule{height:1px;background:var(--line);margin:22px 0 18px;border:0}

.lab{
  font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 8px;display:flex;align-items:center;gap:7px
}
.lab::after{content:"";flex:1;height:1px;background:var(--line-2)}
.a-title{
  font-family:var(--serif);font-size:16.5px;font-weight:600;letter-spacing:-.012em;
  margin:0 0 10px;color:var(--ink);line-height:1.35
}
.a-body{font-size:14.5px;line-height:1.68;color:var(--ink-2);margin:0}

/* cita */
.quote{
  margin:20px 0 0;padding:15px 17px 15px 18px;border-radius:12px;
  background:linear-gradient(180deg,rgba(168,85,47,.045),rgba(168,85,47,.02));
  border-left:2px solid rgba(168,85,47,.34);position:relative
}
.quote p{
  font-family:var(--serif);font-style:italic;font-size:14.5px;line-height:1.62;
  color:var(--ink-2);margin:0;text-wrap:pretty
}
.pag{
  display:inline-block;margin-top:9px;font-family:var(--sans);font-style:normal;
  font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);opacity:.8
}

/* aplicación */
.apps{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.app{display:grid;grid-template-columns:96px 1fr;gap:14px;padding:11px 0;border-top:1px solid var(--line-2)}
.app:first-child{border-top:0}
.app dt{
  font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);padding-top:2px
}
.app dd{margin:0;font-size:13.5px;line-height:1.6;color:var(--ink-2)}
@media(max-width:520px){.app{grid-template-columns:1fr;gap:3px}}

.link{
  display:inline-flex;align-items:center;gap:6px;margin-top:20px;
  font-size:11.5px;font-weight:600;color:var(--ink-3);text-decoration:none;
  letter-spacing:.02em;transition:.16s
}
.link:hover{color:var(--accent)}
.link svg{width:12px;height:12px}

/* ---------- calificación ---------- */
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}
.g{
  font-family:var(--sans);padding:11px 8px 9px;border-radius:12px;cursor:pointer;
  border:1px solid var(--line);background:rgba(255,255,255,.6);transition:.16s;
  display:flex;flex-direction:column;align-items:center;gap:2px
}
.g:hover{transform:translateY(-1px);background:#fff;border-color:var(--gc,var(--ink-3));box-shadow:0 5px 14px -6px rgba(31,28,24,.22)}
.g b{font-size:13px;font-weight:650;color:var(--gc,var(--ink))}
.g span{font-size:10px;color:var(--ink-3);font-weight:500;letter-spacing:.01em}
.g[data-g="0"]{--gc:var(--clay)}
.g[data-g="1"]{--gc:var(--ink)}
.g[data-g="2"]{--gc:var(--sage)}

/* en el móvil las tres opciones quedan siempre al alcance del pulgar */
@media(max-width:640px){
  .grades{
    position:sticky;z-index:5;
    bottom:calc(env(safe-area-inset-bottom) - 2px);
    margin:20px -20px -24px;padding:14px 20px calc(18px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,rgba(255,254,252,0),var(--card) 34%);
    border-radius:0 0 var(--r) var(--r);
  }
  .g{padding:13px 6px 11px}
  .g b{font-size:14px}
  .btn{padding:14px 20px;font-size:14.5px}
  .btn .k{display:none}
}

/* ---------- estado vacío ---------- */
.done{
  background:var(--card);border:1px solid var(--line-2);border-radius:var(--r);
  box-shadow:var(--shadow);padding:52px 30px;text-align:center
}
.done .ic{font-size:30px;margin-bottom:12px;opacity:.85}
.done h2{font-family:var(--serif);font-size:21px;font-weight:600;margin:0 0 8px;letter-spacing:-.015em}
.done p{font-size:13.5px;color:var(--ink-3);margin:0 auto;max-width:330px;line-height:1.6}
.done .btn{width:auto;margin-top:22px;padding:11px 22px;background:transparent;color:var(--ink-2);border-color:var(--line)}
.done .btn:hover{background:rgba(31,28,24,.03);box-shadow:none}

.foot{
  margin-top:22px;display:flex;justify-content:space-between;align-items:center;gap:12px;
  font-size:10.5px;color:var(--ink-3);letter-spacing:.05em;flex-wrap:wrap
}
.foot button{
  font-family:var(--sans);font-size:10.5px;letter-spacing:.05em;color:var(--ink-3);
  background:none;border:0;cursor:pointer;padding:4px 0;text-decoration:underline;
  text-underline-offset:3px;text-decoration-color:var(--line)
}
.foot button:hover{color:var(--clay)}
.foot .acts{display:flex;gap:14px;flex-wrap:wrap}
.hide{display:none !important}
</style>
</head>

<div class="wrap">

  <div class="top">

</div>

<script type="application/json" id="deck">{"generado":"2026-10-01T05:03:03","total":135,"tarjetas":[{"id":"agradecimiento-estructurado-en-vez-de-cumplidos","fichero":"Agradecimiento estructurado en vez de cumplidos.md","titulo":"Agradecimiento estructurado en vez de cumplidos","libro":"Comunicación No Violenta","competencia":"Team \u0026 Community Learning","tags":["herramienta","comunicación","plantilla"],"highlight":"\"Tendemos a darnos cuenta de lo que está mal, y no de lo que está bien\" (Pág 185) — estructura del agradecimiento: \"Esto es lo que hiciste, esto la necesidad satisfecha y esto lo que siento\" (Pág 182)","pagina":"185","question":"¿Decir \"buen trabajo\" a alguien es lo mismo que agradecerle de verdad?","answer":"No del todo. Un cumplido, aunque sea positivo, sigue siendo un juicio (\"eres bueno en esto\"), y a veces lleva una intención escondida detrás. Un agradecimiento de verdad tiene tres partes: qué hizo la otra persona en concreto, qué necesidad tuya cubrió con eso, y qué sentiste tú al recibirlo. Así la otra persona no solo recibe un \"gracias\" vacío, sino que entiende exactamente qué impacto tuvo en ti.","aplicacion":{"personal":"Anotar cada semana en mi Learning Diary tres agradecimientos usando la estructura completa (qué hizo, qué necesidad satisfizo, qué sentí), tal como decidí en los Next Steps del ensayo.","proyecto":"En Reelz, cuando un cliente o colaborador haga algo que valoro, agradecérselo con esta estructura en vez de un simple \"genial, gracias\".","teamcompany":"Usar este mismo método para agradecer a algún miembro de SPARK cada semana, en vez de limitarme a comentarios genéricos de ánimo."},"mtime":1785880633},{"id":"agregacion-de-ganancias-marginales-1-mejor-cada-dia","fichero":"Agregación de ganancias marginales, 1% mejor cada día.md","titulo":"Agregación de ganancias marginales: 1% mejor cada día","libro":"Hábitos Atómicos","competencia":"Personal Cultivation","tags":["concepto","hábitos","mejora-continua"],"highlight":"\"El principio de esta filosofía consiste en aislar cada uno de los aspectos del ciclismo. Si se mejora el 1% de cada uno de estos aspectos, se habrá obtenido una mejora considerable una vez que todos los cambios se apliquen al mismo tiempo. 1% mejor cada día = 37 veces mejor al final del año. Sin embargo, un 1% peor cada día significa pasar a ser un 0,03.\"","pagina":"","question":"Si mejoras solo un 1% al día, ¿vale realmente la pena tanto esfuerzo por un cambio tan pequeño?","answer":"Sí, aunque no lo parezca al principio. Un 1% diario suena insignificante, pero como se acumula día tras día (no se suma, se multiplica), al cabo de un año esa mejora diaria minúscula te hace 37 veces mejor que al empezar. Y el mismo efecto funciona al revés: empeorar un 1% cada día te deja, en un año, con apenas un 3% de tu nivel inicial. La pregunta importante no es \"cuánto mejoro hoy\", sino \"en qué dirección se está acumulando esto\".","aplicacion":{"personal":"Identificar un solo aspecto de mi rutina donde pueda aplicar una mejora del 1%, y no obsesionarme con cambios grandes de golpe.","proyecto":"Aplicar esta lógica a Reelz: buscar mejoras marginales constantes en distintos aspectos del servicio, en vez de esperar un único gran cambio.","teamcompany":"Compartir esta idea con SPARK como marco para entender por qué pequeñas mejoras sostenidas en el tiempo importan más de lo que parece a corto plazo."},"mtime":1785881642},{"id":"antifragilidad-lo-que-no-te-mata-te-hace-mas-fuerte","fichero":"Antifragilidad - lo que no te mata te hace más fuerte.md","titulo":"Antifragilidad: lo que no te mata te hace más fuerte","libro":"Ikigai","competencia":"Innovation \u0026 Strategy","tags":["concepto","resiliencia","estrategia"],"highlight":"\"Para hablar del poder de la Hidra de Lerna, de aquello que se hace más fuerte al recibir daño, Nicholas Taleb propone que usemos la palabra antifragilidad... «Lo que no nos mata, nos hace más fuertes».\" / \"no poner todos los huevos en la misma cesta\"","pagina":"","question":"¿Es lo mismo ser \"resistente\" a un golpe que salir reforzado por él?","answer":"No. Algo resistente aguanta el golpe y se queda igual; algo antifrágil aguanta el golpe y sale mejor que antes, como un músculo que se rompe un poco al entrenar y luego crece más fuerte. Taleb también dice que para ser antifrágil no puedes depender de una sola cosa: si pones todos los huevos en la misma cesta, un solo golpe te destruye del todo.","aplicacion":{"personal":"Buscar activamente pequeños \"golpes\" controlados (retos físicos, sociales) que me obliguen a adaptarme, en vez de evitar todo el estrés.","proyecto":"Generar un cultura de que los fallos (un cliente, un proveedor, un canal de venta) son realmente un aprendizaje que fortalece el proyecto, no un error que lo frena.","teamcompany":"Después de cada fracaso o rechazo del equipo (cliente perdido, pitch fallido), documentar explícitamente qué se refuerza a partir de ese golpe, no solo qué se lamenta. (Mentalidad LEINNer)"},"mtime":1785928345},{"id":"apatheia-la-calma-frente-al-deseo-insaciable","fichero":"Apatheia - la calma frente al deseo insaciable.md","titulo":"Apatheia: la calma frente al deseo insaciable","libro":"Ikigai","competencia":"Personal Cultivation","tags":["modelo-mental","filosofía","estoicismo"],"highlight":"\"Los humanos podemos ser insaciables. Para los estoicos, este tipo de deseos y ambiciones no son dignos de ser perseguidos. El objetivo de la persona virtuosa es conseguir tranquilidad (apatheia): un estado de ausencia de emociones negativas como ansiedad, miedo, pena, vanidad, enfado, y con presencia de emociones positivas como, por ejemplo, alegría, amor, serenidad o gratitud\"","pagina":"","question":"Si consiguiera todo lo que quiero ahora mismo, ¿dejaría de querer más cosas?","answer":"Probablemente no — los estoicos ya se dieron cuenta de que el deseo humano no tiene fondo: siempre aparece algo nuevo que \"necesitas\". Por eso no ponían la meta en conseguir más cosas, sino en llegar a un estado de calma (apatheia) donde no dependes de conseguir la siguiente cosa para estar bien, sin ansiedad ni miedo, con espacio para la alegría y la gratitud tal como están las cosas ahora.","aplicacion":{"personal":"Antes de perseguir un nuevo objetivo material o de estatus, preguntarme si realmente lo necesito o si es el patrón de \"querer más\" manifestándose.","proyecto":"Encontrar un sentido real al proyecto y no una avaricia infinita.","teamcompany":"Al cerrar un hito importante, dedicar tiempo real a disfrutarlo con el equipo antes de saltar automáticamente al siguiente objetivo, practicando la apatheia como cultura. Crear una cultura de gratitud dentro de SPARK es importante."},"mtime":1785929533},{"id":"aprender-cosas-nuevas-revitaliza-el-cerebro","fichero":"Aprender cosas nuevas revitaliza el cerebro.md","titulo":"Aprender cosas nuevas revitaliza el cerebro","libro":"Ikigai","competencia":"Self Driven Learning","tags":["concepto","aprendizaje","cerebro"],"highlight":"\"al introducir nueva información, el cerebro crea conexiones nuevas y se revitaliza\"","pagina":"","question":"¿Por qué la gente que sigue aprendiendo cosas nuevas de mayor parece \"envejecer\" más despacio mentalmente?","answer":"Cada vez que aprendes algo realmente nuevo —no repetir lo mismo de siempre— tu cerebro crea conexiones nuevas entre neuronas. Es como si el cerebro se mantuviera \"en obras\" constantemente: cuanto más lo usas para cosas nuevas, menos se oxida.","aplicacion":{"personal":"Creo que esto esta cubierto con el hábito de lectura que he implementado gracias a estar en LEINN.","proyecto":"Dedicar tiempo explícito dentro del proyecto a aprender herramientas o mercados fuera de mi zona de confort, en vez de repetir siempre el mismo enfoque. Y también incluyo aquí, el poder aprender de otros proyectos y de sus herramientas.","teamcompany":"Proponer que el equipo rote responsabilidades de vez en cuando para que todos sigamos generando conexiones nuevas en vez de anquilosarnos en el mismo rol. Siento que repetir la misma TLT otro año, quizá haya podido ser un error."},"mtime":1785929003},{"id":"aspirar-a-la-maestria-y-la-regla-de-las-10-000-horas","fichero":"Aspirar a la maestría y la regla de las 10.000 horas.md","titulo":"Aspirar a la maestría y la regla de las 10.000 horas","libro":"El líder que no tenía cargo","competencia":"Self Driven Learning","tags":["modelo-mental","maestría","aprendizaje"],"highlight":"\"Hay que aspirar a la maestría en todo lo que se haga, tienes que ser tan bueno que la gente no pueda ignorarte\" (Pág 96) — \"Para alcanzar maestría en un campo se estima que se necesitan destinar 10.000 horas de práctica\" (Pág 104)","pagina":"96","question":"Si llevas diez años practicando algo, ¿ya deberías considerarte un maestro en ello?","answer":"No necesariamente, y eso está bien. La maestría se estima en 10.000 horas de práctica, que suelen ser unos diez años de dedicación a una sola cosa. En 2025 cumplí una década practicando breaking y todavía me siento lejos de la maestría — lo cual demuestra la profundidad real que tiene cualquier campo cuando te lo tomas en serio. La meta no es \"llegar\", es ser tan bueno que la gente no pueda ignorarte, y eso se construye con constancia, no con atajos.","aplicacion":{"personal":"Aceptar que llevar años en algo (como el breaking) no significa haber terminado de aprender, y seguir invirtiendo horas de práctica deliberada.","proyecto":"En Reelz, dejar de conformarme con mi nivel actual en la habilidad central del servicio y aspirar conscientemente a la maestría en ella, ya que eso potenciaría el proyecto.","teamcompany":"Transmitir a SPARK que el valor real de un proyecto en LEINN no es la facturación inmediata, sino las horas de práctica deliberada que estamos acumulando hacia la maestría en nuestro campo."},"mtime":1785881118},{"id":"asumir-responsabilidad-total-en-vez-de-senalar","fichero":"Asumir responsabilidad total en vez de señalar.md","titulo":"Asumir responsabilidad total en vez de señalar","libro":"El líder que no tenía cargo","competencia":"Cooperative Leadership","tags":["modelo-mental","responsabilidad"],"highlight":"\"Nosotros creamos la vida que vivimos\" (Pág 59) — todo lo que pasa a nuestro alrededor es en parte responsabilidad nuestra; al asumirla, también asumimos la capacidad de cambiarlo.","pagina":"59","question":"¿Ves tu entorno como una ventana (algo externo que quieres cambiar) o como un espejo (algo conectado contigo que cambia si cambias tú)?","answer":"La metáfora es simple pero potente: si ves la vida como una ventana, sientes que el exterior no tiene nada que ver contigo y solo quieres cambiarlo a tu manera. Si la ves como un espejo, entiendes que lo que te rodea está conectado contigo, y que cambiándote a ti mismo puedes cambiar también lo que te rodea. Asumir esta segunda visión es incómodo porque implica responsabilidad, pero también te devuelve el poder de actuar.","aplicacion":{"personal":"Ante un problema recurrente en mi vida, preguntarme primero qué parte de espejo tiene (qué depende de mí) antes de mirarlo como ventana (culpa externa).","proyecto":"En Reelz, cuando algo no funcione, buscar primero mi propia responsabilidad en la causa antes de atribuirlo a factores externos.","teamcompany":"Asumir responsabilidad total en SPARK, dejando de señalar lo que no funciona en el equipo y enfocándome en qué puedo hacer yo para mejorarlo, tal como decidí en los Next Steps del ensayo."},"mtime":1785881179},{"id":"atomizacion-del-desafio-estrategico-hacerlo-manejable-a-cada-nivel","fichero":"Atomización del desafío estratégico - hacerlo manejable a cada nivel.md","titulo":"Atomización del desafío estratégico: hacerlo manejable a cada nivel","libro":"La Estrategia del Océano Azul","competencia":"Cooperative Leadership","tags":["concepto","liderazgo"],"highlight":"\"El único desafío que debían superar los agentes que patrullaban por las calles era que su ronda y su manzana fueran seguras —nada más. [...] ¿Pone en circulación visiones estratégicas grandiosas? ¿O bien descompone el problema para que sea procesable a todos los niveles?\" (pág. 189)","pagina":"189","question":"Si le digo a mi equipo \"tenemos que ser los mejores del sector\", ¿por qué esa frase no cambia nada en lo que hacen el lunes por la mañana?","answer":"Un objetivo estratégico grandioso (\"hacer de Nueva York la ciudad más segura\") es inspirador pero inmanejable para la persona que tiene que ejecutarlo, porque no sabe por dónde empezar ni siente que esté en su mano lograrlo. Bratton lo rompió en trozos del tamaño exacto de cada nivel: para el policía de a pie, el desafío era solo \"que mi manzana sea segura\" — nada más, y eso sí que estaba en su mano. Cuando la gente no cree que el reto sea alcanzable, ni lo intenta; cuando el reto se corta al tamaño de lo que cada uno controla, sí actúa.","aplicacion":{"personal":"En vez de plantearme metas grandes y difusas (\"ser mejor emprendedor\"), atomizarlas al tamaño de lo que controlo esta semana concreta.","proyecto":"Si en Reelz nos ponemos un objetivo grande de facturación o de clientes, descomponerlo para cada persona del equipo en algo del tamaño de lo que realmente controla en su día a día (no \"vender más\" sino \"conseguir una reunión esta semana\").","teamcompany":"Cuando SPARK plantee un objetivo de Team Company (ej. \"mejorar la cultura de equipo\"), traducirlo a algo concreto y del tamaño de cada persona o subgrupo, en vez de dejarlo como un mensaje inspirador sin acción clara."},"mtime":1788562459},{"id":"barreras-a-la-imitacion-por-que-un-oceano-azul-dura-decadas","fichero":"Barreras a la imitación - por qué un océano azul dura décadas.md","titulo":"Barreras a la imitación: por qué un océano azul dura décadas","libro":"La Estrategia del Océano Azul","competencia":"Business Model Creation","tags":["concepto","modelo-de-negocio"],"highlight":"\"La barrera del alineamiento: el alineamiento de las tres propuestas estratégicas —valor, beneficio y personas— en un sistema integral que gire alrededor de la diferenciación y el bajo coste crea sostenibilidad y, por tanto, una formidable barrera a la imitación.\" (pág. 227)","pagina":"227","question":"Si mi idea es tan buena, ¿qué me impide que un competidor grande me la copie el mes que viene y me quite toda la ventaja?","answer":"Una buena estrategia de océano azul no necesita patentes para ser difícil de copiar — se protege sola de varias formas a la vez. Barrera cognitiva/organizacional: copiar algo que rompe la lógica de todo tu sector no tiene sentido desde dentro de una empresa acostumbrada a competir de otra forma. Barrera de marca: si fuiste el primero en dar ese salto de valor, tu marca se queda pegada a la idea y copiarte hace quedar al imitador como el segundón. Barrera económica/legal: cuantas más ventas generas por tu ventaja, más bajan tus costes por economías de escala, así que el hueco entre tú y quien te copia se agranda con el tiempo en vez de cerrarse. Y la más fuerte de todas: la barrera del alineamiento — si tu valor, tu forma de ganar dinero y cómo motivas a tu gente están todos construidos alrededor de la misma idea coherente, un competidor tendría que copiarte las tres cosas a la vez, no solo el producto.","aplicacion":{"personal":"No encuentro una aplicación directa.","proyecto":"En Reelz, si encontramos una ventaja real, no depender solo de \"lo hacemos mejor\" sino construir alineación entre nuestra propuesta de valor, nuestro modelo de ingresos y cómo motivamos al equipo, eso es lo que de verdad frena a un competidor que quiera copiarnos.","teamcompany":"Si SPARK desarrolla una forma de trabajar en equipo que nos diferencia de otros Team Companies de LEINN, cuidar que esté alineada de verdad (no solo copiada de fuera) para que sea genuinamente nuestra y no algo que cualquier otro equipo pueda replicar en una tarde."},"mtime":1789035433},{"id":"buen-fracaso-vs-mal-fracaso","fichero":"Buen fracaso vs mal fracaso.md","titulo":"Buen fracaso vs mal fracaso","libro":"Pretotype It","competencia":"ChangeMaking Experiments","tags":["modelo-mental","fracaso","emprendimiento"],"highlight":"\"Buen Fracaso: Cost of Failure \u003c Value of Lesson. Mal Fracaso: Cost of Failure \u003e Value of Lesson.\"","pagina":"","question":"Si un proyecto no genera ni un euro en tres meses, ¿fue tiempo perdido?","answer":"No siempre. Lo que importa no es solo si ganaste dinero, sino si lo que aprendiste vale más de lo que te costó fracasar. Un buen fracaso es barato y te enseña mucho (el coste es menor que la lección); un mal fracaso es caro y apenas te enseña nada. La clave no es evitar fracasar, sino buscar siempre fracasos del primer tipo: baratos y llenos de aprendizaje.","aplicacion":{"personal":"Antes de lanzarme a probar algo nuevo, preguntarme si el coste de fracasar (tiempo, dinero, energía) sería razonable frente a lo que aprendería si sale mal.","proyecto":"En Reelz, diseñar cada experimento nuevo para que, si falla, sea barato y rápido de detectar, maximizando el aprendizaje por euro invertido.","teamcompany":"Recordar a mis socios de SPARK que aunque la facturación de un proyecto sea cero, el valor de las lecciones aprendidas no lo es — y usar ese criterio para decidir qué proyectos merecieron la pena, más allá de la facturación."},"mtime":1785880704},{"id":"cartas-de-testimonios-contra-objeciones","fichero":"Cartas de testimonios contra objeciones.md","titulo":"Cartas de testimonios contra objeciones","libro":"El arte de cerrar la venta","competencia":"Branding \u0026 Communication","tags":["herramienta","ventas","testimonios"],"highlight":"\"Cartas de Testimonios vs Objeciones. Esta es la herramienta más poderosa para las objeciones. Testimonios de clientes satisfechos que tenían las mismas objeciones en un inicio que ese prospecto.\"","pagina":"","question":"Cuando un prospecto duda de tu producto, ¿es mejor convencerle tú mismo con más argumentos o mostrarle la experiencia de otro cliente?","answer":"Mostrarle la experiencia de otro cliente suele pesar más. Si tú defiendes tu propio producto, el prospecto sabe que tienes interés en venderlo, así que tus argumentos valen menos. Pero si le enseñas el testimonio de alguien que tenía exactamente la misma duda que él y acabó satisfecho, esa prueba social resuelve la objeción de una forma que tus propias palabras nunca podrían.","aplicacion":{"personal":"Cuando quiera convencer a alguien de algo que ya he probado yo mismo, apoyarme en ejemplos de terceros en vez de solo en mi propia opinión.","proyecto":"Hacer una recolección activa de testimonios de clientes de Reelz para tener esta capacidad de rebatir objeciones.","teamcompany":"Crear en SPARK un repositorio compartido de testimonios de clientes satisfechos, organizado por tipo de objeción, para que cualquier socio pueda usarlo en sus ventas."},"mtime":1785921974},{"id":"centrarse-en-el-interior-no-en-el-exterior","fichero":"Centrarse en el interior, no en el exterior.md","titulo":"Centrarse en el interior, no en el exterior","libro":"El líder que no tenía cargo","competencia":"Personal Cultivation","tags":["modelo-mental","propósito","satisfacción"],"highlight":"\"No quieres un Ferrari, quieres la satisfacción o el sentimiento de validación que ese coche te proporciona. Pero buscas una emoción realmente, no un objeto.\" (Pág 226)","pagina":"226","question":"Si consigues el objeto o el logro que llevas tiempo persiguiendo, ¿por fin vas a sentirte satisfecho de forma duradera?","answer":"Probablemente no, porque lo que perseguimos en realidad no es el objeto (el coche, la competición ganada, el dinero) sino la emoción que creemos que ese objeto nos va a dar. Y esa emoción se puede perseguir de forma infinita: siempre hay un coche más caro, una competición más importante. Cuando eres consciente de que buscas una emoción y no un objeto, puedes empezar a encontrar esa emoción en el camino, no solo en la meta.","aplicacion":{"personal":"Cuando persiga un logro concreto, preguntarme qué emoción real busco detrás y ver si puedo encontrar parte de ella ya en el proceso, no solo al conseguirlo.","proyecto":"En Reelz, no medir mi satisfacción solo por hitos externos (facturación, cliente cerrado) sino por disfrutar el proceso de construir el proyecto día a día.","teamcompany":"Recordar a mi equipo de SPARK que el objetivo no debería ser solo alcanzar la siguiente meta, sino disfrutar el camino que estamos recorriendo juntos, algo que ayuda a ser más resiliente ante la frustración."},"mtime":1785881164},{"id":"conservar-el-dinero-hasta-encontrar-el-modelo-escalable","fichero":"Conservar el dinero hasta encontrar el modelo escalable.md","titulo":"Conservar el dinero hasta encontrar el modelo escalable","libro":"El Manual del Emprendedor","competencia":"Financial Skill","tags":["concepto","finanzas","emprendimiento"],"highlight":"\"Conservar todo el dinero hasta que sea necesario después (cuando se encuentra un modelo repetible) gastar\" — regla 12 del Manifiesto del Desarrollo de Clientes.","pagina":"","question":"Si tu startup empieza a generar ingresos, ¿es buen momento para reinvertir agresivamente en hacerla crecer?","answer":"Depende de si ya sabes que ese ingreso es repetible y escalable, o si fue casi casualidad. Los primeros ingresos muchas veces vienen de relaciones cercanas (familia, amigos, conocidos) y ese patrón no se puede repetir con un equipo comercial. La regla es guardar el dinero hasta tener la certeza de que has encontrado un modelo que se puede repetir a gran escala; solo entonces tiene sentido invertir fuerte para explotarlo al máximo.","aplicacion":{"personal":"Aplicar esta cautela a mis propias finanzas personales: no gastar en grande basándome en un ingreso puntual que no sé si se va a repetir.","proyecto":"Pensar en cómo empezar a reinvertir los beneficios de Reelz de forma más decidida solo cuando tengamos certeza de que el modelo es repetible, en vez de dejar el dinero parado sin motivo ni gastarlo antes de tiempo.","teamcompany":"Aplicar este criterio en las decisiones financieras de SPARK: diferenciar un ingreso puntual de relaciones cercanas de un ingreso realmente escalable antes de comprometer gasto grande."},"mtime":1785881411},{"id":"construir-un-reloj-no-dar-la-hora","fichero":"Construir un reloj, no dar la hora.md","titulo":"Construir un reloj, no dar la hora","libro":"Good to Great","competencia":"Innovation \u0026 Strategy","tags":["concepto","organización","legado"],"highlight":"\"Construir un reloj, en lugar de simplemente dar la hora: construir una organización que pueda resistir y adaptarse durante múltiples generaciones de líderes.\"","pagina":"","question":"Si eres tú quien toma cada decisión clave del proyecto, ¿está tu proyecto bien construido?","answer":"No del todo, según esta idea. \"Dar la hora\" es resolver el problema de hoy tú mismo, cada vez; \"construir un reloj\" es crear un sistema tan claro que funcione incluso sin ti, con otras personas al mando, durante mucho tiempo. Un proyecto verdaderamente sólido no depende de que una persona concreta siga ahí tomando decisiones — está construido para durar más allá de sus fundadores.","aplicacion":{"personal":"Documentar y sistematizar el conocimiento que solo tengo yo en la cabeza, para no ser el único \"reloj\" de mis propios proyectos.","proyecto":"Esto conecta con el blueprint que creé en mi Learning Path nº2: dejar los procesos de Reelz tan claros que alguien sin conocimiento previo pudiera encargarse del proyecto.","teamcompany":"Trabajar en SPARK sistemas y documentación que sobrevivan a los cambios de rol dentro del equipo, no solo confiar en que \"alguien ya sabe cómo va esto\"."},"mtime":1785881303},{"id":"contar-historias-con-final-feliz-para-vender","fichero":"Contar historias con final feliz para vender.md","titulo":"Contar historias con final feliz para vender","libro":"El arte de cerrar la venta","competencia":"Branding \u0026 Communication","tags":["herramienta","ventas","storytelling"],"highlight":"\"Cuenta historias: debes apelar a su parte emocional para generar la venta. Cuenta historias de personas que hayan comprado para llegar a cerrar la venta. Siempre esta historia tiene que tener un final feliz.\"","pagina":"","question":"Si le das a un prospecto todos los datos y características técnicas de tu producto, ¿es la forma más efectiva de convencerle?","answer":"No siempre. Los datos convencen a la parte racional, pero las decisiones de compra muchas veces se toman desde la parte emocional. Contar una historia real de alguien que tenía el mismo problema, tomó la decisión de comprar, y le fue bien, conecta emocionalmente de una forma que ninguna lista de características logra. La clave es que la historia siempre termine bien, para que el prospecto se imagine a sí mismo con ese mismo final feliz.","aplicacion":{"personal":"Cuando quiera convencer a alguien de tomar una decisión, apoyarme en una historia real y concreta en vez de solo en argumentos lógicos.","proyecto":"Desarrollar un repertorio de historias reales de clientes de Reelz con final feliz, para usarlas en las llamadas de ventas, tal como decidí en los Next Steps del ensayo.","teamcompany":"Compartir con SPARK las mejores historias de clientes satisfechos para que todo el equipo comercial pueda usarlas en sus propias ventas."},"mtime":1785881511},{"id":"convertirte-en-el-mejor-no-en-el-mayor","fichero":"Convertirte en el mejor, no en el mayor.md","titulo":"Convertirte en el mejor, no en el mayor","libro":"Good to Great","competencia":"Innovation \u0026 Strategy","tags":["concepto","estrategia"],"highlight":"\"Las empresas extraordinarias se centran en ser lo mejores no en el tamaño y crecer.\"","pagina":"","question":"Si tu empresa crece rápido en tamaño (más clientes, más ingresos), ¿significa que se está convirtiendo en extraordinaria?","answer":"No necesariamente. Crecer en tamaño y ser extraordinario son cosas distintas: puedes hacerte grande sin ser realmente el mejor en lo que haces. Las empresas que de verdad llegan a ser extraordinarias ponen el foco en la calidad y la excelencia de lo que hacen, y el crecimiento llega como consecuencia de eso, no como el objetivo en sí mismo.","aplicacion":{"personal":"Revisar si mis propios objetivos están puestos en \"hacerme más grande\" (seguidores, ingresos) o en ser realmente mejor en lo que hago.","proyecto":"Reconozco que en Reelz caigo en este fallo con facilidad; priorizar conscientemente la calidad del servicio sobre la velocidad de crecimiento.","teamcompany":"Cuestionar en SPARK, antes de perseguir una oportunidad de crecimiento rápido, si nos acerca a ser mejores en nuestro concepto erizo o solo nos hace más grandes."},"mtime":1785881269},{"id":"cuadro-estrategico-y-curva-de-valor-diagnosticar-donde-compite-tu-sector","fichero":"Cuadro estratégico y curva de valor - diagnosticar dónde compite tu sector.md","titulo":"Cuadro estratégico y curva de valor: diagnosticar dónde compite tu sector","libro":"La Estrategia del Océano Azul","competencia":"Innovation \u0026 Strategy","tags":["framework","estrategia"],"highlight":"\"El cuadro estratégico es a la vez una herramienta de diagnóstico y de acción para la creación de una estrategia convincente de océano azul. [...] El eje horizontal refleja la gama de variables alrededor de las cuales compite e invierte el sector.\" (pág. 51-53)","pagina":"51","question":"¿Cómo puedo saber, de un vistazo, si mi estrategia es realmente distinta a la de mis competidores o si en el fondo estoy haciendo lo mismo que ellos con matices?","answer":"El cuadro estratégico es un gráfico: en el eje horizontal pones las variables por las que compite tu sector (precio, gama de producto, servicio, etc.) y en el eje vertical el nivel que ofrece cada empresa en cada variable (bajo a alto). Al unir los puntos de una empresa obtienes su curva de valor — su \"huella dactilar\" estratégica. Si mi curva y la de mis competidores tienen básicamente la misma forma, estoy en un océano rojo aunque no lo sepa. El libro además avisa de que preguntar directamente a tus clientes actuales casi nunca sirve para dibujar una curva distinta, porque ellos solo saben pedir \"más por menos\" de lo que ya conocen — la curva divergente sale de cuestionar las variables, no de encuestar.","aplicacion":{"personal":"Dibujar mi propia \"curva de valor\" personal frente a otros compañeros de LEINN en variables como networking, ejecución, creatividad, disciplina — para ver si mi perfil converge con el de todos o realmente diverge en algo. Así desarrollar mis puntos fuertes y débiles.","proyecto":"Dibujar el cuadro estratégico de Reelz frente a 2-3 agencias de edición de vídeo competidoras, usando variables reales (precio, rapidez de entrega, trato personal, creatividad, especialización de nicho) para ver si nuestra curva converge con la suya o diverge.","teamcompany":"Proponer en SPARK dibujar el cuadro estratégico de nuestro Team Company frente a otros equipos de LEINN — dónde estamos realmente por encima o por debajo, en función de lo que sabemos o de información que podemos recabar.\n\n![[Cuadro Estratégico.heic]]"},"mtime":1788953945},{"id":"cuanta-mas-autonomia-le-doy-a-claude-mas-railes-necesito-montados-antes-de-soltarla","fichero":"Cuanta más autonomía le doy a Claude, más raíles necesito montados antes de soltarla.md","titulo":"Cuanta más autonomía le doy a Claude, más raíles necesito montados antes de soltarla","libro":"Claude Code sin supervisión (Curso Anthropic)","competencia":"Digital Skill","tags":["modelo-mental","ia","autonomía"],"highlight":"\"cuanta más autonomía le das, más necesitas haber montado antes los raíles\" (sección Contexto)","pagina":"","question":"¿Por qué no basta con ir confiando cada vez un poco más en Claude a medida que se porta bien?","answer":"Porque confiar más no te protege de nada: si algo sale mal justo el día que decidiste no mirar tan de cerca, ya es tarde. Lo que de verdad protege no es \"confiar más\", es tener puesta de antemano una barrera que no dependa de que tú estés mirando. Cuanta más libertad le das a Claude, menos vale una instrucción que \"normalmente\" se cumple, y más necesitas algo que la haga cumplirse sí o sí.","aplicacion":{"personal":"Antes de dejar una sesión larga de Claude Code corriendo sin mirar cada paso (como esta misma, procesando el vault), definir de antemano qué archivos o carpetas son intocables, en vez de confiar solo en pedírselo por texto.","proyecto":"No encuentro aplicación — hoy no uso Claude Code sin supervisión sobre archivos de Reelz.","teamcompany":"No encuentro aplicación."},"mtime":1786638329},{"id":"cuanto-mas-profundas-las-relaciones-mas-fuerte-el-liderazgo","fichero":"Cuanto más profundas las relaciones, más fuerte el liderazgo.md","titulo":"Cuanto más profundas las relaciones, más fuerte el liderazgo","libro":"El líder que no tenía cargo","competencia":"Team \u0026 Community Learning","tags":["modelo-mental","relaciones","liderazgo"],"highlight":"\"Cuanto más profundas sean tus relaciones, más fuerte será tu liderazgo\" (Pág 183) — \"El objetivo de las empresas es ayudar a las personas, no ganar dinero... Si realmente quieres éxito en tus negocios deberás tratar a las personas excepcionalmente bien.\"","pagina":"183","question":"¿El éxito de un negocio depende principalmente de la calidad del producto o de la calidad de las relaciones humanas dentro y alrededor de él?","answer":"De las relaciones humanas, más de lo que solemos pensar. La clave de los negocios son las personas: una empresa es, en el fondo, una iniciativa humana. Cuanto más fuertes sean las relaciones entre los compañeros de un equipo, mejores serán los resultados. El dinero debería ser una consecuencia de tratar bien a la gente, no el objetivo directo.","aplicacion":{"personal":"Invertir tiempo deliberado en profundizar relaciones cercanas, no solo mantenerlas de forma superficial por falta de tiempo.","proyecto":"En Reelz reconozco que nos falla esto: preguntarnos más a menudo cómo podemos aportar más valor a nuestros clientes y mejorar su experiencia, no solo entregar el servicio.","teamcompany":"Dar mucho más foco a las relaciones dentro de SPARK, algo que mis propios socios me señalaron en el Feedback 360, tal como recogí en los Next Steps del ensayo."},"mtime":1785881156},{"id":"data-beats-opinion-ili-y-oli","fichero":"Data Beats Opinion, ILI y OLI.md","titulo":"Data Beats Opinion: ILI y OLI","libro":"Pretotype It","competencia":"ChangeMaking Experiments","tags":["herramienta","métricas","validación"],"highlight":"\"Data Beats Opinion\" — ILI (Initial Level of Interest) = número de acciones tomadas / número de oportunidades ofrecidas; OLI (Ongoing Level of Interest) debe estar muy cerca del ILI para considerarlo un \"Right It\".","pagina":"","question":"Si \"sientes\" que tu proyecto avanza bien, ¿es suficiente para confiar en que va bien de verdad?","answer":"No. Las sensaciones engañan mucho más de lo que creemos. Hay que convertir el interés de la gente en números concretos: cuántas personas, de las que vieron tu oferta, hicieron algo (ILI), y de esas, cuántas siguieron interesadas después (OLI). Si el OLI se mantiene cerca del ILI inicial, es una señal real de que hay algo ahí — no una corazonada.","aplicacion":{"personal":"Cuando quiera saber si algo que hago (contenido, entrenamiento, proyecto personal) funciona, buscar un número concreto que lo mida en vez de fiarme de \"cómo lo siento\".","proyecto":"Aplicar el modelo de ILI y OLI a Reelz para medir su avance con datos reales y no basarme en sensaciones u opiniones, tal como decidí en los Next Steps del ensayo.","teamcompany":"Impulsar en SPARK que la preparación para el Knowledge Day y la evaluación de proyectos se guíe por estos ratios de interés real, no por impresiones subjetivas del equipo."},"mtime":1785880713},{"id":"definir-el-alcance-en-modo-lectura-antes-de-dejar-trabajar-a-claude-ahorra-mas-que-corregir-despues","fichero":"Definir el alcance en modo lectura antes de dejar trabajar a Claude ahorra más que corregir después.md","titulo":"Definir el alcance en modo lectura antes de dejar trabajar a Claude ahorra más que corregir después","libro":"Claude Code sin supervisión (Curso Anthropic)","competencia":"Digital Skill","tags":["herramienta","ia","planificación"],"highlight":"\"Iterar sobre un plan es muchísimo más rápido que dejarle correr y luego limpiar el desastre.\" (Lección 01)","pagina":"","question":"Si al final vas a revisar el plan igualmente, ¿no es más rápido dejar que Claude empiece directamente y corregir sobre la marcha?","answer":"No, porque lo que parece \"más rápido\" (dejarle correr ya) esconde el coste de deshacer después lo que hizo mal. Revisar un plan es barato: son unas frases, y si algo falta se lo dices y ya está. Deshacer código o notas que ya se escribieron es caro. Adelantar la revisión al plan, antes de que exista nada que deshacer, es lo que de verdad ahorra tiempo.","aplicacion":{"personal":"Pedir el modo plan antes de tareas grandes en el vault (como esta misma sesión, que empezó exactamente así) en vez de dejar que Claude Code se lance directamente a crear o mover archivos.","proyecto":"No encuentro aplicación.","teamcompany":"No encuentro aplicación."},"mtime":1786638335},{"id":"del-precio-estrategico-al-coste-objetivo-invertir-la-formula-del-margen","fichero":"Del precio estratégico al coste objetivo - invertir la fórmula del margen.md","titulo":"Del precio estratégico al coste objetivo: invertir la fórmula del margen","libro":"La Estrategia del Océano Azul","competencia":"Financial Skill","tags":["modelo-mental","pricing","finanzas"],"highlight":"\"Para maximizar el potencial de ganancias de una idea de océano azul, la compañía debería comenzar por el precio estratégico y luego deducir de dicho precio el margen de beneficio para llegar así al coste objetivo. Aquí es esencial el ejercicio de restar el margen del precio y no sumar el margen al coste.\" (pág. 156)","pagina":"156","question":"¿Por qué calcular primero cuánto me cuesta hacer algo y luego sumarle margen para poner el precio puede ser justo el error que me impide encontrar un océano azul?","answer":"La forma normal de poner precios es: coste + margen = precio. El problema es que así el precio queda atado a tu estructura de coste actual, y si tu coste es alto (porque haces las cosas como siempre se han hecho en el sector), tu precio también lo será, aunque quieras venderlo barato. La estrategia de océano azul invierte el orden: primero decides el precio estratégico (el que hace que el grueso del mercado, no solo unos pocos, pueda pagarlo fácilmente — ver nota de Los tres niveles de no clientes), le restas el margen que necesitas ganar, y lo que queda es tu coste objetivo: la cifra a la que TIENES que llegar sí o sí, aunque tu forma actual de operar no te lo permita. Eso te obliga a inventar cómo producir más barato, no a conformarte con lo que ya sabes hacer.","aplicacion":{"personal":"No encuentro aplicación directa.","proyecto":"Si algún día pongo precio a un nuevo proyecto de océano azul, fijar primero el precio que el grueso de la gente podría pagar sin pensarlo, restar lo que quiero ganar, y solo después ver cómo ajustar mi forma de trabajar a ese coste objetivo.","teamcompany":"Si SPARK cobra o factura algo como Team Company (talleres, servicios conjuntos), aplicar esta lógica antes de fijar tarifas: partir de lo que el cliente objetivo pagaría con gusto, no de sumar costes internos sin cuestionarlos."},"mtime":1789035045},{"id":"despues-de-la-pregunta-de-cierre-silencio","fichero":"Después de la pregunta de cierre, silencio.md","titulo":"Después de la pregunta de cierre, silencio","libro":"El arte de cerrar la venta","competencia":"Teampreneurship \u0026 Customer Co-creation","tags":["herramienta","ventas"],"highlight":"\"Después de la pregunta de cierre, SILENCIO. Después de la pregunta debe quedarse en silencio absoluto. No decir ni una palabra, el primero que habla pierde.\"","pagina":"","question":"Después de hacer la pregunta final que puede cerrar una venta, ¿es buena idea seguir hablando para reforzar tu oferta?","answer":"No, es justo lo contrario de lo que conviene hacer. Una vez lanzada la pregunta de cierre, cualquier palabra tuya rompe la tensión y le da al prospecto una excusa para no decidir. El silencio absoluto obliga a que sea la otra persona quien hable primero, y normalmente esa primera respuesta es la que decide la venta. Yo mismo he vivido esta técnica como cliente, sin saber en el momento que me la estaban aplicando.","aplicacion":{"personal":"Practicar el silencio incómodo después de hacer una pregunta importante en cualquier conversación, resistiendo el impulso de rellenar el vacío.","proyecto":"Incorporar el silencio post-cierre como técnica fija en las llamadas de ventas de Reelz, tal como decidí en los Next Steps del ensayo.","teamcompany":"Enseñar esta técnica a mis socios de SPARK que venden, ya que es un detalle pequeño con impacto directo en la tasa de cierre."},"mtime":1785881476},{"id":"detras-de-cada-sistema-de-acciones-hay-un-sistema-de-creencias","fichero":"Detrás de cada sistema de acciones hay un sistema de creencias.md","titulo":"Detrás de cada sistema de acciones hay un sistema de creencias","libro":"Hábitos Atómicos","competencia":"Personal Cultivation","tags":["modelo-mental","creencias","identidad"],"highlight":"\"Detrás de cada sistema de acciones, hay un sistema de creencias.\" / \"Tu identidad se construye con evidencia: la experiencia es lo que crea tu identidad. A medida que refuerces una creencia con actos, más fuerte será.\"","pagina":"","question":"Si repites una y otra vez una acción concreta, ¿estás solo formando un hábito, o algo más?","answer":"Algo más: cada vez que actúas de una forma, no solo repites una acción, también le das a tu cerebro una prueba de qué tipo de persona eres. Esa evidencia acumulada es la que construye —o destruye— tus creencias sobre ti mismo. Por eso cambiar acciones sin preguntarte qué creencia hay detrás no funciona del todo: hay que trabajar ambas cosas a la vez, porque se retroalimentan.","aplicacion":{"personal":"Preguntarme qué creencia sobre mí mismo estoy reforzando —o debilitando— con las acciones que repito cada día.","proyecto":"En Reelz, ser consciente de que cada pequeña acción de calidad (o de descuido) refuerza una creencia del equipo sobre \"qué tipo de proyecto somos\".","teamcompany":"Reflexionar con SPARK sobre qué sistema de creencias compartidas estamos construyendo con nuestras acciones repetidas como equipo."},"mtime":1785881676},{"id":"detras-de-una-queja-hay-un-sentimiento-y-una-peticion","fichero":"Detrás de una queja hay un sentimiento y una petición.md","titulo":"Detrás de una queja hay un sentimiento y una petición","libro":"Comunicación No Violenta","competencia":"Cooperative Leadership","tags":["herramienta","comunicación","conflicto"],"highlight":"Aprendizaje \"Detrás de una queja hay sentimiento y petición\" (Pág 83)","pagina":"83","question":"Cuando alguien se queja de una regla (\"no tiene sentido venir a las 9 am\"), ¿lo mejor es defender la regla con el argumento de por qué existe?","answer":"No. Responder defendiendo la regla (\"pero si lo pusimos como regla de oro\") ignora lo que hay debajo de la queja: un sentimiento y una necesidad real, como querer descansar más. Si en vez de defenderte intentas nombrar esa necesidad (\"parece que te gustaría poder descansar más, ¿verdad?\"), es mucho más fácil encontrar después una solución que sirva a todos, en vez de repetir el mismo debate una y otra vez.","aplicacion":{"personal":"Cuando alguien se queje de algo que hago, buscar la necesidad real detrás de la queja antes de defenderme o justificarme.","proyecto":"En Reelz, si un cliente se queja de algo puntual, indagar en la necesidad de fondo en vez de responder solo al síntoma superficial de la queja.","teamcompany":"Cuando escuche una queja en SPARK, tratar de identificar el sentimiento y la necesidad oculta antes de responder o defenderme, tal como decidí en los Next Steps de este ensayo."},"mtime":1785880626},{"id":"diferenciar-objecion-de-condicion","fichero":"Diferenciar objeción de condición.md","titulo":"Diferenciar objeción de condición","libro":"El arte de cerrar la venta","competencia":"Teampreneurship \u0026 Customer Co-creation","tags":["concepto","ventas","objeciones"],"highlight":"\"Objeción o Condición: Objeción: algo que puede responder y tiene solución. Condición: razón genuina para no continuar. Cuando un prospecto presenta una objeción muchas veces piensa que se trata de una condición. Tú debes darte cuenta de que no y resolverla.\"","pagina":"","question":"Cuando un prospecto pone una pega a tu oferta, ¿deberías darla siempre por definitiva y dejar de insistir?","answer":"No siempre, porque hay dos tipos de pegas muy distintas. Una condición es un motivo real e insalvable para no comprar (por ejemplo, no tiene el dinero). Una objeción, en cambio, es una duda que sí tiene solución si la respondes bien. El error habitual es tratar toda objeción como si fuera una condición cerrada y rendirse, cuando en realidad la mayoría de objeciones se pueden resolver con la respuesta adecuada.","aplicacion":{"personal":"Antes de rendirme ante un \"no\" de alguien, preguntarme si es una condición real o una objeción que todavía puedo resolver con más información.","proyecto":"En las llamadas de Reelz, entrenarme para distinguir rápido si lo que dice el prospecto es una condición genuina o una objeción resoluble, para no abandonar ventas que sí tenían solución.","teamcompany":"Enseñar esta distinción a SPARK como parte del entrenamiento comercial del equipo."},"mtime":1785881489},{"id":"diferenciar-sentimientos-de-pensamientos-y-valoraciones","fichero":"Diferenciar sentimientos de pensamientos y valoraciones.md","titulo":"Diferenciar sentimientos de pensamientos y valoraciones","libro":"Comunicación No Violenta","competencia":"Personal Cultivation","tags":["concepto","comunicación","emociones"],"highlight":"\"Me siento ignorado\" parece un sentimiento pero evalúa lo que hace el resto, lo correcto sería \"Me siento molesto/frustrado porque…\" (Pág 53)","pagina":"53","question":"Cuando dices \"siento que deberías haber hecho esto así\", ¿estás expresando de verdad un sentimiento?","answer":"No. Empezar con \"siento que...\" no garantiza que lo que sigue sea un sentimiento; muchas veces es una opinión disfrazada. Un sentimiento de verdad es algo como \"estoy molesto\" o \"estoy tranquilo\": una emoción pura, sin culpar a nadie. Si después del \"siento que\" viene un juicio sobre el otro (\"ignorado\", \"que deberías\"), en realidad estás pensando, no sintiendo.","aplicacion":{"personal":"Antes de competir, cuando me pregunten \"¿qué sientes?\", contestar con una emoción real (\"tranquilo\", \"nervioso\") en vez de una opinión disfrazada (\"siento que estoy preparado\"), tal como reflexioné en el propio ensayo tras leer el libro.","proyecto":"En conversaciones difíciles dentro de Reelz, revisar mis frases con \"siento que...\" antes de decirlas, y sustituirlas por una emoción real si lo que sigue es en verdad un juicio.","teamcompany":"Escribir una vez por semana en mi Learning Diary cómo me he sentido durante los últimos días, distinguiendo emociones reales de opiniones, tal como decidí en los Next Steps de este ensayo."},"mtime":1785880581},{"id":"dirigir-la-compactacion-en-vez-de-dejarla-resumir-sola","fichero":"Dirigir la compactación en vez de dejarla resumir sola.md","titulo":"Dirigir la compactación en vez de dejarla resumir sola","libro":"Claude Code sin supervisión (Curso Anthropic)","competencia":"Digital Skill","tags":["herramienta","ia","contexto"],"highlight":"\"Todo lo que escribas después del comando moldea el resumen. Ese es tu volante para el contexto.\" (Lección 01)","pagina":"","question":"¿Para qué escribir algo detrás de /compact si Claude ya sabe resumir la conversación por su cuenta?","answer":"Porque si no le dices nada, Claude decide solo qué es importante conservar del resumen, y puede decidir mal: puede resumir justo la parte que a ti no te interesaba y perder el detalle que necesitabas para seguir trabajando. Escribir algo detrás del comando es decirle explícitamente qué no se puede perder en ese resumen — es tu forma de dirigir la compactación en vez de dejarla a su criterio.","aplicacion":{"personal":"Cuando una sesión larga procesando varias fuentes del vault se acerque al límite de contexto, escribir explícitamente qué debe conservar el resumen (por ejemplo, la clasificación de competencias ya decidida) en vez de lanzar /compact a secas.","proyecto":"No encuentro aplicación.","teamcompany":"No encuentro aplicación."},"mtime":1786638340},{"id":"disenar-pruebas-pass-fail-para-cada-hipotesis","fichero":"Diseñar pruebas pass fail para cada hipótesis.md","titulo":"Diseñar pruebas pass/fail para cada hipótesis","libro":"El Manual del Emprendedor","competencia":"ChangeMaking Experiments","tags":["herramienta","experimentación","validación"],"highlight":"\"Cada prueba de captación debe ir acompañada de una hipótesis y un resultado pass/fail. Ejemplo: ¿Conseguiremos un cliente por cada 30 llamadas? Si no, estás jugando a una lotería en la captación.\"","pagina":"","question":"Si pruebas una nueva forma de captar clientes y consigues alguno, ¿significa que la prueba fue un éxito?","answer":"No lo sabes, si no definiste antes qué contaba como éxito. Sin una hipótesis clara de antemano (por ejemplo, \"conseguiré un cliente por cada 30 llamadas\") y un criterio de pass/fail, cualquier resultado se puede interpretar como bueno o malo según te convenga. Eso no es un sistema fiable, es jugar a la lotería con la captación, aunque a veces salga bien.","aplicacion":{"personal":"Antes de repetir una acción personal esperando un resultado (por ejemplo, en el estudio o el entrenamiento), definir de antemano qué número contaría como éxito.","proyecto":"Para cada nuevo experimento en Reelz, aplicar el proceso de hipótesis y prueba pass/fail, tal como decidí en los Next Steps del ensayo.","teamcompany":"Instaurar en SPARK que ningún experimento de captación se lance sin una hipótesis numérica clara definida antes de empezar."},"mtime":1785881387},{"id":"duro-en-el-trabajo-amigable-fuera","fichero":"Duro en el trabajo, amigable fuera.md","titulo":"Duro en el trabajo, amigable fuera","libro":"The Duolingo Handbook","competencia":"Cooperative Leadership","tags":["herramienta","feedback","cultura"],"highlight":"\"Su mantra es 'hard on the work, easy on the people' que defiende dar feedback constructivo y claro, que mejoran las ideas sin dañar las relaciones. Mantener siempre los feedbacks en el 'what' no en el 'who'.\"","pagina":"","question":"Si quieres mantener buen ambiente en tu equipo, ¿lo mejor es suavizar el feedback para no incomodar a nadie?","answer":"No, según esta cultura son dos cosas distintas y compatibles: puedes ser muy exigente con el trabajo (el \"qué\") y a la vez muy amable con las personas (el \"quién\"). El error es mezclar ambas cosas: criticar el trabajo suavemente por miedo a herir a la persona, lo cual perjudica el resultado, o criticar el trabajo atacando a la persona, lo cual perjudica la relación. Separarlas te permite ser duro con la calidad sin dañar el vínculo.","aplicacion":{"personal":"Practicar dar feedback exigente sobre acciones concretas (\"el qué\"), sin que se convierta en un juicio sobre la persona (\"el quién\").","proyecto":"Aplicar este mantra en Reelz cuando algo no cumple el estándar de calidad: ser exigente con el resultado, cuidadoso con la persona.","teamcompany":"Llevar esta cultura a las dinámicas de feedback en SPARK (ITVs, Feedback 360), separando siempre la crítica al trabajo de la crítica a la persona."},"mtime":1785881575},{"id":"el-abismo-de-desilusion-el-trabajo-se-acumula","fichero":"El abismo de desilusión, el trabajo se acumula.md","titulo":"El abismo de desilusión: el trabajo no se pierde, se acumula","libro":"Hábitos Atómicos","competencia":"Personal Cultivation","tags":["modelo-mental","paciencia","hábitos"],"highlight":"\"Si la temperatura empieza a subir un cubo de hielo se derrite en un grado exacto, pero eso no significa que sea ese grado únicamente. Sino el conjunto de grados que se han ido aumentando. Esa parte del proceso en el que no se ven resultados es el abismo de desilusión. 'El trabajo no se pierde, solo se acumula.'\"","pagina":"","question":"Si llevas tiempo trabajando en un hábito y no ves ningún cambio todavía, ¿significa que no está funcionando?","answer":"No. Es como calentar un cubo de hielo: la temperatura sube grado a grado por debajo, sin que pase nada visible, hasta que de golpe llega al punto exacto en el que empieza a derretirse. Ese tramo donde no ves nada, pero el calor sigue subiendo por dentro, es el \"abismo de desilusión\". Saber que existe te ayuda a aguantar en él, porque entiendes que el trabajo no desaparece, se está acumulando aunque no lo veas todavía.","aplicacion":{"personal":"Cuando lleve tiempo con un hábito sin ver resultados, recordar que probablemente estoy en el abismo de desilusión, no fracasando.","proyecto":"En Reelz, no abandonar una estrategia solo porque no dé resultados visibles en las primeras semanas, si sigo teniendo motivos para creer que el \"calor\" se está acumulando.","teamcompany":"Explicar este concepto a SPARK en las fases donde el esfuerzo del equipo no se traduce todavía en resultados visibles, para sostener la motivación colectiva."},"mtime":1785881651},{"id":"el-acronimo-serve-para-liderar-sirviendo","fichero":"El acrónimo SERVE para liderar sirviendo.md","titulo":"El acrónimo SERVE para liderar sirviendo","libro":"El líder que no tenía cargo","competencia":"Cooperative Leadership","tags":["plantilla","liderazgo"],"highlight":"\"SERVE\" (Pág 197): Ser Servicial (haz más de lo que exige tu salario), Escuchar (habla menos, escucha más), Relacionarse (con socios y clientes), Valorar la diversión, Estimar y cuidar a la gente. \"Cuida a la gente que el dinero se cuidará a sí mismo.\"","pagina":"197","question":"Si quieres tener más éxito en tu negocio, ¿el primer paso es mejorar tu producto o mejorar cómo tratas a la gente?","answer":"Tratar bien a la gente, según este marco. SERVE resume cinco comportamientos: ser servicial más allá de lo mínimo exigido, escuchar más de lo que hablas, cuidar las relaciones con socios y clientes, valorar la diversión en el trabajo, y estimar a las personas que se cruzan contigo. La idea de fondo es que si cuidas de verdad a la gente, el resultado económico llega solo, como consecuencia.","aplicacion":{"personal":"Trabajar la \"R\" de Relacionarse, ya que reconozco que es uno de mis puntos débiles por estar siempre ocupado con tareas.","proyecto":"En Reelz, mejorar la relación con nuestros clientes —que suele ser muy digital— pensando en organizar algún evento presencial que refuerce ese vínculo.","teamcompany":"Aplicar SERVE dentro de SPARK: ser más servicial de lo estrictamente necesario con mis socios y priorizar escuchar antes que hablar en las reuniones de equipo."},"mtime":1785881149},{"id":"el-acronimo-spark-del-liderazgo-de-robin-sharma","fichero":"El acrónimo SPARK del liderazgo de Robin Sharma.md","titulo":"El acrónimo SPARK del liderazgo de Robin Sharma","libro":"El líder que no tenía cargo","competencia":"Cooperative Leadership","tags":["plantilla","liderazgo"],"highlight":"\"SPARK\" (Pág 152): Sinceridad (decir las cosas como son, con vocabulario de liderazgo), Priorizar (regla 80/20), Adversidad crea oportunidad (\"si te derriban siete veces, levántate ocho\"), Responder ante las dificultades (no reaccionar), Kudos (ensalzar, inspirar e impulsar a los demás).","pagina":"152","question":"Si tuvieras que recordar en cinco palabras qué significa liderar bien, ¿cuáles usarías?","answer":"El autor las resume con el acrónimo SPARK: decir la verdad con tacto (Sinceridad), centrarte en lo que de verdad importa (Priorizar), ver los problemas como oportunidades (Adversidad), no reaccionar de golpe sino responder con cabeza (Responder), y celebrar e impulsar a los demás (Kudos). Que estas siglas coincidan justo con el nombre de mi propia team company hace que me sea muy fácil recordarlas y volver a ellas.","aplicacion":{"personal":"Repasar mentalmente las cinco letras de SPARK antes de una situación de liderazgo personal complicada, como guía rápida de cómo actuar.","proyecto":"Aplicar \"Priorizar\" (regla 80/20) a las tareas de Reelz, centrando mi energía en lo que realmente genera impacto en el proyecto.","teamcompany":"Usar el acrónimo SPARK como marco de liderazgo explícito dentro de mi propia team company SPARK, ejerciendo mi liderazgo desde la sinceridad, la priorización, la adversidad como oportunidad, la respuesta calmada y el reconocimiento a los demás."},"mtime":1785881141},{"id":"el-ambiente-pesa-mas-que-la-motivacion","fichero":"El ambiente pesa más que la motivación.md","titulo":"El ambiente pesa más que la motivación","libro":"Hábitos Atómicos","competencia":"Personal Cultivation","tags":["concepto","ambiente","hábitos"],"highlight":"\"El ambiente es la mano invisible que moldea tu comportamiento. Si cambias tu ambiente cambiará tu comportamiento.\" / \"Muchas veces se asocia a las personas más saludables con las personas con más autocontrol. Cuando realmente muchas veces influye más cuántos disparadores hay en tu entorno que cuánto autocontrol uno tiene.\"","pagina":"","question":"Si dos personas tienen la misma fuerza de voluntad, ¿tendrán los mismos hábitos?","answer":"No necesariamente, porque lo que más influye no es cuánta fuerza de voluntad tienen, sino cuántas tentaciones y señales hay en su entorno. A la gente que parece muy disciplinada muchas veces simplemente le rodea un ambiente con menos disparadores de malos hábitos. Cambiar tu entorno (qué ves, qué tienes a mano) cambia tu comportamiento de forma mucho más fiable que intentar tener más fuerza de voluntad.","aplicacion":{"personal":"Rediseñar mi entorno físico (habitación, cocina, mesa de trabajo) para que favorezca los hábitos que quiero y dificulte los que no, en vez de confiar solo en mi disciplina.","proyecto":"En Reelz, diseñar el \"ambiente\" de trabajo del equipo (herramientas, plantillas visibles, recordatorios) para que las buenas prácticas sean la opción más fácil por defecto.","teamcompany":"Proponer a SPARK rediseñar el espacio de trabajo o los canales digitales del equipo para que empujen hacia los comportamientos que queremos reforzar como cultura."},"mtime":1785881692},{"id":"el-concepto-del-erizo-los-3-circulos","fichero":"El concepto del erizo, los 3 círculos.md","titulo":"El concepto del erizo: los 3 círculos","libro":"Good to Great","competencia":"Innovation \u0026 Strategy","tags":["framework","estrategia","propósito"],"highlight":"Los 3 círculos: \"En qué puedes ser el mejor del mundo\", \"Qué dirige tu motor económico\", \"Qué es lo que más te apasiona\" — \"El enfoque no debe ser 'vamos a apasionarnos por lo que hacemos', sino 'solo deberíamos hacer aquellas cosas que de verdad nos puedan apasionar'.\"","pagina":"","question":"¿Es mejor perseguir muchas metas y frentes a la vez (como un zorro), o simplificarlo todo en una sola idea clara (como un erizo)?","answer":"Las empresas extraordinarias actúan como erizos, no como zorros: en vez de dispersarse en mil frentes, encuentran la intersección exacta entre tres cosas: en qué pueden ser los mejores del mundo, qué mueve de verdad su economía, y qué les apasiona genuinamente. Ese punto de encuentro es su \"concepto erizo\", y una vez lo tienen claro, todo lo demás se simplifica alrededor de él. Es muy parecido al Ikigai, aunque a este modelo le falta el cuarto círculo de \"qué necesita el mundo\".","aplicacion":{"personal":"Reflexionar sobre mis propios tres círculos (en qué puedo ser el mejor, qué me apasiona, qué me sostiene económicamente) para no dispersarme en demasiados frentes personales.","proyecto":"Definir con claridad cuál puede ser el concepto erizo de Reelz, sobre todo cuando surja la tentación de diversificar en muchos servicios distintos.","teamcompany":"Trabajar con SPARK este ejercicio de los tres círculos antes de decidir hacia dónde enfocar los recursos del equipo, en vez de perseguir cualquier oportunidad de dinero rápido."},"mtime":1785881262},{"id":"el-coste-oculto-del-multitasking","fichero":"El coste oculto del multitasking.md","titulo":"El coste oculto del multitasking","libro":"Ikigai","competencia":"Self Driven Learning","tags":["concepto","productividad"],"highlight":"\"estamos haciendo es cambiar de una tarea a otra rápidamente\" / \"Reduce la productividad (un 60 %), aunque no lo parezca\"","pagina":"","question":"¿Hacer dos cosas a la vez te hace más productivo o solo te hace sentir más ocupado?","answer":"Cuando crees que estás \"haciendo varias cosas a la vez\", en realidad tu cerebro va saltando de una tarea a otra muy rápido, y cada salto tiene un coste. El resultado es que acabas rindiendo hasta un 60% menos que si hicieras las cosas una detrás de otra, aunque la sensación sea justo la contraria.","aplicacion":{"personal":"Dejar el móvil fuera de la vista (no solo en silencio) durante bloques de trabajo o entrenamiento para eliminar el salto constante de atención.","proyecto":"Definir en el proyecto que se trabaja en bloques de una sola tarea (por ejemplo, \"solo diseño\" o \"solo ventas\") en vez de saltar entre frentes distintos en la misma sesión.","teamcompany":"En TLS reducir estímulos y estar al 100% centrado en la reunión y el provecho que se puede sacar de la misma."},"mtime":1785928406},{"id":"el-efecto-diderot-para-encadenar-habitos","fichero":"El efecto Diderot para encadenar hábitos.md","titulo":"El efecto Diderot para encadenar hábitos","libro":"Hábitos Atómicos","competencia":"Personal Cultivation","tags":["herramienta","hábitos"],"highlight":"\"Este efecto es buenísimo para llevar a cabo varios hábitos. Siguiendo esta fórmula: Después de [HÁBITO ACTUAL] haré [NUEVO HÁBITO]. Esto facilita mucho, porque vinculas una conducta que ya no te cuesta.\"","pagina":"","question":"Si ya tienes un hábito sólido (como desayunar cada día), ¿es buena idea aprovecharlo para instaurar uno nuevo?","answer":"Sí, es justo la forma más fácil de crear un hábito nuevo: engancharlo a uno que ya haces sin esfuerzo. La fórmula es simple: \"después de [lo que ya hago], haré [lo nuevo]\". Como el primer hábito ya está automatizado, sirve de señal fiable para disparar el segundo, sin necesitar fuerza de voluntad extra ni acordarte de él por separado.","aplicacion":{"personal":"Sin darme cuenta, ya apliqué esto vinculando la meditación y el journaling justo después de desayunar; identificar un nuevo hábito que pueda encadenar de la misma forma a otro ya automático.","proyecto":"En Reelz, encadenar una nueva buena práctica (revisar métricas, por ejemplo) justo después de una reunión que ya hacemos siempre, para que se vuelva automática.","teamcompany":"Proponer a SPARK anclar nuevos rituales de equipo a reuniones o momentos que ya tenemos consolidados, en vez de crear espacios nuevos que cuesta sostener."},"mtime":1785881708},{"id":"el-embudo-captar-retener-aumentar","fichero":"El embudo, captar retener aumentar.md","titulo":"El embudo: captar, retener, aumentar","libro":"El Manual del Emprendedor","competencia":"Business Model Creation","tags":["framework","clientes","ingresos"],"highlight":"Fase de aumentar: upselling (ofertas especiales), referencias, etc. — para retener: cumplir las promesas, programas de fidelización, encuestas de satisfacción, incrementar los costes de salida.","pagina":"","question":"Si tu negocio se centra solo en conseguir clientes nuevos, ¿estás aprovechando todo el potencial de ingresos que tienes?","answer":"No, te falta la mayor parte del embudo. Captar clientes es solo el primer tercio: después hay que retenerlos (que sigan contigo, cumpliendo lo que prometiste) y aumentar lo que gastan contigo (ofertas especiales, referencias). Muchos proyectos gastan toda su energía en captar y descuidan retener y aumentar, cuando ahí suele estar buena parte del potencial de ingresos sin explotar.","aplicacion":{"personal":"Aplicar esta lógica de \"no solo captar\" a mis propias relaciones o proyectos personales: cuidar y hacer crecer lo que ya tengo, no solo buscar cosas nuevas.","proyecto":"En Reelz veo mucho potencial sin explotar en las fases de retener y aumentar; mejorar nuestra retención de clientes con las técnicas del libro, tal como decidí en los Next Steps.","teamcompany":"Proponer en SPARK medir no solo cuántos clientes nuevos captamos, sino cuántos retenemos y cuánto conseguimos aumentar su gasto con nosotros."},"mtime":1785881403},{"id":"el-lienzo-de-modelo-de-negocio","fichero":"El lienzo de modelo de negocio.md","titulo":"El lienzo de modelo de negocio","libro":"El Manual del Emprendedor","competencia":"Business Model Creation","tags":["herramienta","modelo-de-negocio"],"highlight":"\"Un plan de negocio no sobrevive al primer contacto con los clientes por lo que es necesario utilizar un lienzo del modelo de negocio. Plan de negocio ≠ libro de recetas.\" — ramas del lienzo: asociaciones clave, propuesta de valor, relaciones con el cliente, segmentos de mercado, recursos clave, canales, estructura de costes, fuentes de ingreso.","pagina":"","question":"¿Un plan de negocio de 40 páginas es una herramienta útil para una startup que todavía no conoce a sus clientes?","answer":"No demasiado, porque un plan de negocio se escribe como si ya supieras la respuesta, y en una startup casi nunca la sabes todavía. El lienzo de modelo de negocio es distinto: es un mapa vivo de una sola página con ocho piezas (propuesta de valor, clientes, canales, ingresos...) que puedes actualizar cada semana según lo que vas aprendiendo, en vez de un documento cerrado que nadie vuelve a mirar.","aplicacion":{"personal":"Usar el lienzo, aunque sea de forma simplificada, para cualquier idea personal antes de escribir un \"plan\" cerrado sobre ella.","proyecto":"Establecer un ciclo de actualización bisemanal del Lienzo de Modelo de Negocio de Reelz, incluso creando un lienzo para cada característica nueva (eventos, infoproductos, high-tickets), tal como decidí en los Next Steps.","teamcompany":"Proponer en SPARK crear el lienzo durante la reunión semanal de seguimiento del proyecto, como referencia visual de los cambios a lo largo del tiempo."},"mtime":1785881371},{"id":"el-modo-auto-vigila-la-intencion-no-si-el-resultado-es-correcto","fichero":"El modo auto vigila la intención, no si el resultado es correcto.md","titulo":"El modo auto vigila la intención, no si el resultado es correcto","libro":"Claude Code sin supervisión (Curso Anthropic)","competencia":"Digital Skill","tags":["modelo-mental","ia","verificación"],"highlight":"\"Comprueba la intención, no la corrección. No detecta si el código funciona. Si le pides refactorizar la autenticación y escribe una autenticación rota, el clasificador la deja pasar, porque roto no es peligroso.\" (Lección 04)","pagina":"","question":"Si el modo auto ya está revisando cada acción de Claude, ¿puedo confiar en que lo que hace está bien hecho?","answer":"No del todo: el modo auto solo vigila que Claude no haga algo peligroso, como borrar algo importante o mandar datos fuera. No comprueba si lo que escribió está bien. Puede hacer algo mal y el modo auto lo deja pasar igual, porque \"mal hecho\" no es lo mismo que \"peligroso\". Para saber si está bien hecho hace falta otra comprobación aparte — que el modo auto lo haya dejado pasar no significa nada sobre la calidad del resultado.","aplicacion":{"personal":"Si algún día uso el modo auto para dejar a Claude Code trabajando solo en el vault, recordar que ese modo no comprueba si las notas están bien escritas, solo que no haga algo peligroso — seguiría necesitando revisar el contenido yo mismo.","proyecto":"No encuentro aplicación.","teamcompany":"No encuentro aplicación."},"mtime":1786638360},{"id":"el-periodo-de-crisis-necesario-para-subir-de-nivel","fichero":"El periodo de crisis necesario para subir de nivel.md","titulo":"El periodo de crisis necesario para subir de nivel","libro":"El líder que no tenía cargo","competencia":"Personal Cultivation","tags":["modelo-mental","crecimiento","crisis"],"highlight":"Aprendizaje \"Periodo de Crisis\" (Pág 150): cuando estás en una zona de incomodidad para producir una mejora, se produce una fase de crisis en la que todo parece desmoronarse; para llegar a una versión mejorada de ti, hay que pasar por ella.","pagina":"150","question":"Si al intentar mejorar algo de repente sientes que vas peor que antes de empezar, ¿significa que el cambio no está funcionando?","answer":"No, es justo lo contrario: es la señal de que estás en medio del proceso. En el breaking pasa constantemente al intentar mejorar un paso: primero tienes que \"desaprender\" cómo lo hacías, y en ese tramo te sientes peor que al empezar. Ese bajón (el \"periodo de crisis\") no es un fallo, es un paso necesario antes de llegar a la recompensa que buscas.","aplicacion":{"personal":"Cuando note que empeoro justo al intentar mejorar una habilidad (en el breaking o en cualquier otro ámbito), reconocerlo como el periodo de crisis necesario, no como una señal de fracaso.","proyecto":"En Reelz, si un cambio de estrategia genera una caída temporal en resultados, evaluar si es una crisis necesaria de transición antes de revertir la decisión.","teamcompany":"Explicar a mis socios de SPARK este concepto cuando atravesemos una fase difícil tras un cambio de rumbo, para que no lo interpretemos como que el cambio fue un error."},"mtime":1785881134},{"id":"el-problema-de-las-opiniones-testear-no-preguntar","fichero":"El problema de las opiniones, testear no preguntar.md","titulo":"El problema de las opiniones: testear, no preguntar","libro":"Pretotype It","competencia":"Teampreneurship \u0026 Customer Co-creation","tags":["concepto","validación","clientes"],"highlight":"\"Debes testear tus ideas, no preguntar acerca de ellas.\" — sobre Thoughtland: \"La mayoría de ideas se pierden en este terreno, en el que nunca pasan a la ejecución.\"","pagina":"","question":"Si le preguntas a diez personas si comprarían tu producto y todas dicen que sí, ¿significa que lo van a comprar?","answer":"No. Nadie tiene una bola de cristal, ni siquiera la gente a la que le preguntas: sus respuestas sobre algo hipotético no son fiables porque no cuestan nada decirlas. Lo único que de verdad te dice la verdad es el mercado real, cuando la gente actúa (paga, hace clic, se compromete), no cuando opina. Por eso hay que sacar la idea del terreno de la imaginación (\"Thoughtland\") lo antes posible y ponerla a prueba de verdad.","aplicacion":{"personal":"Cuando dude sobre una decisión personal, dejar de preguntar opiniones a mi alrededor y buscar en su lugar una forma de probarlo yo mismo con una acción pequeña.","proyecto":"En las conversaciones de descubrimiento de clientes de Reelz, dejar de preguntar \"¿te gustaría esto?\" y diseñar en su lugar una prueba real que mida una acción concreta.","teamcompany":"En SPARK, cuando surja una nueva idea de proyecto, resistir la tentación de debatirla solo con opiniones internas del equipo y sacarla cuanto antes a testarse con el mercado real."},"mtime":1785880738},{"id":"el-proceso-justo-participacion-explicacion-y-expectativas-claras","fichero":"El proceso justo - participación explicación y expectativas claras.md","titulo":"El proceso justo: participación, explicación y expectativas claras","libro":"La Estrategia del Océano Azul","competencia":"Cooperative Leadership","tags":["framework","liderazgo"],"highlight":"\"Los tres principios del proceso justo: Participación, Explicación, Expectativas claras. Producen confianza y compromiso ('Siento que mis opiniones se tienen en cuenta'), desembocando en cooperación volu

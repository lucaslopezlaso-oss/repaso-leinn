aciones en los costes [...] una segunda palanca [...] es la de las alianzas [...] la tercera palanca que las compañías pueden utilizar [...] cambiar el modelo de fijación de precios del sector.\" (pág. 157-159)","pagina":"157","question":"Si ya decidí mi coste objetivo (ver nota de precio estratégico) pero mi coste real actual es mucho más alto, ¿de dónde saco la diferencia sin sacrificar calidad?","answer":"Hay tres caminos, no solo uno, para cerrar la brecha entre tu coste actual y tu coste objetivo. Primero, innovar en cómo operas (Ford con la cadena de montaje, Swatch rediseñando el producto para bajar mano de obra del 30% al 10% del coste), cambiar el proceso, no solo apretar. Segundo, hacer alianzas para conseguir capacidades rápido sin construirlas tú mismo y sin cargarte de costes fijos (SAP usando las redes de Accenture y Capgemini en vez de montar su propia fuerza de ventas global). Tercero, cambiar el modelo de cobro del sector en vez de bajar el precio (NetJets no bajó el precio de un avión, inventó el \"tiempo compartido\" — mismo valor, forma de pago completamente distinta). Muchas veces la palanca más rápida no es la operativa (que tarda) sino la de modelo de precios (que es casi inmediata).","aplicacion":{"personal":"Antes de descartar una meta personal por \"no tener tiempo/dinero suficiente\", probar las tres palancas: ¿puedo cambiar cómo lo hago (proceso)?, ¿puedo aliarme con alguien que ya tenga esa capacidad?, ¿puedo cambiar la forma en que \"pago\" el esfuerzo (repartirlo distinto en el tiempo)?","proyecto":"Si en Reelz el coste objetivo de un servicio queda por debajo de lo que nos cuesta hoy, explorar las tres vías antes de subir precio: rediseñar el propio proceso de edición, buscar alianzas con freelancers o herramientas que abaraten una parte del trabajo, o cambiar el modelo de cobro (ej. suscripción por proyecto en vez de mensual).","teamcompany":"Si SPARK quiere lanzar algo que hoy parece caro de sostener como Team Company, revisar si existe una alianza externa (con otro Team Company, con una empresa colaboradora) que resuelva parte del coste sin que lo asuma todo el equipo."},"mtime":1789035109},{"id":"logoterapia-quien-tiene-un-porque-puede-soportar-casi-cualquier-como","fichero":"Logoterapia - quien tiene un porqué puede soportar casi cualquier cómo.md","titulo":"Logoterapia: quien tiene un porqué puede soportar casi cualquier cómo","libro":"Ikigai","competencia":"Personal Cultivation","tags":["modelo-mental","resiliencia","propósito"],"highlight":"\"todo le puede ser arrebatado a una persona, excepto una cosa, la última de las libertades humanas: la elección de cómo se enfrenta uno a las circunstancias que le son dadas, la elección del propio camino» ... quien tiene un porqué para vivir, puede soportar casi cualquier cómo\"","pagina":"","question":"¿Qué permitió a algunas personas sobrevivir psicológicamente a un campo de concentración mientras otras se rendían?","answer":"Viktor Frankl se dio cuenta de que hay una cosa que nadie puede quitarte: cómo decides reaccionar ante lo que te pasa. Y descubrió que las personas que tenían un motivo claro por el que seguir vivas aguantaban lo que fuera. Al método de sanar encontrando ese \"para qué\" lo llamó logoterapia.","aplicacion":{"personal":"Cuando algo me supere (estrés, bloqueo con algún proyecto...), cambiar la pregunta \"¿por qué me pasa esto?\" por \"¿para qué / por quién sigo adelante con esto?\".","proyecto":"Escribir explícitamente el \"porqué\" de cada proyecto más allá del modelo de negocio, y volver a leerlo cada vez que el proyecto atraviese un bache serio.","teamcompany":"En momentos de crisis de equipo, realizar la pregunta \"¿cuál es nuestro porqué como equipo y seguimos alineados con él?\" antes de tomar decisiones grandes."},"mtime":1785927672},{"id":"los-4-tipos-de-problema-de-un-cliente","fichero":"Los 4 tipos de problema de un cliente.md","titulo":"Los 4 tipos de problema de un cliente","libro":"El Manual del Emprendedor","competencia":"Teampreneurship \u0026 Customer Co-creation","tags":["modelo-mental","clientes"],"highlight":"\"Problema latente: tiene un problema, pero no lo sabe. Problema pasivo: saben del problema pero no están motivados o no saben de la posibilidad de cambio. Problema activo: reconocen un problema y están buscando solución, pero no han hecho un esfuerzo serio. Una visión: tienen una idea para resolver el problema o incluso han prototipado algo ellos mismos, pero estarían dispuestos a pagar por una mejor.\"","pagina":"","question":"Si dos personas tienen exactamente el mismo problema, ¿vas a poder venderles tu solución de la misma manera?","answer":"No, porque no todos están en el mismo punto respecto a su problema. Uno puede ni siquiera saber que tiene el problema (latente), otro lo sabe pero no ha hecho nada al respecto (pasivo), otro ya lo está buscando activamente (activo), y otro incluso ya intentó resolverlo por su cuenta (tiene una visión). A cada uno hay que hablarle y venderle de forma distinta, según en qué nivel de conciencia esté sobre su propio problema.","aplicacion":{"personal":"Antes de intentar convencer a alguien de algo, identificar en qué nivel de conciencia está sobre el problema que quiero ayudarle a resolver.","proyecto":"En las llamadas de ventas de Reelz, identificar en qué nivel está cada prospecto para adaptar el discurso, en vez de usar siempre el mismo enfoque.","teamcompany":"Enseñar esta distinción a mis socios de SPARK para que el equipo comercial adapte su discurso según el tipo de cliente que tiene delante."},"mtime":1785881379},{"id":"los-6-requisitos-basicos-para-cerrar-una-venta","fichero":"Los 6 requisitos básicos para cerrar una venta.md","titulo":"Los 6 requisitos básicos para cerrar una venta","libro":"El arte de cerrar la venta","competencia":"Teampreneurship \u0026 Customer Co-creation","tags":["plantilla","ventas"],"highlight":"\"6 requisitos básicos para cerrar: debe estar positivo, entusiasmado y ansioso por cerrar la venta; debe tener claro todo lo que requiere el prospecto; el prospecto debe entender su oferta y el valor que tiene para él; el prospecto debe creer y confiar en usted; el prospecto debe desear disfrutar de las ventajas de su oferta; el producto debe ser apropiado para el cliente.\"","pagina":"","question":"Si te preparas bien y transmites entusiasmo, ¿es suficiente para cerrar cualquier venta?","answer":"No, hacen falta seis cosas a la vez, y si falta una, el cierre se complica. No basta con tu entusiasmo: el prospecto también tiene que entender el valor real de tu oferta, confiar en ti, desear de verdad las ventajas que ofreces, y que el producto encaje realmente con sus necesidades. Es una checklist útil para revisar, antes de cerrar, qué pieza puede estar faltando.","aplicacion":{"personal":"Usar esta misma lógica de checklist antes de \"vender\" una idea propia a alguien (un proyecto, un plan), revisando qué piezas me faltan por cubrir.","proyecto":"Revisar el discurso de ventas de Reelz contra estos seis requisitos antes de cada llamada importante.","teamcompany":"Compartir esta checklist con el equipo comercial de SPARK como filtro común antes de intentar cerrar una venta."},"mtime":1785881466},{"id":"los-7-fundamentales-del-liderazgo-personal-por-la-manana","fichero":"Los 7 fundamentales del liderazgo personal por la mañana.md","titulo":"Los 7 fundamentales del liderazgo personal por la mañana","libro":"El líder que no tenía cargo","competencia":"Personal Cultivation","tags":["plantilla","rutina","hábitos"],"highlight":"Los 7 Fundamentales del Liderazgo Personal (Pág 241): Aprendizaje, Afirmaciones, Visualización, Diario, Fijación de Objetivos, Ejercicio, Nutrición — el autor recomienda dedicar por la mañana 1h a elegir uno de ellos.","pagina":"241","question":"Si solo tuvieras una hora cada mañana para invertir en ti mismo antes de que empiece el caos del día, ¿en qué la usarías?","answer":"El autor propone siete opciones concretas —aprender algo, afirmaciones, visualizar, escribir un diario, fijar objetivos, hacer ejercicio, cuidar la nutrición— y sugiere dedicar la primera hora del día a una de ellas, no a revisar el móvil. No hace falta hacerlas todas cada día: basta con elegir una y sostenerla como ritual matutino.","aplicacion":{"personal":"Trabajar matutinamente mis hábitos, alternando entre visualizar, fijar objetivos, meditar, escribir en mi diario o afirmar, tal como decidí en los Next Steps del ensayo.","proyecto":"Reservar parte de esa primera hora, cuando corresponda a \"fijación de objetivos\", para definir la prioridad del día en Reelz antes de abrir el móvil o el correo.","teamcompany":"Compartir esta práctica con mis socios de SPARK como propuesta de cultura de equipo, para que cada uno tenga su propio ritual matutino antes de llegar al Lab."},"mtime":1785881172},{"id":"los-9-pecados-capitales-en-startups","fichero":"Los 9 pecados capitales en startups.md","titulo":"Los 9 pecados capitales en startups","libro":"El Manual del Emprendedor","competencia":"ChangeMaking Experiments","tags":["plantilla","emprendimiento","errores"],"highlight":"Los 9 pecados: suponer que sabes qué quiere el cliente, suponer las características del producto, concentrarse en la fecha de lanzamiento, enfatizar la ejecución en vez de la hipótesis y el aprendizaje, presumir de un plan sin pruebas ni errores, confundir puestos tradicionales con lo que necesita una startup, que comercial y marketing ejecuten según un plan fijo, suponer que el éxito está garantizado, y gestionar solo emergencias (\"apagar fuegos\").","pagina":"","question":"Si tu startup avanza rápido ejecutando un plan bien definido, ¿es una buena señal?","answer":"No siempre, puede ser justo el problema. Muchos de estos \"pecados\" son formas de avanzar rápido, pero en la dirección equivocada: dar por hecho que sabes lo que quiere el cliente sin comprobarlo, obsesionarte con la fecha de lanzamiento en vez de con validar hipótesis, o tratar tu plan de empresa como si fuera un hecho probado. La mayoría de estos errores comparten una raíz común: sustituir el aprendizaje real por la suposición y la ejecución ciega.","aplicacion":{"personal":"Revisar esta lista antes de lanzarme a cualquier iniciativa personal nueva, como checklist de errores a evitar desde el principio.","proyecto":"Contrastar periódicamente las decisiones de Reelz contra esta lista, sobre todo el pecado de \"suponer que sé lo que quiere el cliente\".","teamcompany":"Compartir esta lista con SPARK como lenguaje común para detectar cuándo estamos cayendo en alguno de estos errores típicos de startup."},"mtime":1785881347},{"id":"los-resultados-no-son-inmediatos-el-progreso-se-acumula","fichero":"Los resultados no son inmediatos, el progreso se acumula.md","titulo":"Los resultados no son inmediatos, el progreso se acumula","libro":"El líder que no tenía cargo","competencia":"Personal Cultivation","tags":["concepto","disciplina","paciencia"],"highlight":"\"Que todavía no hayas recibido los beneficios de tus buenas acciones no significan que no llegarán\" (Pág 42)","pagina":"42","question":"Si llevas semanas esforzándote y no ves ningún resultado, ¿significa que lo que haces no está funcionando?","answer":"No. Muchas veces mantenemos buenos hábitos durante días o semanas sin ver nada, pero todo ese esfuerzo se va acumulando por debajo, aunque no lo veas. Y de repente, un día, parece que \"se nota\" — pero no es por lo que hiciste ese día en concreto, es el fruto de todo lo que llevabas tiempo cultivando. Un amigo me lo resumió una vez con una frase que nunca olvidé: \"tiempo al tiempo\".","aplicacion":{"personal":"En mi preparación deportiva, confiar en el proceso incluso en las etapas donde el esfuerzo no se traduce todavía en resultados visibles en competición.","proyecto":"En Reelz, no juzgar el valor de una acción solo por si generó un resultado inmediato, sino por si suma al progreso acumulado del proyecto.","teamcompany":"Recordar a mis socios de SPARK, en los momentos donde el esfuerzo colectivo no se ve reflejado todavía en resultados, que el trabajo se está acumulando aunque no sea visible aún."},"mtime":1785881101},{"id":"los-tres-niveles-de-no-clientes-mirar-mas-alla-de-los-clientes-actuales","fichero":"Los tres niveles de no clientes - mirar más allá de los clientes actuales.md","titulo":"Los tres niveles de no clientes: mirar más allá de los clientes actuales","libro":"La Estrategia del Océano Azul","competencia":"Teampreneurship \u0026 Customer Co-creation","tags":["concepto","customer-discovery"],"highlight":"\"En lugar de concentrarse en los clientes, deben volver sus ojos hacia los que no son clientes. Y en lugar de focalizarse en las diferencias entre los clientes, tienen que basarse en las potentes cosas en común que valoran todos los compradores.\" (pág. 127)","pagina":"127","question":"Si quiero hacer crecer mucho un negocio, ¿debería escuchar más a mis clientes actuales o dejar de mirarlos un momento?","answer":"El error típico es pulir cada vez más el producto para los clientes que ya tienes, segmentándolos y personalizando hasta el infinito — pero eso tiene un techo bajo. La demanda de verdad grande está fuera, en los que no son clientes, y hay tres niveles: primer nivel, gente que está a punto de dejarte (usan lo mínimo y buscan alternativas); segundo nivel, gente que ya decidió conscientemente no usar lo que ofreces porque no le convence o no se lo puede permitir; tercer nivel, gente que ni se ha planteado tu sector porque está completamente fuera de su mundo. El ejemplo de Callaway Golf (Big Bertha) es claro: en vez de preguntar a golfistas qué palo querían, miraron por qué la gente NO jugaba al golf (dificultad para golpear la bola) y resolvieron eso — así ganaron tanto a no-clientes como a clientes existentes.","aplicacion":{"personal":"No encuentro una aplicación directa.","proyecto":"En Reelz, en vez de solo preguntar a nuestros clientes actuales qué mejorarían, investigar por qué negocios que sí necesitan vídeo NO contratan una agencia de edición (nivel 2 y 3 de no-clientes), ahí puede estar la barrera que, si la resolvemos, nos abre mercado nuevo.","teamcompany":"No encuentro una aplicación directa."},"mtime":1789034525},{"id":"mega-meta-ambiciosa-audaz-y-descabellada","fichero":"MEGA, meta ambiciosa audaz y descabellada.md","titulo":"MEGA: meta ambiciosa, audaz y descabellada","libro":"Good to Great","competencia":"Innovation \u0026 Strategy","tags":["herramienta","visión","objetivos"],"highlight":"\"MEGA: Meta ambiciosa, audaz y descabellada que mueve a un equipo.\" — \"¿Por qué no aspirar a la excelencia?\"","pagina":"","question":"¿Un objetivo realista y alcanzable es lo que más moviliza a un equipo?","answer":"No siempre. A veces lo que de verdad une y moviliza a un equipo no es una meta prudente y calculada, sino una meta tan ambiciosa y audaz que casi suena descabellada — una MEGA. Ese tipo de objetivo genera una energía distinta a la de una meta \"razonable\", porque obliga a pensar en grande en vez de simplemente gestionar lo que ya existe.","aplicacion":{"personal":"Definir al menos una meta personal que se sienta genuinamente audaz, no solo una versión ligeramente mejorada de lo que ya hago.","proyecto":"Crear el MEGA de Reelz, algo que reconozco que nos falta, tal como decidí en los Next Steps del ensayo.","teamcompany":"Proponer a SPARK definir juntos una meta ambiciosa y descabellada como equipo, para generar una energía distinta a la de simplemente \"ir cumpliendo objetivos trimestrales\"."},"mtime":1785881309},{"id":"mapa-pec-pioneros-emigrantes-y-colonos-para-evaluar-una-cartera-de-negocio","fichero":"Mapa PEC - pioneros emigrantes y colonos para evaluar una cartera de negocio.md","titulo":"Mapa PEC: pioneros, emigrantes y colonos para evaluar una cartera de negocio","libro":"La Estrategia del Océano Azul","competencia":"Business Model Creation","tags":["herramienta","estrategia"],"highlight":"\"Los pioneros de una compañía son aquellos negocios que ofrecen un valor sin precedentes [...] En el otro extremo se encuentran los colonos —aquellos negocios cuyas curvas de valor se ajustan a la forma básica del sector [...] Por regla general, los colonos no contribuyen demasiado al crecimiento futuro de una compañía.\" (pág. 123)","pagina":"123","question":"Si mi negocio o proyecto está facturando bien ahora mismo, ¿significa eso que también va a crecer en el futuro?","answer":"Es una forma de clasificar cada línea de negocio (o cada proyecto, o cada tipo de cliente) en tres categorías según su potencial de crecimiento futuro, no su rendimiento actual. Los pioneros son océano azul puro: ofrecen algo que nadie más ofrece y son el motor real de crecimiento. Los colonos son océano rojo: hacen lo mismo que el resto del sector, puede que hoy den dinero pero no van a crecer porque compiten en algo ya saturado. Los emigrantes están en medio: dan algo mejor que el estándar (más por menos) pero no algo realmente nuevo. La idea clave es que un negocio puede estar lleno de \"colonos\" rentables hoy y aun así no tener futuro, porque ninguno de ellos va a generar crecimiento — hay que mirar la cartera completa y no solo la caja de hoy.","aplicacion":{"personal":"No encuentro una aplicación clara.","proyecto":"Clasificar los distintos tipos de clientes o servicios de Reelz en el mapa PEC — identificar si la mayoría de nuestra facturación viene de servicios \"colonos\" (edición estándar, igual que cualquier competidor) y si tenemos algún \"pionero\" real que valga la pena potenciar.","teamcompany":"Proponer en SPARK clasificar los distintos proyectos que salen de la Teamcompany (Reelz, Trouuve, Jufe  y otros) según este mapa, para decidir en cuáles invertir tiempo y recursos compartidos de verdad."},"mtime":1789034439},{"id":"mapa-de-utilidad-para-el-comprador-las-36-casillas","fichero":"Mapa de utilidad para el comprador - las 36 casillas.md","titulo":"Mapa de utilidad para el comprador: las 36 casillas","libro":"La Estrategia del Océano Azul","competencia":"Teampreneurship \u0026 Customer Co-creation","tags":["herramienta","customer-discovery"],"highlight":"\"Para testar la utilidad excepcional, las compañías deberían verificar que su producto o servicio ha eliminado las barreras más importantes que se oponen a la utilidad a lo largo de todo el ciclo de experiencia del comprador tanto para los clientes como para los no clientes.\" (pág. 146)","pagina":"146","question":"Si mi producto ya cumple bien su función principal, ¿por qué a veces la gente sigue sin comprarlo o usarlo?","answer":"Es una matriz de 6x6: en un eje van las 6 etapas por las que pasa un comprador (compra, entrega, uso, complementos, mantenimiento, eliminación/desecho) y en el otro las 6 palancas de utilidad (productividad, simplicidad, comodidad, riesgo, diversión/imagen, respeto al medio ambiente). Cruzando ambos ejes salen 36 casillas, y la idea es revisar cada una para encontrar en qué punto del recorrido del cliente hay más fricción sin resolver — normalmente ahí está la oportunidad más grande de crear valor excepcional. El caso del Ford Modelo T es el ejemplo perfecto: todo el sector se centraba solo en la casilla de \"diversión e imagen\" en la etapa de \"uso\" (coches de lujo para pasear los fines de semana), y Ford abrió un océano azul enorme mirando las otras 35 casillas que nadie atendía.","aplicacion":{"personal":"No encuentro aplicación directa.","proyecto":"Recorrer las 36 casillas para un cliente de Reelz: desde que nos contrata (compra) hasta que deja de trabajar con nosotros (eliminación), identificando en qué etapa/palanca hay más fricción que ninguna agencia de edición está resolviendo bien (ej. simplicidad en la entrega de archivos, riesgo percibido en la primera contratación).","teamcompany":"Usar el mapa para revisar la experiencia de un nuevo socio que se incorpora a SPARK — desde que decide unirse hasta que sale del Team Company — para detectar en qué etapa hay más fricción sin atender."},"mtime":1789034918},{"id":"matriz-eric-eliminar-reducir-incrementar-crear-como-herramienta-de-ejecucion","fichero":"Matriz ERIC - eliminar reducir incrementar crear como herramienta de ejecución.md","titulo":"Matriz ERIC: pasar del esquema de 4 acciones a una tabla ejecutable","libro":"La Estrategia del Océano Azul","competencia":"Innovation \u0026 Strategy","tags":["herramienta","estrategia"],"highlight":"\"La empresa se obliga a perseguir simultáneamente la diferenciación y el bajo coste para romper la disyuntiva entre el valor y el coste. [...] Permite identificar de inmediato a las compañías que están focalizadas solamente en incrementar y crear y, por tanto, en elevar su estructura de costes.\" (pág. 60)","pagina":"60","question":"¿Por qué no basta con responder mentalmente a las cuatro preguntas de eliminar-reducir-incrementar-crear, y hace falta escribirlas en una matriz de cuatro cuadrantes?","answer":"La Matriz ERIC (Eliminar, Reducir, Incrementar, Crear) es la versión escrita y visual del esquema de cuatro acciones: cuatro casillas donde apuntas, para tu producto o servicio concreto, qué variables van en cada una. El ejemplo de yellow tail lo deja clarísimo: eliminaron la jerga técnica del vino y la publicidad masiva, redujeron el prestigio del viñedo y la complejidad del vino, incrementaron la facilidad de beber y de elegir, y crearon diversión y aventura alrededor de una etiqueta con un canguro. Ponerlo en una matriz obliga a que las cuatro acciones estén presentes a la vez — si solo rellenas \"incrementar\" y \"crear\" pero dejas vacías \"eliminar\" y \"reducir\", la matriz te avisa de que estás subiendo el valor a base de subir también el coste, que es justo el error que la innovación en valor busca evitar.","aplicacion":{"personal":"Rellenar la matriz ERIC sobre mis propios hábitos de trabajo al menos una vez, en papel, con las cuatro casillas obligatoriamente completas.","proyecto":"Hacer la matriz ERIC completa de Reelz frente a otras agencias de edición: qué eliminamos, qué reducimos, qué incrementamos y qué creamos. También realizarla en PAWs y comprobar que no está todo concentrado solo en \"incrementar/crear\" (señal de que estaríamos subiendo el coste sin control).","teamcompany":"Llevar la matriz ERIC como herramienta a una sesión de SPARK para diagnosticar alguna dinámica de equipo que sienta \"sobrecargada\", normalmente será porque solo hemos ido incrementando y creando cosas nuevas sin eliminar ni reducir nada.\n\n![[Matriz de eliminar-reducir-incrementar-crear.heic]]"},"mtime":1788954058},{"id":"meditacion-como-vacaciones-instantaneas-para-la-mente","fichero":"Meditación como vacaciones instantáneas para la mente.md","titulo":"Meditación como vacaciones instantáneas para la mente","libro":"Ikigai","competencia":"Personal Cultivation","tags":["herramienta","gestión-del-estrés"],"highlight":"\"Vacaciones instantáneas: la puerta de la meditación\" / \"sólo con que logremos detener la «centrifugadora» unos segundos, notaremos un descanso inmediato y una nueva claridad\"","pagina":"","question":"¿Hace falta \"vaciar la mente\" del todo para que meditar sirva de algo?","answer":"No. Mucha gente abandona la meditación porque cree que tiene que dejar la cabeza en blanco como un monje, y como no lo consigue, piensa que \"no se le da bien\". Pero basta con frenar el remolino de pensamientos solo unos segundos para notar un descanso real, como unas mini-vacaciones para la cabeza — no hace falta la perfección.","aplicacion":{"personal":"Probar 2 minutos de meditación al empezar el día, con el único objetivo de \"frenar unos segundos\", sin exigirme silencio mental total.","proyecto":"No encuentro una aplicación concreta.","teamcompany":"Proponer en algún check-in hacer dinámicas de relajación/meditación como ya implementamos una vez. Creo que en momentos de tensión como evaluaciones puede ser de gran utilidad."},"mtime":1785928489},{"id":"moai-la-red-de-apoyo-mutuo-que-sostiene-un-proposito","fichero":"Moai - la red de apoyo mutuo que sostiene un propósito.md","titulo":"Moai: la red de apoyo mutuo que sostiene un propósito","libro":"Ikigai","competencia":"Team \u0026 Community Learning","tags":["framework","equipo","comunidad"],"highlight":"\"moai es un grupo informal de gente con intereses comunes que se ayuda entre sí\"","pagina":"","question":"¿Cómo consigue la gente de Okinawa mantener un propósito de vida durante décadas sin agotarse?","answer":"No lo hacen solas. Desde niños se juntan en un pequeño grupo de amigos de toda la vida que se apoyan en todo: dinero, problemas, alegrías. Ese grupo (el moai) funciona como una red de seguridad que hace que ningún reto se enfrente en solitario, y eso da fuerzas para seguir adelante muchos años.","aplicacion":{"personal":"Identificar mi propio \"moai\", las 3-4 personas con las que de verdad puedo contar pase lo que pase, y quedar con ellas de forma regular, no solo cuando hay una crisis.","proyecto":"Crear tu proyecto como una red de apoyo, no como un grupo de empleados. Eso parte de una predisposición a pedir y dar ayudar.","teamcompany":"Diseñar Teamcompany desde el principio como un \"moai\" de emprendedores: apoyo mutuo real entre socios, no solo reparto de tareas. Eso parte de una mentalidad de esfuerzo y servicio hacia la Team Company."},"mtime":1785927573},{"id":"metete-en-la-vida-de-tu-cliente","fichero":"Métete en la vida de tu cliente.md","titulo":"Métete en la vida de tu cliente","libro":"El Manual del Emprendedor","competencia":"Teampreneurship \u0026 Customer Co-creation","tags":["modelo-mental","clientes","empatía"],"highlight":"\"Para realmente entender sus problemas y resolverlos, necesitas vivir la vida como la vive tu cliente. Entiende qué hacen con su tiempo y con su energía. Entiende qué problemas les surgen y solo así, sabrás cómo aportar valor de verdad.\"","pagina":"","question":"¿Preguntarle a un cliente \"qué necesitas\" es suficiente para entender de verdad su problema?","answer":"No siempre, porque muchas veces ni el propio cliente sabe explicar bien lo que necesita. Entender de verdad un problema significa meterte en cómo vive esa persona el día a día: en qué gasta su tiempo, en qué gasta su energía, qué le frustra. Solo viendo el problema desde dentro de su vida, y no solo desde una pregunta directa, puedes diseñar una solución que aporte valor real.","aplicacion":{"personal":"Antes de dar un consejo a alguien cercano, intentar entender de verdad cómo vive su día a día, no solo lo que me cuenta en una conversación puntual.","proyecto":"En las conversaciones de descubrimiento de clientes de Reelz, dedicar tiempo a entender cómo es un día normal del cliente, no solo preguntar directamente qué quiere.","teamcompany":"Fomentar en SPARK que antes de diseñar cualquier solución para un cliente, alguien del equipo se \"meta\" en su rutina real, más allá de la encuesta o la llamada superficial."},"mtime":1785881395},{"id":"naikan-reflexion-sobre-lo-recibido-dado-y-el-dano-causado","fichero":"Naikan - reflexión sobre lo recibido, dado y el daño causado.md","titulo":"Naikan: reflexión sobre lo recibido, dado y el daño causado","libro":"Ikigai","competencia":"Team \u0026 Community Learning","tags":["herramienta","gestión-emocional","relaciones"],"highlight":"\"¿Qué he recibido de la persona X? ¿Qué he dado a la persona X? ¿Qué problemas he causado a la persona X? A través de esta exploración, dejamos de señalar a los demás como causantes de nuestros males y profundizamos en la propia responsabilidad\"","pagina":"","question":"Cuando una relación con un socio, un amigo o tu familia no va bien, ¿el primer paso es analizar qué ha hecho mal la otra persona?","answer":"El Naikan, una técnica japonesa, propone justo lo contrario: en vez de empezar señalando al otro, te preguntas tres cosas sobre esa persona: qué he recibido de ella, qué le he dado yo, y qué problemas le he causado. Ese orden cambia el foco de \"buscar culpables fuera\" a \"revisar mi propia parte\", que es la única que realmente puedo cambiar.","aplicacion":{"personal":"Cuando tenga un conflicto con alguien cercano, hacer el ejercicio Naikan por escrito antes de hablar con esa persona, en vez de ir directo a explicar \"lo que hizo mal\".","proyecto":"Si surge tensión con un socio, cliente o proveedor, aplicar las tres preguntas antes de reaccionar, para no quedarme solo en la versión de \"qué me ha hecho\".","teamcompany":"Introducir el Naikan como ejercicio de equipo tras un conflicto interno, antes de la conversación de resolución, para que cada socio llegue habiendo revisado su propia parte."},"mtime":1785929284},{"id":"no-hace-falta-cargo-para-liderar-hay-que-dar-el-maximo","fichero":"No hace falta cargo para liderar, hay que dar el máximo.md","titulo":"No hace falta cargo para liderar, hay que dar el máximo","libro":"El líder que no tenía cargo","competencia":"Cooperative Leadership","tags":["modelo-mental","liderazgo"],"highlight":"\"No hace falta tener un cargo para ser un líder\" (Pág 39) — \"Lo realmente importante es dar el máximo y para ello no necesitas tener ningún cargo ni autoridad especial\" (Pág 26)","pagina":"39","question":"Si no ocupas un puesto de responsabilidad formal en tu equipo, ¿puedes seguir siendo un líder?","answer":"Sí, y de hecho es lo más importante. Un cargo es solo un título; liderar es dar lo máximo de ti mismo en lo que haces, tengas o no autoridad especial sobre otros. Muchas veces las personas realmente influyentes en un equipo no son las que ocupan el puesto de mando, sino las más implicadas y comprometidas con el trabajo diario.","aplicacion":{"personal":"A mitad de la lectura de este libro dejé mi puesto en la TLT; este aprendizaje me confirmó que puedo seguir liderando con el ejemplo aunque no tenga cargo formal.","proyecto":"En Reelz, ejercer liderazgo sobre mi propio trabajo y estándares de calidad, sin esperar a que un cargo me lo exija.","teamcompany":"Liderar sin cargo desde el ejemplo en SPARK, siendo puntual, constante y comprometido independientemente del rol que ocupe dentro del equipo, tal como decidí en los Next Steps del ensayo."},"mtime":1785881086},{"id":"no-hay-hechos-dentro-del-edificio","fichero":"No hay hechos dentro del edificio.md","titulo":"No hay hechos dentro del edificio","libro":"El Manual del Emprendedor","competencia":"Teampreneurship \u0026 Customer Co-creation","tags":["modelo-mental","clientes","validación"],"highlight":"\"No hay hechos en el interior de una oficina, por ello hay que salir a la calle ya\" — primera de las 14 reglas del Manifiesto del Desarrollo de Clientes.","pagina":"","question":"Si tu equipo debate largo y tendido sobre qué quiere el cliente, ¿esa discusión te acerca a la verdad?","answer":"No, por muy inteligente que sea el debate. Da igual cuánto discutas puertas adentro sobre lo que crees que quiere el cliente: eso son solo opiniones dentro de una sala. Los únicos hechos reales están fuera, en la calle, hablando con clientes de verdad. Por eso la primera regla es literal: sal del edificio.","aplicacion":{"personal":"Cuando tenga una duda sobre algo que afecta a otras personas, buscar la respuesta preguntando directamente en vez de especular yo solo.","proyecto":"En Reelz, ante cualquier duda de producto o mercado, priorizar salir a hablar con clientes reales por encima de debatirlo internamente.","teamcompany":"Esta regla conecta directamente con la intención de las OBVs en LEINN: recordar a SPARK que ninguna decisión de proyecto debería tomarse solo con debate interno, sin haber salido antes a contrastarla."},"mtime":1785881354},{"id":"no-priorizar-los-ingresos-sobre-los-valores","fichero":"No priorizar los ingresos sobre los valores.md","titulo":"No priorizar los ingresos sobre los valores","libro":"The Duolingo Handbook","competencia":"Innovation \u0026 Strategy","tags":["concepto","valores","estrategia"],"highlight":"\"Duolingo deja una experiencia gratis al usuario muy amplia, debido a que su objetivo no es solo monetizar, es ser la app de educación más importante. Gracias a esto lo cumplen y les permite crecer aún más el proyecto.\"","pagina":"","question":"Si tu objetivo principal es ganar más dinero cuanto antes, ¿es la forma más rápida de conseguirlo?","answer":"Puede que no. Duolingo podría monetizar mucho más agresivamente, pero limita eso a propósito porque su objetivo real es otro: ser la app de educación más importante del mundo. Y paradójicamente, priorizar ese objetivo (y no el dinero directamente) es lo que les permite crecer más y, con el tiempo, ganar más. Cuando la visión y los valores van primero, los ingresos suelen ser una consecuencia, no lo contrario.","aplicacion":{"personal":"Antes de tomar una decisión pensando solo en el beneficio económico inmediato, preguntarme si está alineada con el objetivo de fondo que persigo.","proyecto":"Plantearme con claridad qué objetivo e impacto quiero que tenga Reelz más allá de la monetización, y dejar que las decisiones de precio se ajusten a eso.","teamcompany":"Reflexionar con SPARK sobre si buscamos oportunidades momentáneas de dinero rápido sin plantearnos realmente qué impacto queremos tener como equipo."},"mtime":1785881568},{"id":"nunca-falles-dos-veces-seguidas","fichero":"Nunca falles dos veces seguidas.md","titulo":"Nunca falles dos veces seguidas","libro":"Hábitos Atómicos","competencia":"Personal Cultivation","tags":["herramienta","hábitos","resiliencia"],"highlight":"\"Cómo recuperar tus hábitos rápidamente: si fallas, NUNCA dejes que pase dos veces. Tan pronto como una racha termina comienzo la siguiente.\"","pagina":"","question":"Si un día rompes tu racha con un hábito, ¿lo importante es no haber fallado nunca?","answer":"No, fallar una vez es normal e inevitable. Lo que de verdad marca la diferencia no es el primer fallo, sino si dejas que se convierta en dos fallos seguidos: ahí es cuando un desliz puntual empieza a convertirse en un patrón nuevo. La meta realista no es la perfección absoluta, es no fallar dos veces consecutivas — como el protector de racha que usa Duolingo, que te perdona un día pero no dos.","aplicacion":{"personal":"Cuando rompa un hábito un día, poner toda mi energía en no repetirlo al día siguiente, en vez de sentir que \"ya da igual\" y dejar que se acumulen los fallos.","proyecto":"En Reelz, si un proceso o buena práctica se salta una vez, actuar de inmediato para que no se repita, en vez de dejar que se normalice.","teamcompany":"Transmitir esta norma a SPARK: un fallo puntual de un ritual de equipo (llegar tarde, no preparar algo) no es grave si no se repite al siguiente turno."},"mtime":1785881716},{"id":"oceano-rojo-vs-oceano-azul-competir-versus-crear-mercado","fichero":"Océano rojo vs océano azul - competir versus crear mercado.md","titulo":"Océano rojo vs océano azul: competir versus crear mercado","libro":"La Estrategia del Océano Azul","competencia":"Innovation \u0026 Strategy","tags":["concepto","estrategia"],"highlight":"\"En cambio, los océanos azules vienen definidos por espacios de mercado inexplotados, creación de demanda, y la oportunidad de un crecimiento altamente rentable.\" (pág. 7)","pagina":"7","question":"Si dos empresas del mismo sector ofrecen productos parecidos y bajan precios para ganarse mutuamente clientes, ¿por qué ambas acaban ganando menos dinero que si una de ellas hubiera hecho algo completamente distinto?","answer":"Un océano rojo es un mercado que ya existe, con reglas ya puestas, donde todos luchan por el mismo trozo de tarta y por eso el agua se llena de sangre (de ahí el nombre): cuantos más compiten, menos gana cada uno. Un océano azul es un espacio de mercado que todavía no existe, así que no hay que pelear por él — simplemente no hay nadie más ahí. El ejemplo del Cirque du Soleil lo explica perfecto: no intentó ser mejor circo que Ringling Bros., sino que dejó de dirigirse a niños y creó un espectáculo para adultos dispuestos a pagar mucho más por algo que ningún circo ofrecía. No ganó clientes al circo tradicional, se inventó unos clientes nuevos.","aplicacion":{"personal":"Antes de copiar cómo otros creadores de contenido o founders hacen algo, preguntarme primero si estoy compitiendo en un océano rojo (haciendo lo mismo que todos, un poco mejor) o si podría plantear el problema desde cero.","proyecto":"En Reelz, en vez de competir por precio con otras agencias de edición de vídeo (océano rojo clásico: mismos servicios, mismos clientes, guerra de tarifas), identificar un espacio de mercado donde ahora mismo no compite nadie con nosotros.","teamcompany":"Cuando en SPARK definamos qué nos diferencia como Team Company frente a otros equipos de LEINN, evitar la trampa de compararnos punto por punto con otros equipos — plantearnos qué podríamos ofrecer que ningún otro equipo esté ofreciendo."},"mtime":1788953218},{"id":"ofuro-el-bano-como-ritual-de-desconexion","fichero":"Ofuro - el baño como ritual de desconexión.md","titulo":"Ofuro: el baño como ritual de desconexión","libro":"Ikigai","competencia":"Personal Cultivation","tags":["herramienta","descanso","gestión-del-estrés"],"highlight":"\"ofuro\" / \"Bañarse más tiempo del normal, escuchando música mientras te relajas\"","pagina":"","question":"¿Hace falta meditar o hacer algo \"productivo\" para desconectar de verdad, o basta con darte un baño largo?","answer":"El ofuro es la costumbre japonesa de darte un baño relajado y largo, no para lavarte rápido, sino como un momento dedicado solo a descansar la cabeza, con música, sin prisa. No te hace más productivo directamente, pero te da el descanso que necesitas para rendir bien después. A veces desconectar de verdad es tan simple como concederte ese tiempo sin sentir que lo estás \"perdiendo\".","aplicacion":{"personal":"Reservar un baño largo o actividad similar (20-30 min) con música una vez cada 2 semanas, sin culpa de estar \"perdiendo el día\". Probarlo durante 1 mes.","proyecto":"Reconocer que necesito bloques de desconexión real fuera de LEINN para rendir mejor cuando trabajo en el proyecto, en vez de estar siempre \"encendido\".","teamcompany":"Normalizar en el equipo que tomarse tiempo de desconexión real, sino parte de rendir bien a medio plazo. Proponer alguna dinámica que lo fomente."},"mtime":1785929258},{"id":"olvida-las-metas-centrate-en-los-sistemas","fichero":"Olvida las metas, céntrate en los sistemas.md","titulo":"Olvida las metas, céntrate en los sistemas","libro":"Hábitos Atómicos","competencia":"Self Driven Learning","tags":["framework","hábitos","objetivos"],"highlight":"\"Las metas son los resultados que quieres tener. Los sistemas son los procesos que sigues para alcanzar estos resultados.\" / \"Las metas restringen la felicidad: parece que una meta lleva el siguiente patrón: 'cuando la consiga, seré feliz'. Esto dificulta mucho disfrutar del proceso.\"","pagina":"","question":"Si consigues la meta que llevabas tiempo persiguiendo, ¿el problema que la originó desaparece para siempre?","answer":"No necesariamente. Una meta es solo un resultado puntual: si limpias tu habitación pero no arreglas el hábito de desorden, \"curaste\" el síntoma pero no la causa, y el desorden volverá. Un sistema, en cambio, es el proceso repetido que sostiene ese resultado en el tiempo. Además, vivir enganchado a metas (\"cuando consiga esto, seré feliz\") te impide disfrutar el camino — mientras que centrarte en el sistema te hace disfrutar cada día del proceso, no solo el momento de llegar.","aplicacion":{"personal":"Reformular mis metas personales como sistemas diarios sostenibles, no como un resultado único que \"algún día\" me hará feliz.","proyecto":"En Reelz Agency, dejar de centrarnos solo en conseguir más clientes y centrarnos en el sistema de captación de clientes que los produce de forma sostenida.","teamcompany":"Proponer a SPARK revisar nuestros objetivos de equipo en términos de sistemas y procesos, no solo de metas puntuales a alcanzar."},"mtime":1785881659},{"id":"pedir-referidos-ser-referible","fichero":"Pedir referidos, ser referible.md","titulo":"Pedir referidos: ser \"referible\"","libro":"El arte de cerrar la venta","competencia":"Teampreneurship \u0026 Customer Co-creation","tags":["herramienta","ventas","referidos"],"highlight":"\"Pedir referidos en la venta: ¿Me daría los nombres de dos o tres personas más a quienes también podrían gustarle? Para conseguir referidos, hay que ser 'referible' (profesional, puntual y cortés).\"","pagina":"","question":"Si haces un buen trabajo con un cliente, ¿es suficiente para que te recomiende a otros de forma espontánea?","answer":"Casi nunca, aunque el trabajo sea excelente. La mayoría de clientes contentos no piensan en recomendarte por su cuenta; hay que pedirlo explícitamente. Pero antes de pedirlo, tienes que haberte ganado el derecho a que te recomienden siendo \"referible\": profesional, puntual y cortés en todo el proceso. Sin eso, ni pedirlo funciona.","aplicacion":{"personal":"Ser consciente de que ser \"referible\" (cumplir, ser puntual, ser cortés) es una inversión constante, no algo que se demuestra solo una vez.","proyecto":"Implementar el sistema de referidos en Reelz de forma sistemática con nuestros clientes ya satisfechos, tal como decidí en los Next Steps del ensayo, en vez de dejarlo al azar.","teamcompany":"Instaurar en SPARK la costumbre de pedir referidos activamente al cerrar cada proyecto con éxito, no solo esperar a que lleguen solos."},"mtime":1785881520},{"id":"pivotar-o-continuar-las-preguntas-fundamentales","fichero":"Pivotar o continuar, las preguntas fundamentales.md","titulo":"¿Pivotar o continuar? Las preguntas fundamentales","libro":"El Manual del Emprendedor","competencia":"Innovation \u0026 Strategy","tags":["herramienta","decisiones","emprendimiento"],"highlight":"Preguntas clave: \"¿Se ha identificado un problema por cuya solución pagarían muchos clientes? ¿El producto resuelve estas necesidades claramente de forma barata y rentable? Si es así, ¿existe un mercado de tamaño considerable y un modelo de negocio viable, escalable y rentable?\"","pagina":"","question":"Cuando un proyecto no despega como esperabas, ¿cómo sabes si debes insistir más o cambiar de rumbo?","answer":"No es una corazonada, es responder con honestidad a un puñado de preguntas concretas: ¿el problema que resuelves es lo bastante grave como para que la gente pague por solucionarlo? ¿Tu producto lo resuelve de forma rentable? ¿Hay suficiente mercado detrás? Si las respuestas son claramente que no, insistir no es perseverancia, es negar la realidad. Si son que sí pero algo no encaja, ahí es donde toca pivotar, no abandonar.","aplicacion":{"personal":"Usar estas preguntas como filtro objetivo cuando dude si seguir insistiendo en algo personal o cambiar de enfoque.","proyecto":"Responder estas preguntas fundamentales para Reelz de forma periódica, tal como decidí en los Next Steps del ensayo, en vez de decidir por intuición si seguimos o pivotamos.","teamcompany":"Llevar estas preguntas a una TLS de SPARK cuando un proyecto del equipo esté estancado, para decidir con criterio en vez de por desgaste emocional."},"mtime":1785881427},{"id":"primero-quien-luego-que-la-gente-adecuada-en-el-autobus","fichero":"Primero quién, luego qué, la gente adecuada en el autobús.md","titulo":"Primero quién, luego qué: la gente adecuada en el autobús","libro":"Good to Great","competencia":"Cooperative Leadership","tags":["framework","equipo","contratación"],"highlight":"\"Mirad, no sé hacia dónde tenemos que ir, pero estoy seguro de que, si subimos a bordo a las personas adecuadas, las sentamos en sus lugares adecuados y hacemos que la gente inadecuada baje, podremos conducirlo hacia un lugar maravilloso\"","pagina":"","question":"Para construir un proyecto excelente, ¿lo primero que hay que definir es la visión y la estrategia?","answer":"No, según este libro es al revés: primero hay que tener a la gente adecuada, y a partir de ahí se define hacia dónde ir. Aunque tengas clarísimo tu destino, con gente inadecuada nunca vas a construir algo excelente; en cambio, con las personas correctas subidas al autobús, muchos problemas de motivación y fricción desaparecen solos, porque esa gente ya trae consigo el compromiso.","aplicacion":{"personal":"Ser más consciente de con quién me rodeo en cada proyecto, priorizando la calidad de las personas por encima de lo atractivo de la idea.","proyecto":"Parte de que Reelz esté funcionando es que ha coincidido un grupo de gente comprometida desde el inicio; tener esto muy presente de cara a futuras incorporaciones o subcontrataciones.","teamcompany":"Reconocer que en SPARK muchas fricciones de fondo (horarios, calidad de entregables) no son el problema real, sino un síntoma de que la persona no encaja del todo — y actuar sobre eso, no solo sobre el síntoma."},"mtime":1785881238},{"id":"prototipo-vs-pretotipo-probar-el-mercado-antes-de-construir","fichero":"Prototipo vs pretotipo, probar el mercado antes de construir.md","titulo":"Prototipo vs pretotipo: probar el mercado antes de construir","libro":"Pretotype It","competencia":"ChangeMaking Experiments","tags":["concepto","validación","emprendimiento"],"highlight":"Diferencia entre prototipo (¿puedo construirlo? ¿funcionará? ¿cómo lo usará la gente?) y pretotipo (¿hay suficiente mercado para este nuevo producto?). \"Prototipo: meses o años puede ser aceptable... Pretotipo: horas o días y debe costar entre poco y nada.\"","pagina":"","question":"Antes de construir algo, ¿la primera pregunta debería ser si puedes construirlo bien?","answer":"No. Esa es solo la segunda pregunta. La primera, y la más importante, es si a alguien le va a importar que exista. Un prototipo te dice si algo funciona técnicamente, pero eso puede costarte meses y mucho dinero. Un pretotipo es una versión mucho más barata y rápida (horas o días) que solo sirve para descubrir si hay mercado real antes de gastar tiempo en construir nada bien hecho.","aplicacion":{"personal":"Antes de lanzarme a \"hacer bien\" cualquier idea personal nueva, preguntarme primero si de verdad hay interés real, en vez de perfeccionar algo que nadie pidió.","proyecto":"Implementar el pretotipado como paso obligatorio antes de desarrollar cualquier nueva funcionalidad en Reelz, evitando invertir tiempo y recursos sin validación previa de mercado.","teamcompany":"Trasladar esta lógica a SPARK: antes de comprometer tiempo del equipo en un nuevo proyecto o servicio, exigir primero una prueba barata de que hay mercado."},"mtime":1785880680},{"id":"que-haria-en-esta-situacion-el-mejor-del-mundo","fichero":"Qué haría en esta situación el mejor del mundo.md","titulo":"¿Qué haría en esta situación el mejor del mundo?","libro":"El líder que no tenía cargo","competencia":"Self Driven Learning","tags":["herramienta","toma-de-decisiones"],"highlight":"\"¿Qué haría en esta situación el mejor del mundo?\" (Pág 100) — una pregunta que debe acompañarte en el día a día para impulsarte en tu camino hacia la maestría.","pagina":"100","question":"Cuando dudas cómo actuar ante una decisión importante, ¿de dónde sacas el criterio para decidir bien?","answer":"De una pregunta muy simple: imaginar qué haría en tu lugar el mejor del mundo en ese campo. Yo ya usaba esta pregunta en el deporte sin darme cuenta de que era una herramienta general — este libro me abrió los ojos a que sirve para cualquier campo y cualquier decisión, no solo para lo que ya dominas.","aplicacion":{"personal":"Aplicar la pregunta guía diariamente, \"¿qué haría el mejor del mundo en esta situación?\", antes de tomar decisiones importantes, tal como decidí en los Next Steps del ensayo.","proyecto":"Antes de una decisión difícil en Reelz, preguntarme qué haría el mejor profesional del sector en mi lugar, en vez de decidir solo por instinto.","teamcompany":"Adaptar la pregunta a SPARK como \"¿qué haría el mejor estudiante de LEINN en esta situación?\" para guiar decisiones de equipo en momentos de duda."},"mtime":1785881126},{"id":"regla-de-ricitos-de-oro-la-motivacion-maxima-en-el-limite","fichero":"Regla de Ricitos de Oro, la motivación máxima en el límite.md","titulo":"Regla de Ricitos de Oro: la motivación máxima está en el límite","libro":"Hábitos Atómicos","competencia":"Self Driven Learning","tags":["modelo-mental","motivación","aprendizaje"],"highlight":"\"Los humanos experimentamos la máxima motivación cuando trabajamos en tareas que están al límite de nuestras habilidades.\"","pagina":"","question":"¿Estarás más motivado enfrentándote a un reto muy por debajo de tu nivel, o a uno muy por encima?","answer":"Ninguno de los dos extremos: la motivación máxima aparece justo en el punto medio, cuando el reto está al límite exacto de lo que ya sabes hacer. Si es demasiado fácil, te aburres; si es demasiado difícil, te bloqueas. En el deporte lo he vivido en primera persona: enfrentarte a alguien ligeramente mejor que tú, pero dentro de tus capacidades, es cuando alcanzas tu pico máximo de motivación.","aplicacion":{"personal":"Buscar deliberadamente rivales o retos ligeramente por encima de mi nivel actual, ni tan fáciles que me aburran ni tan difíciles que me bloqueen.","proyecto":"En Reelz, calibrar los objetivos del equipo para que estén justo en ese límite de habilidad, evitando metas demasiado cómodas o directamente inalcanzables.","teamcompany":"Aplicar este criterio al repartir tareas dentro de SPARK, buscando que cada socio reciba retos ajustados a su \"zona de máxima motivación\"."},"mtime":1785881724},{"id":"right-it-vs-wrong-it","fichero":"Right It vs Wrong It.md","titulo":"Right It vs Wrong It","libro":"Pretotype It","competencia":"ChangeMaking Experiments","tags":["modelo-mental","validación","emprendimiento"],"highlight":"\"Right It: idea que ejecutada correctamente triunfa en el mercado. Wrong It: idea que ejecutada correctamente fracasa en el mercado.\" / \"Por mucho que nos guste nuestra idea, la probabilidad habla por si sola y que sea un 'Right It' sería la excepción, no la norma.\"","pagina":"","question":"Si ejecutas tu idea a la perfección, ¿eso garantiza que vaya a triunfar?","answer":"No. Puedes hacer todo perfecto —diseño, ejecución, esfuerzo— y aun así fracasar, porque el problema no era cómo lo hiciste sino qué elegiste hacer. Una idea es un \"Right It\" si el mercado la quiere, y un \"Wrong It\" si no, y eso no depende de lo bien que la ejecutes. La mayoría de ideas, incluso las que más te gustan a ti, son \"Wrong It\" — eso es la norma, no la excepción.","aplicacion":{"personal":"Dejar de apegarme emocionalmente a mis ideas (\"esta es la buena\") y aceptar que la mayoría, aunque me convenzan, no van a funcionar en el mercado — y que eso está bien.","proyecto":"Antes de invertir más esfuerzo en una nueva línea de Reelz, comprobar si ya tengo señales de que es un \"Right It\" y no solo una idea que a mí me entusiasma.","teamcompany":"En SPARK, dejar que sea el mercado, no nuestra opinión interna, quien decida si una idea de proyecto es un Right It, para no perder tiempo defendiendo ideas que nos gustan pero no funcionan."},"mtime":1785880689},{"id":"riguroso-no-despiadado-al-gestionar-personas","fichero":"Riguroso, no despiadado, al gestionar personas.md","titulo":"Riguroso, no despiadado, al gestionar personas","libro":"Good to Great","competencia":"Cooperative Leadership","tags":["herramienta","equipo","gestión"],"highlight":"\"Riguroso no Despiadado\" — \"En caso de duda, no contrates, sigue buscando\" / \"Si sabes que has de hacer un cambio de personal, hazlo\" / \"la gente extraordinaria no necesita ser controlada\".","pagina":"","question":"Si tienes dudas sobre si alguien encaja en tu proyecto, ¿lo mejor es darle más tiempo para que \"pruebe\"?","answer":"Según este libro, no. Ser riguroso significa tomar las decisiones difíciles de personal con criterios claros: si dudas al contratar, mejor sigue buscando; y si ya sabes que necesitas hacer un cambio, hazlo cuanto antes en vez de alargarlo. La señal de que alguien no encaja es que necesitas controlarlo constantemente — la gente adecuada no necesita supervisión para dar lo mejor de sí.","aplicacion":{"personal":"Aplicar este mismo criterio a mis propias colaboraciones personales: si tengo dudas serias sobre alguien desde el principio, no forzar la relación esperando que cambie.","proyecto":"Este aprendizaje me sirvió directamente para una decisión real en Reelz sobre la continuidad de una compañera en el proyecto: reaccionar rápido en vez de alargar la duda beneficia a ambas partes.","teamcompany":"Invertir el tiempo de \"búsqueda de talento\" antes de que alguien entre a un proyecto de SPARK, en vez de dejar que la gente \"pruebe\" ya dentro del equipo."},"mtime":1785881245},{"id":"separar-observacion-de-evaluacion-para-dar-feedback","fichero":"Separar observación de evaluación para dar feedback.md","titulo":"Separar observación de evaluación para dar feedback","libro":"Comunicación No Violenta","competencia":"Empathy \u0026 Diversity","tags":["herramienta","comunicación","feedback"],"highlight":"\"Si combinamos la observación y la evaluación seguramente la otra persona escuchará una crítica\" (Pág 40)","pagina":"40","question":"¿Por qué alguien se pone a la defensiva cuando le dices algo que para ti es solo un hecho objetivo?","answer":"Porque casi nunca decimos solo el hecho: lo mezclamos con nuestra opinión sin darnos cuenta. No es lo mismo decir \"no entregaste el informe el lunes\" (un hecho) que \"eres un desastre organizando\" (una evaluación disfrazada de hecho). Cuando mezclas las dos cosas, la otra persona deja de escuchar el hecho y solo escucha el juicio, así que se defiende en vez de escuchar.","aplicacion":{"personal":"Antes de dar una opinión sobre algo que ha hecho alguien cercano, separar mentalmente \"esto es lo que vi\" de \"esto es lo que pienso de ello\", y decir primero solo lo que vi.","proyecto":"En Reelz, cuando algo no sale como esperaba (una edición, un plazo), describir el hecho concreto antes de valorarlo, para que la conversación con el equipo no se convierta en defensa.","teamcompany":"En las TLS de SPARK, dar feedback usando solo hechos observables antes de añadir interpretaciones (\"He notado que X no se entregó a tiempo\" en lugar de \"No estás comprometido\"), tal y como ya me propuse en los Next Steps del propio ensayo."},"mtime":1785880573},{"id":"si-repito-la-misma-instruccion-de-varios-pasos-dos-veces-es-una-skill","fichero":"Si repito la misma instrucción de varios pasos dos veces, es una skill.md","titulo":"Si repito la misma instrucción de varios pasos dos veces, es una skill","libro":"Claude Code sin supervisión (Curso Anthropic)","competencia":"Digital Skill","tags":["herramienta","ia","automatización"],"highlight":"\"Si has escrito dos veces la misma instrucción de varios pasos, eso es una skill. Y la primera que deberías construir es la que verifica el trabajo de Claude.\" (Lección 03)","pagina":"","question":"¿Vale la pena construir una skill para algo que ya sé pedir bien por escrito cada vez?","answer":"Sí, y la clave está en qué mides: no cuánto tardas en escribirla la primera vez, sino cuántas veces vas a tener que acordarte de pedirla tú. Una skill se dispara sola en cuanto la tarea encaja, así que ya no depende de tu memoria. Y la primera que vale la pena construir es la que revisa el propio trabajo de Claude, porque esa es justo la que más se te olvida pedir cuando tienes prisa.","aplicacion":{"personal":"Esto explica por qué ya tengo skills como `procesa-fuente` o `ensayo-leinn`: son justo instrucciones repetidas convertidas en procedimiento. La próxima vez que le repita a Claude el mismo paso de comprobación dos veces (por ejemplo, revisar que el frontmatter tenga `competencia` antes de dar una nota por buena), convertirlo en skill en vez de repetirlo de memoria cada vez.","proyecto":"No encuentro aplicación.","teamcompany":"No encuentro aplicación."},"mtime":1786638382},{"id":"startup-organizacion-temporal-en-busca-de-un-modelo-repetible","fichero":"Startup, organización temporal en busca de un modelo repetible.md","titulo":"Startup: organización temporal en busca de un modelo repetible","libro":"El Manual del Emprendedor","competencia":"Business Model Creation","tags":["concepto","emprendimiento"],"highlight":"Definición de Start Up: \"Organización temporal en busca de un modelo de negocio rentable y escalable, que pueda repetirse.\"","pagina":"","question":"¿Una startup es simplemente una empresa pequeña que todavía no ha crecido?","answer":"No, es algo distinto por naturaleza. Una empresa ya sabe cómo gana dinero y solo tiene que ejecutar ese modelo; una startup, en cambio, todavía no sabe si su modelo funciona, y su trabajo principal es buscarlo, no ejecutarlo. Es \"temporal\" porque en cuanto encuentra ese modelo repetible y escalable, deja de ser una startup y se convierte en una empresa de verdad.","aplicacion":{"personal":"Tener claro en qué fase estoy con cada proyecto personal: ¿todavía busco el modelo, o ya lo tengo y toca ejecutar?","proyecto":"Recordar que Reelz, mientras no tenga un modelo de negocio validado y repetible, sigue siendo una startup en modo búsqueda, no una empresa en modo ejecución.","teamcompany":"Usar esta distinción en SPARK para no tratar nuestros proyectos como si ya tuviéramos el modelo resuelto, cuando en realidad seguimos en fase de búsqueda."},"mtime":1785881338},{"id":"terapia-morita-acepta-la-emocion-actua-igual","fichero":"Terapia Morita - acepta la emoción, actúa igual.md","titulo":"Terapia Morita: acepta la emoción, actúa igual","libro":"Ikigai","competencia":"Personal Cultivation","tags":["herramienta","gestión-emocional"],"highlight":"\"Acepta tus sentimientos. Si tenemos pensamientos obsesivos, no debemos intentar controlarlos ni tampoco deshacernos de ellos\" / \"Se trata de centrarse en el presente y, si estamos sufriendo, aceptar ese sufrimiento. Y sobre todo, evitar intelectualizar la situación\"","pagina":"","question":"¿Qué hacer cuando un pensamiento negativo no para de darte vueltas en la cabeza?","answer":"La terapia Morita dice que no hace falta pelearte con ese pensamiento ni intentar borrarlo a la fuerza — cuanto más luchas contra él, más fuerte se hace. En vez de eso, lo aceptas tal cual está, sin analizarlo de más, y sigues haciendo lo que tenías que hacer de todas formas. Es la acción, no el análisis, lo que te saca del bucle.","aplicacion":{"personal":"La próxima vez que tenga un pensamiento obsesivo, no intentar \"solucionarlo\" mentalmente en el momento, anotarlo, aceptarlo y seguir con la tarea que tuviera planeada.","proyecto":"Cuando surja una duda paralizante, aplicar la misma lógica: no quedarme analizando en bucle, sino dar el siguiente paso de acción ya definido en el roadmap.","teamcompany":"\"No post-mortems eternos\": aceptar el error ocurrido en una fase del proyecto sin sobreanalizarlo y pasar directamente a la siguiente acción concreta.\n  Creo que esta mentalidad es clave, porque muchas veces entramos en debates eternos, cuando lo interesante es localizar el próximo Next Step."},"mtime":1785927950},{"id":"test-it-before-you-invest-it","fichero":"Test It before you Invest It.md","titulo":"Test It before you Invest It","libro":"Pretotype It","competencia":"ChangeMaking Experiments","tags":["framework","validación","emprendimiento"],"highlight":"\"Test It before you Invest It\" — ejemplo IBM Speech to Text: vendieron un servicio de dictado de voz a texto que no existía (una persona escribía en tiempo real detrás), y así descubrieron problemas reales del producto sin haberlo construido, ahorrando millones.","pagina":"","question":"Si tienes dinero y tiempo para invertir en una idea, ¿lo más inteligente es empezar a invertir cuanto antes?","answer":"No. Antes de invertir tiempo, energía y dinero en construir algo, conviene comprobar primero si la gente realmente lo quiere. IBM \"fingió\" tener una tecnología de dictado por voz (en realidad había una persona escribiendo a mano detrás) y así descubrió problemas reales de uso sin haber gastado un euro en desarrollarla de verdad. Ahorraron millones no invirtiendo en algo que en ese momento no era rentable.","aplicacion":{"personal":"Antes de invertir dinero propio en un curso, herramienta o proyecto personal nuevo, buscar una forma barata de comprobar si de verdad lo voy a aprovechar.","proyecto":"Este concepto lo apliqué ya para dar mi recomendación a compañeros en el proyecto \"Camisetas\": probar antes de invertir. Seguir aplicándolo en cada nueva línea de Reelz antes de comprometer recursos.","teamcompany":"En SPARK, instaurar como norma que ninguna inversión relevante de tiempo o dinero se haga sin antes haber probado barato si existe demanda real."},"mtime":1785880697},{"id":"tipos-de-mercado-y-coste-de-entrada","fichero":"Tipos de mercado y coste de entrada.md","titulo":"Tipos de mercado y coste de entrada","libro":"El Manual del Emprendedor","competencia":"Innovation \u0026 Strategy","tags":["concepto","mercado","estrategia"],"highlight":"Tipos de mercado: existente (compites por atención de clientes ya existentes), nuevo (buscas si existe base de clientes), segmentado a bajo coste o a nicho, clon (copiar de otro país). \"Cuando entras a un mercado intentas coger un trozo del pastel, sin embargo, si eres capaz de crearlo hasta que la gente se dé cuenta vas a llevar un buen rato disfrutando del pastel completo.\"","pagina":"","question":"¿Entrar en un mercado ya existente y muy grande es siempre mejor que crear uno nuevo?","answer":"No necesariamente, son estrategias distintas con costes distintos. En un mercado existente compites por un trozo de un pastel que ya reparten otros, y cuanto más dominado esté ese mercado, más caro es entrar. En un mercado nuevo, en cambio, no compites por un trozo: si consigues crearlo, te quedas con el pastel entero durante un tiempo, antes de que lleguen competidores. Saber en qué tipo de mercado estás jugando cambia completamente la estrategia a seguir.","aplicacion":{"personal":"Antes de lanzarme a competir en algo muy establecido, valorar si existe una versión de \"crear mercado nuevo\" que me permita no pelear por un trozo pequeño.","proyecto":"Identificar en qué tipo de mercado juega Reelz realmente, para ajustar la estrategia de entrada y no asumir costes de un mercado ya dominado sin necesidad.","teamcompany":"Usar este marco en SPARK antes de lanzar un nuevo proyecto, para decidir conscientemente si buscamos un hueco en un mercado existente o intentamos crear uno nuevo."},"mtime":1785881419},{"id":"todo-es-una-eleccion-el-lenguaje-oculta-tu-responsabilidad","fichero":"Todo es una elección, el lenguaje oculta tu responsabilidad.md","titulo":"Todo es una elección: el lenguaje oculta tu responsabilidad","libro":"Comunicación No Violenta","competencia":"Personal Cultivation","tags":["modelo-mental","comunicación","responsabilidad"],"highlight":"\"El lenguaje que solemos usar oscurece la conciencia de nuestra responsabilidad personal\" (Pág 33)","pagina":"33","question":"Cuando dices \"tenía que hacerlo\" o \"eran órdenes\", ¿de verdad no tenías otra opción?","answer":"Casi nunca. Frases como \"tenía que\" o \"eran órdenes\" sirven para quitarte de encima la responsabilidad de una decisión que en realidad sí tomaste tú. Un profesor que dice \"tengo que poner notas porque lo manda la normativa\" en realidad está diciendo \"elijo poner notas porque quiero conservar mi trabajo\". Todo, incluso lo que parece obligado, sigue siendo una elección tuya, y reconocerlo así te devuelve el control real sobre tus actos.","aplicacion":{"personal":"Cada vez que me oiga decir \"tengo que\" sobre algo, parar y reformularlo como \"elijo\" para ser consciente de la decisión real que hay detrás.","proyecto":"En Reelz, evitar justificar decisiones del proyecto con \"no había más remedio\" y en su lugar reconocer qué elección concreta se tomó y por qué.","teamcompany":"En SPARK, cuando alguien use el \"tenía que\" para justificar algo en una TLS, ayudar a reformularlo en términos de elección, para fomentar la responsabilidad individual dentro del equipo."},"mtime":1785880640},{"id":"tecnicas-de-pretotipado-para-testar-una-idea","fichero":"Técnicas de pretotipado para testar una idea.md","titulo":"Técnicas de pretotipado para testar una idea","libro":"Pretotype It","competencia":"ChangeMaking Experiments","tags":["plantilla","validación","emprendimiento"],"highlight":"Ejemplos de pretotipado: \"The Mechanical Turk\" (sustituir la tecnología por una persona), \"The Pinocchio\" (versión no funcional que cobra vida con tu imaginación), \"The Fake Door\" (fingir que un producto existe y medir clics), entre otros.","pagina":"","question":"Si no tienes ni el dinero ni la tecnología para construir tu idea, ¿tienes que esperar a tenerlos para probarla?","answer":"No. Existen formas concretas de simular que tu producto ya existe sin construirlo de verdad: puedes poner a una persona a hacer manualmente lo que haría la tecnología (Mechanical Turk), crear un botón falso y ver cuánta gente hace clic (Fake Door), o mostrar una versión de mentira que \"cobra vida\" solo con explicarla (Pinocchio). Cada técnica te da una forma barata de comprobar interés real antes de gastar en desarrollo.","aplicacion":{"personal":"Guardar esta lista de técnicas como referencia para cuando quiera probar una idea personal (un curso, un servicio) sin tener que montarla entera primero.","proyecto":"Usar técnicas como Fake Door, Mechanical Turk o Provincial para testar nuevas funcionalidades o servicios en Reelz antes de construirlos, tal como decidí en los Next Steps del ensayo.","teamcompany":"Enseñar estas técnicas al resto de socios de SPARK para que cualquier nueva idea de proyecto dentro del equipo pase primero por un pretotipo barato antes de recibir recursos."},"mtime":1785880721},{"id":"una-buena-compania-no-es-un-sprint","fichero":"Una buena compañía no es un sprint.md","titulo":"Una buena compañía no es un sprint","libro":"The Duolingo Handbook","competencia":"Leading Thoughts","tags":["modelo-mental","valores","largo-plazo"],"highlight":"\"Debes tomar decisiones alineadas al objetivo final. Cuando realmente quieres construir una buena compañía debes invertir tiempo y esfuerzo en cosas que quizá no muestran resultados inmediatos... Duolingo quería ser la mejor app de educación y para ello limitaron sus anuncios, ganaron menos durante un tiempo, pero se mantuvieron firmes en sus valores para poder crecer.\"","pagina":"","question":"Si una decisión te hace ganar menos dinero ahora mismo, ¿es automáticamente una mala decisión de negocio?","answer":"No, depende de hacia dónde apunte. Duolingo limitó sus anuncios y ganó menos a corto plazo, pero esa decisión estaba alineada con su misión de ser la mejor app de educación, y eso les permitió crecer más a largo plazo. Construir algo excepcional no es un sprint de resultados inmediatos: a veces exige sacrificar ganancias rápidas para proteger algo que vale más con el tiempo.","aplicacion":{"personal":"Evaluar mis decisiones no solo por el resultado inmediato, sino por si me acercan a la persona que quiero ser a largo plazo.","proyecto":"En Reelz, estar dispuesto a sacrificar un ingreso rápido si va en contra de la calidad o los valores que quiero que definan el proyecto a largo plazo.","teamcompany":"Cuestionar en SPARK si a veces nos movemos por dinero rápido sin plantearnos qué objetivo e impacto queremos tener realmente a largo plazo."},"mtime":1785881560},{"id":"una-marca-centenaria-decidir-pensando-en-100-anos","fichero":"Una marca centenaria, decidir pensando en 100 años.md","titulo":"Una marca centenaria: decidir pensando en 100 años","libro":"The Duolingo Handbook","competencia":"Innovation \u0026 Strategy","tags":["modelo-mental","visión","marca"],"highlight":"\"El objetivo de Duolingo no es que aprendas un idioma, sino que sea tu compañero de vida +100 años en cuanto al aprendizaje. Es muy diferente cuando tomas las decisiones no pensando en tu balance de este trimestre, sino pensando en la proyección de tu marca cara 100 años.\"","pagina":"","question":"Si piensas tus decisiones de negocio en función del próximo trimestre, ¿tomas las mismas decisiones que si pensaras en los próximos 100 años?","answer":"No, cambian por completo. Cuando decides pensando solo en el trimestre, priorizas lo que da resultados ya. Cuando decides pensando en 100 años, priorizas lo que construye confianza y relación duradera, aunque tarde más en dar frutos. Duolingo no se ve a sí misma como una app que te enseña un idioma y ya, sino como un compañero de aprendizaje de toda la vida — y eso cambia qué decisiones toman hoy.","aplicacion":{"personal":"Antes de una decisión importante, preguntarme cómo la vería si pensara en el impacto a muy largo plazo, no solo en el resultado de esta semana o mes.","proyecto":"Plantearme si las decisiones de Reelz se toman pensando en el próximo cliente o en construir una relación de marca duradera con quienes ya confían en nosotros.","teamcompany":"Proponer a SPARK imaginar, en una sesión de equipo, cómo se vería nuestro proyecto si pensáramos en él a muy largo plazo en vez de en el próximo trimestre de LEINN."},"mtime":1785881606},{"id":"una-regla-que-claude-no-puede-saltarse-va-en-un-hook-no-en-claude-md","fichero":"Una regla que Claude no puede saltarse va en un hook, no en CLAUDE.md.md","titulo":"Una regla que Claude no puede saltarse va en un hook, no en CLAUDE.md","libro":"Claude Code sin supervisión (Curso Anthropic)","competencia":"Digital Skill","tags":["framework","ia","reglas"],"highlight":"\"Si que se salte la regla no es aceptable, no la dejes en manos de que siga instrucciones.\" (sección \"¿Dónde va cada regla?\")","pagina":"","question":"Si ya le he pedido claramente algo en CLAUDE.md, ¿por qué no basta con eso para una regla que de verdad importa?","answer":"Porque CLAUDE.md es una petición, no una garantía: Claude normalmente la respeta, pero \"normalmente\" no vale para algo peligroso de verdad, como borrar algo que no se puede recuperar. Un hook es distinto: es código que se ejecuta sí o sí antes de la acción y puede bloquearla de verdad, sin depender de que Claude decida hacerte caso esa vez en concreto.","aplicacion":{"personal":"Si alguna vez quiero que Claude Code nunca borre o sobrescriba una nota de 02-Notas-permanentes sin preguntar antes, no basta con dejarlo escrito en CLAUDE.md: montar un hook que lo bloquee de verdad.","proyecto":"No encuentro aplicación.","teamcompany":"No encuentro aplicación."},"mtime":1786638381},{"id":"velocidad-de-escape-de-la-longevidad","fichero":"Velocidad de escape de la longevidad.md","titulo":"Velocidad de escape de la longevidad","libro":"Ikigai","competencia":"Personal Cultivation","tags":["concepto","longevidad","ciencia"],"highlight":"«velocidad de escape de la longevidad»","pagina":"","question":"¿Podría la ciencia algún día ir ganándole la carrera al envejecimiento en vez de solo intentar alcanzarlo?","answer":"La \"velocidad de escape de la longevidad\" es la idea de que, si los avances médicos consiguen alargarte la vida más de un año por cada año que pasa, en la práctica dejas de \"perder terreno\" frente a la vejez: la ciencia avanza más rápido de lo que tú envejeces. No es que te hagas inmortal, es que la meta se aleja más deprisa de lo que tú te acercas a ella.","aplicacion":{"personal":"No esperar pasivamente a que \"la ciencia lo resuelva\" — cuidar mis hábitos de salud ahora es lo único que controlo mientras esa velocidad de escape, si llega, todavía no existe.","proyecto":"Si en el futuro algún proyecto toca sectores de salud o longevidad, tener este concepto como referencia de hacia dónde puede evolucionar el mercado de la prevención y el bienestar.","teamcompany":"No encuentro una aplicación concreta."},"mtime":1785928930},{"id":"verificar-el-trabajo-de-claude-empieza-por-el-diff-no-por-el-resumen-que-lo-acompana","fichero":"Verificar el trabajo de Claude empieza por el diff, no por el resumen que lo acompaña.md","titulo":"Verificar el trabajo de Claude empieza por el diff, no por el resumen que lo acompaña","libro":"Claude Code sin supervisión (Curso Anthropic)","competencia":"Digital Skill","tags":["modelo-mental","ia","verificación"],"highlight":"\"Un informe limpio no es prueba de código limpio.\" (Lección 08)","pagina":"","question":"Si Claude me da un resumen claro y ordenado de lo que hizo, ¿hace falta revisar algo más?","answer":"Sí, porque un resumen bien escrito solo cuenta la versión de Claude de lo que hizo, y esa versión puede ser sincera pero incompleta. Lo único que dice de verdad qué cambió es mirar el cambio en sí — en código, el diff; en mi caso, los archivos reales que creó o modificó. Ahí es donde aparece lo que el resumen no mencionó.","aplicacion":{"personal":"Cuando Claude Code me dé un resumen de qué notas creó o actualizó en el vault, revisar los archivos reales antes de darlas por buenas, no fiarme solo del resumen del chat — es literalmente el paso que mi propio proceso en CLAUDE.md ya pide (\"antes de darlas por definitivas\").","proyecto":"No encuentro aplicación.","teamcompany":"No encuentro aplicación."},"mtime":1786638366},{"id":"yoga-y-respiracion-consciente-para-unir-cuerpo-y-mente","fichero":"Yoga y respiración consciente para unir cuerpo y mente.md","titulo":"Yoga y respiración consciente para unir cuerpo y mente","libro":"Ikigai","competencia":"Personal Cultivation","tags":["herramienta","cuerpo-mente","respiración"],"highlight":"\"yoga busca unir el cuerpo y la mente, para hacer avanzar a la persona hacia una vida sana y en comunión con lo que la rodea.\" / \"Respirar mejor para vivir más\"","pagina":"","question":"¿Puede algo tan simple como respirar bien tener un impacto real en cuánto y cómo vives?","answer":"El yoga combina movimiento y respiración con la intención de que el cuerpo y la mente dejen de ir cada uno por su lado. Una parte central de eso es simplemente aprender a respirar mejor: respiraciones más lentas y profundas activan el sistema que te calma, en vez del que te acelera. No hace falta ser un experto en yoga — el punto de partida es la respiración consciente.","aplicacion":{"personal":"Incorporar 5 minutos de respiración consciente (inhalar-exhalar lento) antes de entrenar junto a ejercicios de movilidad, como puente entre cuerpo y mente.","proyecto":"No encuentro aplicación directa.","teamcompany":"Proponer abrir reuniones tensas del equipo con unas respiraciones conjuntas antes de entrar en el tema difícil, en vez de arrancar directamente en modo reactivo."},"mtime":1785929459},{"id":"zonas-azules-los-4-pilares-de-la-longevidad","fichero":"Zonas Azules - los 4 pilares de la longevidad.md","titulo":"Zonas Azules: los 4 pilares de la longevidad","libro":"Ikigai","competencia":"Personal Cultivation","tags":["framework","salud","longevidad"],"highlight":"\"las claves de una vida larga son la dieta, el ejercicio, un propósito en la vida (un ikigai) y buenas conexiones sociales, es decir, contar con muchos amigos y con buenas relaciones dentro de la familia.\"","pagina":"","question":"¿Qué tienen en común los lugares del mundo donde la gente vive más de 100 años sin gimnasios de lujo ni dietas de moda?","answer":"No es un truco ni un suplemento mágico. Es la combinación de cuatro cosas simples que se refuerzan entre sí: comer bien, moverse cada día de forma natural, tener una razón para vivir y estar rodeado de gente que te apoya. Si solo tienes una de las cuatro, no basta, funcionan como un equipo, no por separado.","aplicacion":{"personal":"Auditar mi semana actual contra los 4 pilares (dieta / movimiento / propósito / conexión social) y detectar cuál es el más débil ahora mismo.","proyecto":"No encuentro una aplicación directa. Sin embargo, sería interesante buscar proyectos que puedan ayudar a nuestros clientes en alguno de los pilares.","teamcompany":"Podríamos hacer un dinámica en la que aplicar el mismo diagnóstico de \"4 pilares\" al equipo, no solo a personas: ¿tenemos ritual de comida/descanso compartido, movimiento, propósito común y buena relación entre socios?"},"mtime":1785927293},{"id":"indice-boi-test-de-coherencia-de-una-idea-de-oceano-azul","fichero":"Índice BOI - test de coherencia de una idea de océano azul.md","titulo":"Índice BOI: test de coherencia de una idea de océano azul","libro":"La Estrategia del Océano Azul","competencia":"Business Model Creation","tags":["herramienta","modelo-de-negocio"],"highlight":"\"El índice de ideas de océano azul (BOI) es un test sencillo pero sólido de esta perspectiva sistemática [...] si el CD-i de Philips y el Iridium de Motorola hubieran evaluado sus ideas según el índice BOI, se habrían percatado de lo lejos que estaban de la apertura de océanos azules lucrativos.\" (pág. 160)","pagina":"160","question":"¿Cómo distingo, antes de invertir tiempo y dinero, si mi idea de negocio es un océano azul de verdad o solo tecnología interesante sin mercado?","answer":"Es el chequeo final que junta todo lo anterior del libro en un solo test: ¿tiene mi idea Utilidad excepcional para el comprador? ¿tiene un Precio estratégico accesible para el grueso del mercado? ¿puedo llegar a mi Coste objetivo sin perder margen? ¿he resuelto los obstáculos de Adopción? Si fallo en alguna de las cuatro, no importa lo innovadora que sea la tecnología (como el CD-i de Philips o el Iridium de Motorola, fracasos famosos de innovación tecnológica sin mercado) — la idea no es un océano azul, es una apuesta cara. El BOI sirve para no enamorarse de una idea solo porque es técnicamente brillante.","aplicacion":{"personal":"No encuentro aplicación directa.","proyecto":"Antes de meterme de lleno en una idea o proyecto nuevo que me entusiasme, pasarla por las cuatro preguntas del BOI en 10 minutos, en vez de descubrir a los 3 meses que fallaba en precio o adopción.","teamcompany":"Proponer en SPARK usar el BOI como checklist rápido antes de aprobar cualquier iniciativa nueva de Team Company que requiera tiempo o presupuesto compartido."},"mtime":1789035156}],"vault":"LEINNer"}</script>

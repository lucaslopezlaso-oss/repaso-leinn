ntaria ('Haré mucho más de lo que me corresponde').\" (pág. 196)","pagina":"196","question":"Si una decisión de equipo es objetivamente buena para todos, ¿por qué a veces la gente igualmente se resiste a ella o la cumple a regañadientes?","answer":"No basta con que una decisión sea justa en el resultado — importa igual (o más) que el proceso para llegar a ella se haya sentido justo. Son tres cosas: Participación (involucrar a la gente afectada en las decisiones que les afectan, pidiendo su opinión de verdad, no solo informándoles); Explicación (que todos entiendan por qué se tomó esa decisión final, aunque no sea la que ellos proponían); Expectativas claras (dejar clarísimo desde el principio qué se espera de cada uno y cómo se les va a juzgar). Cuando estos tres se cumplen, la gente coopera voluntariamente y hace más de lo que le toca, aunque el resultado concreto no sea el que ellos hubieran elegido. Cuando fallan, aunque el resultado sea \"justo\" sobre el papel, la gente se resiste.","aplicacion":{"personal":"Cuando tenga que aceptar una decisión de otros que no me favorece del todo (una nota de grupo, un reparto de tareas), fijarme si lo que me cuesta aceptar es el resultado en sí o que no sentí participación/explicación, para distinguir mi queja real.","proyecto":"En Reelz, cuando tenga que tomar una decisión que afecte a cómo trabaja el equipo (decisiones importantes), aplicar los tres principios antes de comunicarla como un hecho consumado. Creo que esto ha pasado en situaciones y puede que Blanca sobretodo se pueda sentir reflejada en ello.","teamcompany":"Proponer en SPARK que cualquier decisión que afecte a todo el Team Company (cambios de dinámica, reparto de responsabilidades) pase explícitamente por los tres principios del proceso justo antes de zanjarse, para evitar resistencias silenciosas después."},"mtime":1789035373},{"id":"el-rechazo-en-una-venta-no-es-personal","fichero":"El rechazo en una venta no es personal.md","titulo":"El rechazo en una venta no es personal","libro":"El arte de cerrar la venta","competencia":"Personal Cultivation","tags":["modelo-mental","ventas","rechazo"],"highlight":"\"El temor al rechazo. El rechazo, NO es personal. Diga lo que te diga el prospecto. Un prospecto no te puede rechazar a ti como persona porque todavía no sabe quién eres, lo único que hace es responder a una oferta comercial.\"","pagina":"","question":"Cuando un cliente potencial dice que no, ¿te está rechazando a ti como persona?","answer":"No, aunque lo sienta así. Un prospecto que dice que no todavía ni te conoce de verdad: solo está respondiendo a una oferta comercial concreta, no juzgándote como persona. Entender esto es clave para no venirte abajo mentalmente cada vez que una venta no se cierra, porque el rechazo a la oferta no dice nada sobre tu valor.","aplicacion":{"personal":"Recordarme esta distinción cada vez que reciba un \"no\" en cualquier ámbito de mi vida, no solo en ventas.","proyecto":"Después de una llamada de Reelz que no se cierra (como me pasó con Frutas Marol), entender que ese rechazo es a la oferta, no a mí, y seguir adelante sin desgaste emocional.","teamcompany":"Transmitir esta mentalidad a mis socios de SPARK que hacen llamadas de ventas, para que el rechazo no erosione su confianza personal."},"mtime":1785881458},{"id":"el-ritmo-pausado-y-constante-de-las-abuelas-de-okinawa","fichero":"El ritmo pausado y constante de las abuelas de Okinawa.md","titulo":"El ritmo pausado y constante de las abuelas de Okinawa","libro":"Ikigai","competencia":"Personal Cultivation","tags":["modelo-mental","hábitos","gestión-del-estrés"],"highlight":"\"siempre ocupados con tareas aparentemente importantes pero, si uno se fijaba bien, descubría que lo hacían todo con calma\" / \"Hacer muchas cosas cada día. Estar siempre ocupada, pero una detrás de otra, sin agobiarte\"","pagina":"","question":"¿Estar siempre ocupado es lo mismo que vivir estresado?","answer":"No. Las personas más longevas del libro están activas todo el día —cocinan, cuidan el huerto, ven a sus vecinas— pero hacen cada cosa de una en una y sin prisa, sin la sensación de estar \"agobiadas\" que solemos tener nosotros. La clave no es hacer menos cosas, es hacerlas sin urgencia constante.","aplicacion":{"personal":"Rediseñar mi rutina diaria como una secuencia de tareas una detrás de otra, no en paralelo ni con prisa, aunque el número total de cosas que hago sea parecido al de ahora.","proyecto":"Tener esa mentalidad de constancia sin presión excesiva.","teamcompany":"Intentaría aplicar check-in para preocuparnos sobre el estrés de nuestros socios y su nivel de saturación. Además de ofrecer ayuda a aquellos en peores situaciones."},"mtime":1785929365},{"id":"el-socio-corresponsable-coste-inmediato-por-fallar","fichero":"El socio corresponsable, coste inmediato por fallar.md","titulo":"El socio corresponsable: coste inmediato por fallar","libro":"Hábitos Atómicos","competencia":"Team \u0026 Community Learning","tags":["herramienta","hábitos","compromiso"],"highlight":"\"Socio Corresponsable: crea un costo inmediato por fallar. Esto genera incomodidad y lo hace insatisfactorio.\"","pagina":"","question":"Si quieres sostener un hábito difícil en el tiempo, ¿es mejor intentarlo solo o comprometerte delante de otra persona?","answer":"Comprometerte delante de otra persona funciona mucho mejor, porque crea un coste inmediato si fallas: no quieres quedar mal ni decepcionar a alguien que confía en que cumplas. Desde hace años tengo hábitos compartidos con mi grupo de amigos (aprender un idioma, meditar, leer) y ese compromiso social multiplica las probabilidades de sostenerlo, comparado con intentarlo completamente solo.","aplicacion":{"personal":"Buscar un socio corresponsable para el próximo hábito que quiera instaurar, en vez de intentarlo en solitario.","proyecto":"En Reelz, comprometerme públicamente con el equipo sobre un objetivo personal dentro del proyecto, para que el coste social de fallar me empuje a cumplirlo.","teamcompany":"Proponer a SPARK crear parejas de corresponsabilidad entre socios para los hábitos o compromisos individuales que afectan al rendimiento del equipo."},"mtime":1785881730},{"id":"elegir-el-nivel-de-automatizacion-segun-cuanto-control-necesito","fichero":"Elegir el nivel de automatización según cuánto control necesito.md","titulo":"Elegir el nivel de automatización según cuánto control necesito","libro":"Claude Code sin supervisión (Curso Anthropic)","competencia":"Digital Skill","tags":["framework","ia","automatización"],"highlight":"\"Empieza por rutinas. Baja por el espectro solo cuando el trabajo pida ese control extra.\" (Lección 06)","pagina":"","question":"Si ya tengo la opción de usar rutinas, modo headless o el Agent SDK, ¿por qué no usar directamente lo más potente desde el principio?","answer":"Porque lo más potente también es lo que más tengo que construir y mantener yo mismo. Una rutina no requiere montar nada; el modo headless y el Agent SDK sí. La pregunta no es \"qué es lo más capaz\", es \"cuánto control necesito de verdad para esta tarea en concreto\" — y casi siempre la respuesta es menos de lo que parece al principio.","aplicacion":{"personal":"Antes de programar una rutina o un hook para que el vault se procese solo, preguntarme primero si de verdad hace falta ese nivel, o si con pedirlo a mano de vez en cuando basta.","proyecto":"Si en el futuro quiero automatizar alguna tarea repetitiva de Reelz con IA (por ejemplo, un resumen semanal de entregas a clientes), empezar por lo más simple — pedirlo a mano — antes de montar una rutina programada o algo a medida.","teamcompany":"No encuentro aplicación."},"mtime":1786638371},{"id":"eliminar-los-derrochadores-de-tiempo-del-vendedor","fichero":"Eliminar los derrochadores de tiempo del vendedor.md","titulo":"Eliminar los derrochadores de tiempo del vendedor","libro":"El arte de cerrar la venta","competencia":"Self Driven Learning","tags":["herramienta","productividad","ventas"],"highlight":"Derrochadores de tiempo: aplazar, contactos de venta incompletos, deficiencias en la presentación, desconocimiento del producto, citas no confirmadas, perfeccionismo innecesario, distracción y divagación mental, cansancio por trabajo excesivo, falta de ambición. \"Aplique la regla del 80/20: dedique el ochenta por ciento de su tiempo a lo más importante.\"","pagina":"","question":"Si sientes que trabajas muchas horas pero avanzas poco, ¿el problema es que necesitas trabajar todavía más horas?","answer":"Probablemente no. El problema suele ser que buena parte de esas horas se las llevan \"derrochadores de tiempo\" concretos: aplazar tareas, presentaciones mal preparadas, citas que no confirmas, perfeccionismo en detalles que no importan. La solución no es añadir más horas, sino identificar y eliminar estos ladrones de tiempo específicos, y aplicar la regla 80/20 para dedicar el grueso del tiempo a lo que de verdad mueve la aguja.","aplicacion":{"personal":"Identificar mis propios derrochadores de tiempo de esta lista y atacar el que más se repita en mi semana.","proyecto":"Aplicar la confirmación y reprogramación de citas en Reelz de forma sistemática, ya que en más de una ocasión los prospectos no se han conectado, tal como decidí en los Next Steps.","teamcompany":"Compartir esta lista con SPARK como checklist de productividad para cualquier socio que sienta que trabaja mucho pero avanza poco."},"mtime":1785881528},{"id":"ensena-no-lo-cuentes-prototipos-en-vez-de-discursos","fichero":"Enseña, no lo cuentes, prototipos en vez de discursos.md","titulo":"Enseña, no lo cuentes: prototipos en vez de discursos","libro":"The Duolingo Handbook","competencia":"ChangeMaking Experiments","tags":["concepto","prototipado","cultura"],"highlight":"\"Prototipos, no discursos. Otra parte de la cultura en Duolingo. No se buscan discursos sobre ideas, se buscan prototipos que muestran esa idea en la realidad. 'Los productos geniales no necesitan explicación, necesitan una oportunidad.'\"","pagina":"","question":"Si tienes una buena idea, ¿la mejor forma de convencer a tu equipo es explicarla muy bien?","answer":"No tanto como enseñarla hecha realidad, aunque sea de forma mínima. Un buen discurso puede convencer con palabras, pero un prototipo, aunque sea sencillo, deja que la idea hable por sí misma. Las mejores ideas no necesitan una defensa elaborada, solo necesitan la oportunidad de mostrarse en la práctica para que se entiendan solas.","aplicacion":{"personal":"Cuando tenga una idea nueva, priorizar construir una versión mínima de ella antes que preparar un discurso para convencer a otros.","proyecto":"En Reelz, ante una nueva funcionalidad o servicio, construir un prototipo rápido en vez de debatirlo largamente en una reunión.","teamcompany":"Proponer en SPARK que cualquier idea nueva llegue a la TLT con un mini-prototipo, no solo con una explicación verbal."},"mtime":1785881589},{"id":"esquema-de-las-cuatro-acciones-eliminar-reducir-incrementar-crear","fichero":"Esquema de las cuatro acciones - eliminar reducir incrementar crear.md","titulo":"Esquema de las cuatro acciones para rediseñar la curva de valor","libro":"La Estrategia del Océano Azul","competencia":"Innovation \u0026 Strategy","tags":["framework","estrategia"],"highlight":"\"1. ¿Qué variables que el sector da por sentadas deberían eliminarse? 2. ¿Qué variables se deberían reducir muy por debajo del estándar del sector? 3. ¿Qué variables se deberían incrementar muy por encima del estándar del sector? 4. ¿Qué variables se deberían crear que la industria jamás haya ofrecido?\" (pág. 55)","pagina":"55","question":"Si me piden mejorar mi producto o servicio, ¿por qué mi primer instinto es siempre pensar en qué añadir, y casi nunca en qué quitar?","answer":"Son cuatro preguntas que hay que hacerse en este orden sobre cualquier producto o servicio para construir una curva de valor distinta a la del sector: qué cosas que todo el mundo da por hecho puedo quitar del todo, qué cosas puedo dejar muy por debajo de lo normal, qué cosas puedo llevar muy por encima de lo normal, y qué cosas puedo inventar que nadie ha ofrecido nunca. Las dos primeras preguntas (eliminar y reducir) son las que de verdad bajan el coste, y son las que casi nadie se plantea porque estamos entrenados para sumar, no para quitar. Las otras dos (incrementar y crear) son las que suben el valor percibido. Aplicar las cuatro a la vez es lo que rompe la disyuntiva entre valor y coste.","aplicacion":{"personal":"Aplicar el esquema a mi forma de organizar el día: qué actividad puedo eliminar del todo (no reducir, eliminar), qué puedo reducir muy por debajo de lo que hago ahora, qué debería incrementar mucho más de lo normal, y qué podría empezar a hacer que nunca he probado.","proyecto":"En Reelz, hacer el ejercicio completo sobre nuestro proceso de edición: qué parte del servicio estándar (ej. número de revisiones, formatos de entrega) podemos eliminar o reducir sin que baje el valor percibido, y qué podríamos crear (ej. algo que ninguna agencia de edición ofrece hoy) que dispare el valor para el cliente.","teamcompany":"Proponer en SPARK usar este esquema para revisar alguna dinámica de equipo que se ha quedado anticuada — en vez de solo añadir nuevas normas o rituales, preguntar primero qué debería eliminarse.\n\n![[Esquema de 4 Acciones.heic]]"},"mtime":1788562259},{"id":"estado-de-flow-equilibrio-entre-reto-y-habilidad","fichero":"Estado de Flow - equilibrio entre reto y habilidad.md","titulo":"Estado de Flow: equilibrio entre reto y habilidad","libro":"Ikigai","competencia":"Self Driven Learning","tags":["framework","productividad","concentración"],"highlight":"\"Mihály Csíkszentmihályi, que estudió en profundidad el estado en el que los seres humanos entramos cuando estamos totalmente inmersos en una tarea. Lo llamó «estado de fluir»\" / \"Elegir un reto lo suficientemente difícil, pero no demasiado\" / \"Tener objetivos concretos y claros\"","pagina":"","question":"¿Por qué a veces el tiempo \"desaparece\" cuando estás entrenando o trabajando en algo, y otras veces cada minuto se hace eterno?","answer":"Entras en \"flow\" cuando el reto que tienes delante encaja justo con lo que sabes hacer: ni tan fácil que te aburras, ni tan difícil que te bloquees. Además necesitas saber exactamente qué estás intentando conseguir ahora mismo, y concentrarte solo en eso, sin repartir la cabeza en varias cosas a la vez.","aplicacion":{"personal":"Antes de cada sesión de entrenamiento o trabajo, fijar un único objetivo concreto de esa sesión (no una lista larga) para facilitar entrar en flow.","proyecto":"Al planificar sprints, calibrar las tareas para que el equipo tenga retos ligeramente por encima de su nivel actual. También, por ejemplo, para asignación de LPs.","teamcompany":"No encuentro una aplicación concreta."},"mtime":1785928118},{"id":"estoicismo-visualizacion-negativa-e-impermanencia","fichero":"Estoicismo - visualización negativa e impermanencia.md","titulo":"Estoicismo: visualización negativa e impermanencia","libro":"Ikigai","competencia":"Personal Cultivation","tags":["modelo-mental","filosofía","gratitud"],"highlight":"\"visualización negativa, tenemos que contemplar eventos negativos, pero sin preocuparnos por ellos.\" / \"Ser conscientes de la impermanencia de las cosas no nos tiene que entristecer, sino que nos ha de servir para amar el presente y a los que nos rodean.\"","pagina":"","question":"¿Pensar en que podrías perderlo todo te vuelve más ansioso o te puede hacer sentir mejor?","answer":"Los estoicos hacían justo lo contrario de lo que parece lógico: imaginaban a propósito que perdían las cosas que querían, no para sufrir, sino para valorarlas más mientras las tienen. Recordar que nada dura para siempre no es pesimismo, es un truco mental para disfrutar más el presente en vez de darlo por hecho.","aplicacion":{"personal":"Una sesión semanal de Journaling dedicada a pensar en algo o alguien que valoro dando por hecho, imaginando su ausencia, solo para reactivar la gratitud, no la ansiedad.","proyecto":"De vez en cuando, en las reuniones de proyecto, hacer el ejercicio de \"¿y si esto fallara del todo?\" para valorar mejor lo que sí funciona ahora y no dar por sentado el progreso actual.","teamcompany":"En las retrospectivas de equipo, incluir un momento para reconocer explícitamente lo que tenemos ahora (relación entre socios, tracción, aprendizajes) antes de pasar a lo que falla."},"mtime":1785928577},{"id":"estructura-de-peticion-consciente-en-comunicacion-no-violenta","fichero":"Estructura de petición consciente en Comunicación No Violenta.md","titulo":"Estructura de petición consciente en Comunicación No Violenta","libro":"Comunicación No Violenta","competencia":"Cooperative Leadership","tags":["herramienta","comunicación","plantilla"],"highlight":"\"Cuando solo expresamos nuestros sentimientos quizás a nuestro interlocutor no le resulte claro lo que esperamos que haga\" (Pág 82) — estructura: \"Me siento [...] porque yo [...]\" (Pág 71)","pagina":"82","question":"¿Por qué a veces expresas exactamente cómo te sientes y aun así la otra persona no cambia nada?","answer":"Porque contar tu sentimiento no es lo mismo que pedir algo concreto. Si solo dices \"me molesta que llegues tarde\", la otra persona sabe que estás mal, pero no sabe qué quieres que haga distinto. Hay que cerrar el círculo con una petición clara, específica y en positivo (qué sí quieres, no qué no quieres), del tipo \"me sentí X porque necesito Y, por eso te pido Z\".","aplicacion":{"personal":"Practicar la estructura completa (sentimiento + necesidad + petición específica) al menos una vez por semana en una conversación real, en vez de quedarme solo en expresar cómo me siento.","proyecto":"En Reelz, cuando pida algo a un socio o proveedor, formular la petición en positivo y específica (qué necesito, para cuándo) en vez de peticiones vagas tipo \"deberíamos ir más rápido\".","teamcompany":"Cuando abra un tema en las TLS de SPARK, indicar explícitamente qué tipo de respuesta espero (opinión, decisión, idea, acuerdo) para no generar conversaciones difusas, tal como decidí en los Next Steps de este ensayo."},"mtime":1785880597},{"id":"evitar-etiquetas-al-juzgar-a-alguien","fichero":"Evitar etiquetas al juzgar a alguien.md","titulo":"Evitar etiquetas al juzgar a alguien","libro":"Comunicación No Violenta","competencia":"Empathy \u0026 Diversity","tags":["concepto","comunicación","prejuicios"],"highlight":"\"nunca he visto a alguien perezoso, se de uno que dormía entre el almuerzo y la cena\" (Pág 40)","pagina":"40","question":"Si alguien hace una vez algo que consideras \"de vago\", ¿eso lo convierte en una persona vaga?","answer":"No. Cuando le pones una etiqueta a alguien (\"vago\", \"desastre\", \"poco comprometido\"), dejas de ver lo que realmente hizo y empiezas a verlo solo a través de esa etiqueta. Y lo peor es que la etiqueta se vuelve una profecía que se cumple sola: si de niño te dicen que cantas mal, dejas de cantar, practicas menos, cada vez lo haces peor, y la etiqueta se \"confirma\" aunque nunca fue del todo cierta.","aplicacion":{"personal":"Identificar una etiqueta que me pusieron de pequeño (por ejemplo, sobre cantar) y cuestionar si sigue siendo cierta o si solo se mantiene por la propia etiqueta.","proyecto":"En Reelz, si pienso que alguien \"no vale\" para una tarea, revisar si es una conclusión basada en hechos recientes o una etiqueta que le puse hace tiempo y ya no reviso.","teamcompany":"Revisar mis mensajes antes de enviarlos y mis palabras antes de decirlas en SPARK para eliminar etiquetas o generalizaciones (\"siempre\", \"nunca\", \"todos\", \"nadie\"), tal como decidí en los Next Steps de este ensayo."},"mtime":1785880612},{"id":"evitar-la-palabra-pero-al-responder-a-alguien","fichero":"Evitar la palabra pero al responder a alguien.md","titulo":"Evitar la palabra \"pero\" al responder a alguien","libro":"Comunicación No Violenta","competencia":"Empathy \u0026 Diversity","tags":["herramienta","comunicación"],"highlight":"Aprendizaje \"Evitar la palabra 'pero'\" (Pág 123), especialmente si alguien está enfadado.","pagina":"123","question":"¿Por qué una frase como \"gracias, pero no puedo\" a veces suena más a rechazo del que pretendías?","answer":"Porque la palabra \"pero\" borra mentalmente todo lo que dijiste antes de ella. Si dices \"muchas gracias, pero no puedo ir\", la otra persona básicamente solo escucha el \"no puedo ir\", y el agradecimiento desaparece. Si le das la vuelta y pones la parte positiva al final (\"no puedo ir, pero muchas gracias por invitarme\"), el mensaje se siente mucho más amable, aunque el contenido sea exactamente el mismo.","aplicacion":{"personal":"Cuando tenga que rechazar un plan con amigos o una invitación, poner la parte positiva al final de la frase en vez de al principio.","proyecto":"En Reelz, al rechazar una propuesta de un cliente o colaborador, evitar el \"pero\" inicial y reformular la respuesta para que lo positivo quede al cierre.","teamcompany":"En SPARK, al dar una opinión contraria en una TLS, sustituir el \"estoy de acuerdo, pero...\" por una construcción que no anule lo dicho antes, para que el resto no sienta que su idea fue descartada de entrada."},"mtime":1785880648},{"id":"foco-divergencia-y-mensaje-central-las-tres-cualidades-de-una-buena-estrategia","fichero":"Foco divergencia y mensaje central - las tres cualidades de una buena estrategia.md","titulo":"Foco, divergencia y mensaje central: las tres cualidades de una buena estrategia","libro":"La Estrategia del Océano Azul","competencia":"Innovation \u0026 Strategy","tags":["modelo-mental","estrategia"],"highlight":"\"Una estrategia eficaz de océano azul [...] tiene tres cualidades que se complementan: foco de atención, divergencia y un mensaje central convincente. Sin estas cualidades, lo más probable es que la estrategia de una compañía sea confusa, carente de diferenciación y difícil de comunicar.\" (pág. 63)","pagina":"63","question":"Si dos empresas tienen curvas de valor parecidas en un gráfico, ¿cómo distingo cuál de las dos tiene realmente \"buena estrategia\" y cuál solo tiene suerte?","answer":"Son tres pruebas rápidas para saber si una curva de valor es realmente una buena estrategia de océano azul. Foco: la empresa no intenta destacar en todas las variables del sector, se concentra en pocas (Southwest Airlines solo cuida tres cosas: servicio agradable, velocidad y salidas frecuentes — nada más). Divergencia: su perfil se aleja claramente del perfil medio del sector, no lo sigue de cerca. Mensaje central: la estrategia se puede resumir en una frase que cualquiera entiende (\"la velocidad del avión a precio de automóvil\"). Si te falta cualquiera de las tres, la estrategia sale confusa, difícil de explicar y cara de ejecutar — porque intentas ser bueno en todo a la vez, que es justo lo que hace que los costes se disparen.","aplicacion":{"personal":"Escribir mi \"mensaje central\" personal en una sola frase (cómo quiero que me describan en LEINN) y comprobar si mis tres focos de atención de este cuatrimestre son realmente pocos y claros, o si estoy intentando destacar en todo.","proyecto":"Definir el mensaje central de Reelz en una frase tipo \"la velocidad del avión a precio de automóvil\", y revisar si de verdad tenemos foco (2-3 cosas en las que somos claramente mejores) o si intentamos competir en todas las variables del sector de edición de vídeo a la vez.","teamcompany":"Proponer a SPARK que resuma en una sola frase qué nos hace diferentes como Team Company frente a otros equipos, si no sale una frase clara y compartida por todos, es señal de que falta foco o divergencia real."},"mtime":1788954175},{"id":"gestion-de-pecera-hacer-visibles-las-acciones-de-las-personas-clave","fichero":"Gestión de pecera - hacer visibles las acciones de las personas clave.md","titulo":"Gestión de pecera: hacer visibles las acciones de las personas clave","libro":"La Estrategia del Océano Azul","competencia":"Cooperative Leadership","tags":["herramienta","liderazgo"],"highlight":"\"Esto es lo que denominamos gestión de pecera, donde las acciones y las omisiones de las personas influyentes clave se exponen con total transparencia a los demás, al igual que los peces en una pecera. [...] Todos pueden ver claramente quiénes son los que se quedan atrás.\" (pág. 187)","pagina":"187","question":"Si quiero que las personas clave de un equipo se impliquen de verdad en un cambio, ¿es mejor hablar con ellas en privado o hacer público lo que cada una está haciendo (o no)?","answer":"Es una táctica de motivación: en vez de dar feedback privado a cada persona influyente sobre si está apoyando el cambio o no, se hacen públicas sus acciones (y sus omisiones) para todo el equipo, como si estuvieran en una pecera de cristal. Esto tiene dos efectos: motiva mucho a quien sí está actuando bien (todos lo ven) y presiona a quien se está quedando atrás (también se nota). Crea un terreno de juego igualado porque todos tienen la misma oportunidad de destacar y las mismas consecuencias de no hacerlo — nadie puede esconderse en la ambigüedad de \"nadie se ha dado cuenta\".","aplicacion":{"personal":"Hacer pública (aunque sea solo conmigo mismo, en un tracker visible) mi propia participación y esfuerzo en mis proyectos y objetivos.","proyecto":"En Reelz, ser transparente con el reparto de tareas y el cumplimiento de ellas. Voy a programar un agente de Claude que analice quien falla más y porque a la hora de ejecutar sus tareas impuestas juntado nuestro gestor de tareas y clockify.","teamcompany":"Proponer en SPARK que los compromisos que cada socio asume en una TLS queden visibles para todo el equipo en algún sitio, así es más fácil poder verlo en la siguiente ITV (y no hay que ir a ITVs de proyectos pasados de las que muchas veces ni tenemos recuerdo)"},"mtime":1789035318},{"id":"go-go-go-experimentar-mucho-y-rapido-con-mision-clara","fichero":"Go Go Go, experimentar mucho y rápido con misión clara.md","titulo":"Go, Go, Go: experimentar mucho y rápido con misión clara","libro":"The Duolingo Handbook","competencia":"ChangeMaking Experiments","tags":["framework","experimentación","agilidad"],"highlight":"\"Experimenta con muchas cosas al mismo tiempo, da igual que fracasen. Cuanto más rápido te muevas, más rápido vas a mejorar tu producto.\" / \"Saber priorizar: aunque es importante tener muchos experimentos en marcha a la vez, también hay que saber priorizar. Y esto solo se puede hacer si tienes claro realmente tu misión.\"","pagina":"","question":"¿Experimentar con muchas cosas a la vez sin ningún criterio te acerca más rápido al éxito?","answer":"No del todo: hacen falta dos cosas a la vez, no solo una. La velocidad de experimentar mucho y rápido sirve para aprender rápido, pero sin una misión clara que te diga qué priorizar, esos experimentos se dispersan sin rumbo. La combinación ganadora es moverse rápido (Go, Go, Go) y, al mismo tiempo, tener clarísimo tu propósito para saber qué experimentos priorizar entre todos los posibles.","aplicacion":{"personal":"Permitirme probar varias cosas nuevas a la vez en mi desarrollo personal, siempre que tenga claro cuál es mi prioridad de fondo para no dispersarme.","proyecto":"En Reelz, mantener varios experimentos pequeños en marcha simultáneamente, pero revisando constantemente que estén alineados con nuestra misión antes de invertir más en ellos.","teamcompany":"Fomentar en SPARK una cultura de \"Go Go Go\" en las pruebas de proyecto, pero exigiendo que el equipo tenga clara la misión común para poder priorizar entre experimentos."},"mtime":1785881583},{"id":"green-machine-los-6-pasos-para-escalar-lo-que-funciona","fichero":"Green Machine, los 6 pasos para escalar lo que funciona.md","titulo":"Green Machine: los 6 pasos para escalar lo que funciona","libro":"The Duolingo Handbook","competencia":"Innovation \u0026 Strategy","tags":["framework","escalado","mejora-continua"],"highlight":"\"Green Machine: un sistema que intenta mejorar cada día Duolingo. Cuando un cambio mejora las métricas se intentan realizar más cambios similares.\" Los 6 pasos: Staff It with Great People, Define Success, Set Guardrails and Think Long-Term, Build the Thing and Set Up Feedback Loops, Execute with Urgency and Excellence, Double Down on What Works, Stop What Doesn't.","pagina":"","question":"Cuando algo funciona bien en tu proyecto, ¿lo normal es seguir probando cosas nuevas en paralelo o volcarse en lo que ya funciona?","answer":"Según este sistema, volcarse en lo que funciona. El proceso tiene seis pasos: pon gente extraordinaria en el equipo, define claro qué significa éxito, pon límites pero piensa a largo plazo, construye y mide con bucles de feedback, ejecuta con urgencia y excelencia, y —el paso clave— cuando algo mejora las métricas, dobla la inversión ahí, y deja de hacer lo que no funciona. No se trata de acumular iniciativas, sino de detectar rápido qué funciona y apostar fuerte por ello.","aplicacion":{"personal":"Cuando note que un hábito o método personal está funcionando, doblar la inversión en él en vez de seguir probando alternativas por probar.","proyecto":"En Reelz, cuando un cambio mejore claramente nuestras métricas, aplicar el mismo cambio a otras áreas similares en vez de diluir el esfuerzo en muchas cosas a la vez.","teamcompany":"Proponer a SPARK adoptar este proceso de 6 pasos como marco explícito para decidir en qué invertir más recursos del equipo y qué dejar de hacer."},"mtime":1785881599},{"id":"hara-hachi-bu-come-hasta-el-80-de-saciedad","fichero":"Hara Hachi Bu - come hasta el 80% de saciedad.md","titulo":"Hara Hachi Bu: come hasta el 80% de saciedad","libro":"Ikigai","competencia":"Personal Cultivation","tags":["herramienta","salud","hábitos"],"highlight":"\"La barriga al 80 por ciento\" / \"cuando sientas que estás casi lleno y que podrías comer algo más, ¡deja de comer\"","pagina":"","question":"¿Por qué la gente más longeva del mundo deja comida en el plato a propósito?","answer":"Porque descubrieron que parar de comer un poco antes de sentirte lleno del todo hace que el cuerpo trabaje menos digiriendo y aguante más años sano. Es como no llenar el depósito de un coche hasta rebosar: con un poco menos, el motor va más fino.","aplicacion":{"personal":"Servir raciones un 20% más pequeñas de lo habitual y parar de comer al notarme \"casi lleno\" en vez de \"lleno del todo\", probarlo durante 2 semanas y evaluar cómo me siento.","proyecto":"No encuentro una aplicación directa.","teamcompany":"No encuentro una aplicación directa, más allá de compartir el conocimiento con mis socios."},"mtime":1785927406},{"id":"hipotesis-xyz-para-definir-un-experimento","fichero":"Hipótesis XYZ para definir un experimento.md","titulo":"Hipótesis XYZ para definir un experimento","libro":"Pretotype It","competencia":"ChangeMaking Experiments","tags":["plantilla","validación","experimentación"],"highlight":"\"At least X% of Y will do Z\" — X: porcentaje concreto del mercado objetivo; Y: descripción clara del mercado objetivo; Z: cómo esperas que el mercado interactúe con tu idea.","pagina":"","question":"Si dices \"algunas personas interesadas comprarán mi producto a un precio razonable\", ¿sabes ya qué tienes que validar?","answer":"No, esa frase es tan vaga que no se puede ni validar ni desmentir. La hipótesis XYZ te obliga a poner números y límites claros: al menos qué porcentaje (X), de qué grupo concreto de personas (Y), hará qué acción exacta (Z) — por ejemplo, \"al menos el 10% de la gente que vive en ciudades muy contaminadas comprará un sensor de 120€\". Aunque el número esté mal a priori, tener una hipótesis tan concreta es lo que te permite después decir claramente si acertaste o no.","aplicacion":{"personal":"Antes de dar por buena una intuición personal (por ejemplo sobre un hábito o una rutina), formularla como hipótesis XYZ para poder comprobarla de verdad.","proyecto":"Formular todas las nuevas ideas y experimentos de Reelz mediante hipótesis XYZ, definiendo público objetivo, porcentaje mínimo esperado y acción a validar, tal como decidí en los Next Steps. Quiero implementarlo también en mi próxima Learning Path sobre campañas de Google Adsense.","teamcompany":"Proponer en SPARK que ninguna idea de proyecto se presente al equipo sin antes formularse como hipótesis XYZ, para evitar debates basados en vaguedades."},"mtime":1785880729},{"id":"humildad-mas-determinacion-es-liderazgo-nivel-5","fichero":"Humildad más determinación es liderazgo nivel 5.md","titulo":"Humildad + Determinación = Liderazgo Nivel 5","libro":"Good to Great","competencia":"Leading Thoughts","tags":["modelo-mental","liderazgo"],"highlight":"\"Los líderes de nivel 5 no es que no tengan ego, al contrario, son extremadamente ambiciosos, pero tienen más ambiciones para la empresa que para sí mismo.\" / \"Enriquecimiento de tu empresa \u003e tu enriquecimiento.\"","pagina":"","question":"¿Un buen líder tiene que ser una persona modesta que no busca destacar?","answer":"No exactamente. Los líderes de Nivel 5 sí tienen ego y ambición, muchísima, pero la canalizan hacia la empresa en vez de hacia sí mismos. No se conforman con nada que no sea extraordinario, pero cuando las cosas van bien, no se atribuyen el mérito ellos solos. La combinación es rara: ambición feroz por fuera, humildad genuina por dentro.","aplicacion":{"personal":"Revisar si mi ambición está puesta en el proyecto o en quedar bien yo, y reajustar cuando note que pesa más lo segundo.","proyecto":"En Reelz, buscar siempre hacerlo de la mejor manera posible, sin conformarme con entregar algo mediocre, pero atribuyendo los éxitos al equipo, no solo a mí.","teamcompany":"Fomentar en SPARK una cultura donde la ambición se dirija a que el proyecto colectivo triunfe, no a destacar individualmente dentro del equipo."},"mtime":1785881222},{"id":"ichigo-ichie-este-momento-no-se-repetira","fichero":"Ichigo Ichie - este momento no se repetirá.md","titulo":"Ichigo Ichie: este momento no se repetirá","libro":"Ikigai","competencia":"Personal Cultivation","tags":["concepto","presencia"],"highlight":"\"este momento sólo existe ahora y no se volverá a repetir\" — «ichi-go ichi-e»","pagina":"","question":"¿Por qué una misma conversación con la misma persona nunca es realmente \"la misma\"?","answer":"Ichigo ichie significa que este instante exacto —con estas personas, en este estado de ánimo, con esta luz— no va a volver a pasar jamás, aunque mañana repitas algo parecido. Saberlo te empuja a prestar atención de verdad ahora, en vez de estar medio distraído pensando que \"ya habrá otra oportunidad\".","aplicacion":{"personal":"Guardar el móvil durante las comidas o conversaciones importantes con gente cercana, recordando que ese momento concreto no se repite.","proyecto":"Tratar las reuniones clave de cad proyecto (con leads, primeros clientes, etc...) como irrepetibles: preparación completa y atención total, sin dar por hecho que \"ya habrá otra\". Valorar cada experiencia como lo que es \"única\".","teamcompany":"Al cerrar cada hito importante del equipo, dedicar un momento consciente a celebrarlo juntos en vez de saltar inmediatamente al siguiente objetivo (aplausos o comida juntos..)."},"mtime":1785928701},{"id":"ikigai-el-proposito-que-te-mantiene-activo","fichero":"Ikigai - el propósito que te mantiene activo.md","titulo":"Ikigai: el propósito que te mantiene activo","libro":"Ikigai","competencia":"Personal Cultivation","tags":["concepto","propósito","longevidad"],"highlight":"\"Para estar siempre activo, incluso cuando no hay necesidad de trabajar, hay que tener un ikigai en el horizonte, un propósito que guíe a la persona a lo largo de su vida y que le impulse a crear belleza y utilidad para la comunidad y para sí misma.\"","pagina":"","question":"¿Por qué la gente de Okinawa nunca \"se retira\" de verdad aunque cumplan 100 años?","answer":"Porque tienen algo que les hace levantarse cada mañana con ganas: no es solo un trabajo, es una razón para existir. Cuando tienes eso, tu cuerpo y tu mente se mantienen activos porque siempre hay un motivo para seguir moviéndote, aprendiendo y ayudando a los demás. Sin ese propósito, aunque tengas todo el tiempo libre del mundo, te apagas antes.","aplicacion":{"personal":"Hacer sesiones de Journaling en busca de ese propósito que me guíe a lo largo de mi vida.","proyecto":"Antes de validar cualquier funcionalidad de Teamcompany, formular explícitamente qué problema ajeno resuelve (no solo qué ingreso genera) y dejarlo escrito en el brief del proyecto. ¿Cuál es el ikigai del proyecto? \n  Creo que eso puede dar mucho sentido a la hora de trabajar en algo.","teamcompany":"Proponer un check-in en el que cada socio comparta en una frase su ikigai personal, con un pequeño pre-work previo para fomentar la reflexión en los miembros de SPARK."},"mtime":1785927102},{"id":"innovacion-en-valor-romper-la-disyuntiva-entre-valor-y-coste","fichero":"Innovación en valor - romper la disyuntiva entre valor y coste.md","titulo":"Innovación en valor: romper la disyuntiva entre valor y coste","libro":"La Estrategia del Océano Azul","competencia":"Innovation \u0026 Strategy","tags":["modelo-mental","estrategia"],"highlight":"\"La creencia tradicional es que las compañías pueden crear un mayor valor para los clientes a un coste más elevado o bien un valor razonable a un coste menor. [...] En cambio, los que persiguen la creación de océanos azules buscan simultáneamente la diferenciación y un bajo coste.\" (pág. 31)","pagina":"31","question":"¿Por qué la mayoría de empresas dan por hecho que si quieres dar más valor tienes que subir el precio o subir el coste, en vez de plantearse que ambas cosas puedan bajar a la vez?","answer":"Casi todo el mundo piensa la estrategia como una balanza: o eres barato o eres bueno, pero no las dos cosas. La innovación en valor rompe esa balanza eliminando y reduciendo cosas que el sector da por sentadas pero que en realidad no le importan tanto al cliente (eso baja el coste), y a la vez creando o aumentando cosas que el sector nunca ha ofrecido y que sí le importan al cliente (eso sube el valor). El libro insiste en que esto no es lo mismo que innovación tecnológica: no hace falta inventar algo nuevo con tecnología, hace falta alinear la innovación con lo que la gente realmente valora, el precio y la estructura de coste — si no, \"terminan poniendo los huevos que otras empresas incubarán\" (otros se llevan el mérito de tu invento).","aplicacion":{"personal":"Antes de \"mejorar\" algo añadiendo más esfuerzo o más tiempo (lo que sube mi \"coste\" personal), preguntarme si en vez de sumar debería estar eliminando cosas que hago por costumbre y que no aportan valor real.","proyecto":"En Reelz, en vez de intentar competir ofreciendo \"más\" (más revisiones, más formatos, más rapidez) a un coste cada vez más alto para nosotros, buscar qué parte del servicio de edición estándar puedo eliminar sin que el cliente lo eche de menos, y qué podría crear que ningún competidor ofrezca.","teamcompany":"En las dinámicas de SPARK, cuestionar la idea de que \"más reuniones y más procesos = más calidad de equipo\" — probar a eliminar rituales que no aportan y sustituirlos por algo que sí genere valor real de equipo."},"mtime":1788562240},{"id":"la-cultura-de-la-disciplina-gente-pensamiento-accion","fichero":"La cultura de la disciplina, gente, pensamiento, acción.md","titulo":"La cultura de la disciplina: gente → pensamiento → acción disciplinados","libro":"Good to Great","competencia":"Cooperative Leadership","tags":["framework","disciplina","cultura"],"highlight":"\"Cómo construir la disciplina: Gente Disciplinada -\u003e Pensamiento Disciplinado -\u003e Acción Disciplinada. Debe darse en ese orden.\" / \"Limitaciones y libertad: cuando tienes personas disciplinadas, no tienes que controlarlas, solo crear un sistema que ponga unos límites, pero a su vez una libertad y responsabilidad.\"","pagina":"","question":"Si quieres que un equipo actúe con disciplina, ¿basta con imponer normas estrictas de comportamiento?","answer":"No, si te saltas el orden correcto no funciona. La disciplina real se construye en tres pasos, en este orden: primero tener a la gente adecuada (que ya trae disciplina consigo), luego que esa gente piense de forma disciplinada, y solo entonces la acción disciplinada aparece de forma natural. Si intentas imponer acción disciplinada directamente con normas, sin las dos etapas anteriores, confundes disciplina con tiranía y no funciona igual.","aplicacion":{"personal":"Antes de imponerme una nueva \"norma\" de comportamiento, revisar si primero tengo clara la forma de pensar que la sostiene, para que la acción salga sola.","proyecto":"En Reelz, en vez de crear normas rígidas de proceso, invertir en que el equipo piense de forma disciplinada sobre el porqué de cada tarea.","teamcompany":"Creo que este orden roto es uno de los motivos de tantas bajas en LEINN — trasladar esta reflexión a SPARK para construir disciplina desde la gente y el pensamiento, no solo desde normas de acción."},"mtime":1785881279},{"id":"la-dieta-de-las-zonas-azules-variedad-vegetal-y-polifenoles","fichero":"La dieta de las zonas azules - variedad vegetal y polifenoles.md","titulo":"La dieta de las zonas azules: variedad vegetal y polifenoles","libro":"Ikigai","competencia":"Personal Cultivation","tags":["herramienta","salud","alimentación"],"highlight":"\"mucha variedad de alimentos, sobre todo de origen vegetal\" / \"206 alimentos diferentes de forma regular, incluyendo especias\" / \"al menos cinco platos de verdura o fruta al día\" / \"té blanco, con una cantidad aún mayor de polifenoles, podría ser incluso más potente contra el envejecimiento... se considera que es el producto natural con mayor poder antioxidante del mundo\"","pagina":"","question":"¿Cuál es el \"secreto\" real de la dieta de la gente que vive más de 100 años: algún superalimento concreto?","answer":"No hay un solo alimento mágico. Lo que hacen es comer una variedad enorme de alimentos —más de 200 distintos a lo largo del tiempo—, sobre todo de origen vegetal, con al menos cinco raciones de fruta o verdura al día, y acompañan las comidas con té verde o blanco, que tiene mucho poder antioxidante. La clave es la variedad y lo vegetal, no un ingrediente estrella.","aplicacion":{"personal":"Probar el té verde y priorizar la ingesta de alimentos vegetales.","proyecto":"No encuentro aplicación.","teamcompany":"No encuentro aplicación."},"mtime":1785929419},{"id":"la-dificultad-como-oportunidad-de-liderazgo","fichero":"La dificultad como oportunidad de liderazgo.md","titulo":"La dificultad como oportunidad de liderazgo","libro":"El líder que no tenía cargo","competencia":"Cooperative Leadership","tags":["modelo-mental","liderazgo","adversidad"],"highlight":"\"Cuánto más difíciles son las circunstancias, mayores son las oportunidades\" (Pág 27)","pagina":"27","question":"¿Los mejores líderes se reconocen cuando todo va bien o cuando todo va mal?","answer":"Cuando todo va mal. Cualquiera puede parecer capaz cuando las cosas son fáciles, pero el verdadero cambio de mentalidad de un líder es ver las circunstancias más difíciles como su mayor oportunidad. Son esas personas en las que el grupo se apoya justo en los momentos más duros. En LEINN esto se ve claro en el concepto de Learning Path: donde otros verían una debilidad de tu proyecto, la carrera te empuja a convertirla en uno de tus puntos fuertes.","aplicacion":{"personal":"Cuando me enfrente a una dificultad grande, recordarme que ahí es exactamente donde se demuestra el liderazgo, no cuando todo va sobre ruedas.","proyecto":"Ante un problema serio en Reelz, tratarlo como la oportunidad de liderazgo del momento en vez de solo como un contratiempo a resolver rápido.","teamcompany":"Normalizar la incomodidad como herramienta de aprendizaje en SPARK, cambiando la mentalidad ante Learning Paths, conflictos o situaciones exigentes, viéndolos como oportunidades de crecimiento, tal como decidí en los Next Steps."},"mtime":1785881093},{"id":"la-jerarquia-de-los-5-niveles-de-liderazgo","fichero":"La jerarquía de los 5 niveles de liderazgo.md","titulo":"La jerarquía de los 5 niveles de liderazgo","libro":"Good to Great","competencia":"Leading Thoughts","tags":["framework","liderazgo"],"highlight":"Los 5 niveles: Individuo altamente capaz → Miembro que participa en el equipo → Directivo Competente → Líder Efectivo → Ejecutivo de Nivel 5, que \"crea la excelencia duradera mediante una combinación paradójica de humildad personal y voluntad profesional\".","pagina":"","question":"¿Ser muy bueno individualmente en tu campo te convierte automáticamente en un buen líder de equipo?","answer":"No, son escalones distintos de una misma escalera. Ser un individuo capaz es solo el primer nivel; después viene aportar bien en equipo, luego organizar recursos con eficacia, después inspirar una visión clara, y solo en el nivel más alto (Nivel 5) alguien combina una humildad personal enorme con una determinación feroz por conseguir resultados para la empresa, no para sí mismo. Tener esta escalera ayuda a saber honestamente en qué escalón estás.","aplicacion":{"personal":"Usar esta jerarquía como autoevaluación honesta: identificar en qué nivel estoy ahora mismo y qué me falta para subir al siguiente.","proyecto":"En Reelz, valorar si mis decisiones buscan resultados para el proyecto o para mi propio reconocimiento, como marca real de en qué nivel estoy operando.","teamcompany":"Compartir esta escalera con mis socios de SPARK como lenguaje común para hablar de liderazgo dentro del equipo, más allá de quién ocupa qué cargo."},"mtime":1785881213},{"id":"la-paradoja-de-stockdale","fichero":"La paradoja de Stockdale.md","titulo":"La paradoja de Stockdale","libro":"Good to Great","competencia":"Personal Cultivation","tags":["modelo-mental","resiliencia"],"highlight":"\"La paradoja de Stockdale: Nunca perder la esperanza de un buen final de la historia... hay que diferenciar ser optimista de no perder la fe, no hay que ser optimista hay que no rendirse a nivel mental afrontando la realidad con disciplina.\"","pagina":"","question":"¿Ser optimista y creer que \"todo va a salir bien pronto\" es la mejor forma de afrontar una mala racha?","answer":"No según esta paradoja: el optimismo ciego (\"saldremos de esta antes de Navidad\") puede romperte cuando la realidad no cumple el plazo. Lo que de verdad funciona es otra cosa distinta: mantener la fe inquebrantable en que al final saldrá bien, combinada con afrontar la realidad actual, por dura que sea, con total disciplina y sin adornarla. Es fe a largo plazo + realismo brutal a corto plazo, a la vez.","aplicacion":{"personal":"En rachas difíciles (deportivas o personales), separar la fe en el resultado final de las expectativas de plazo, y afrontar cada día con disciplina realista.","proyecto":"En Reelz, si un mal periodo se alarga, evitar el optimismo vacío (\"ya remontará\") y en su lugar analizar la realidad con datos, manteniendo a la vez la confianza en el proyecto a largo plazo.","teamcompany":"Transmitir a SPARK esta distinción cuando atravesemos rachas difíciles: no negar la realidad con optimismo fácil, pero tampoco perder la fe en el proyecto a largo plazo."},"mtime":1785881253},{"id":"la-presencia-como-clave-de-la-empatia","fichero":"La presencia como clave de la empatía.md","titulo":"La presencia como clave de la empatía","libro":"Comunicación No Violenta","competencia":"Empathy \u0026 Diversity","tags":["modelo-mental","comunicación","empatía"],"highlight":"\"La empatía es escuchar con el ser\" (Pág 99) / \"Resulta sorprendente ver que algo que parecía no tener solución la tiene cuando alguien te escucha\" (Pág 117)","pagina":"99","question":"Cuando un amigo tiene un problema, ¿lo que más ayuda es darle la solución?","answer":"Casi nunca. Lo que de verdad ayuda es estar ahí de verdad, presente, escuchando sin intentar arreglar nada todavía. El propio autor lo llama \"escuchar con el ser\". El ejemplo más claro de esto en mi propia vida fue una conversación en la que mi interlocutor casi ni habló, y aun así, después de veinte minutos hablando yo solo, sentí que todo mi estrés se había ido: no hicieron falta consejos, solo escucha.","aplicacion":{"personal":"Cuando alguien cercano me cuente un problema, resistir el impulso de dar consejos inmediatos y quedarme primero solo escuchando y estando presente.","proyecto":"En las llamadas con clientes de Reelz, dedicar los primeros minutos a escuchar de verdad su situación antes de pasar a ofrecer soluciones o vender.","teamcompany":"Incorporar en los check-in de SPARK preguntas como \"¿cómo te sientes respecto al proyecto?\" o \"¿cómo estás en tu vida personal?\", y quedarme presente escuchando la respuesta sin intentar solucionarla de inmediato."},"mtime":1785880620},{"id":"la-primera-trampa-del-oceano-rojo-creer-que-la-estrategia-debe-dirigirla-el-cliente","fichero":"La primera trampa del océano rojo - creer que la estrategia debe dirigirla el cliente.md","titulo":"La primera trampa del océano rojo: creer que la estrategia debe dirigirla el cliente","libro":"La Estrategia del Océano Azul","competencia":"Teampreneurship \u0026 Customer Co-creation","tags":["concepto","customer-discovery"],"highlight":"\"Primera trampa del océano rojo: la creencia de que La estrategia del océano azul es una estrategia orientada al cliente que está dirigida por el propio cliente. [...] si el foco de atención se coloca sobre los clientes actuales, las organizaciones tienden a hacer más de lo mismo por menos, quedando así atascadas en el océano rojo.\" (pág. 239)","pagina":"239","question":"Si todo el mundo dice que hay que \"escuchar al cliente\" para innovar, ¿por qué el libro advierte que hacer justo eso te puede dejar atrapado sin crecer?","answer":"Hay un malentendido muy extendido: pensar que \"centrarse en el cliente\" significa preguntar a los clientes actuales qué quieren y dárselo. El problema es que los clientes actuales solo saben pedir mejoras sobre lo que ya conocen — \"más por menos\" de lo mismo — porque no conocen otra cosa. Escuchar solo a quien ya te compra te lleva, sin darte cuenta, a competir cada vez más fino dentro del mismo océano rojo. La estrategia de océano azul no ignora al cliente, pero mira sobre todo a quien NO es cliente todavía, porque ahí está la información sobre qué está frenando a un mercado mucho más grande.","aplicacion":{"personal":"Cuando pida feedback sobre algo mío (un vídeo, un proyecto), no quedarme solo con la opinión de quien ya lo consume o me apoya — buscar activamente la opinión de quien  nunca me seguiría, porque ahí está la información que de verdad puede cambiar algo.","proyecto":"En Reelz, cuidado con diseñar nuevos servicios preguntando solo a los clientes que ya nos contratan, complementar siempre con la pregunta de por qué negocios similares NO nos contratarían.","teamcompany":"No encuentro una aplicación directa."},"mtime":1789034711},{"id":"la-regla-de-los-dos-minutos","fichero":"La regla de los dos minutos.md","titulo":"La regla de los dos minutos","libro":"Hábitos Atómicos","competencia":"Self Driven Learning","tags":["herramienta","hábitos"],"highlight":"\"Cuando empiezas un hábito no debería llevarte más de dos minutos. Siempre con la motivación queremos empezar por lo grande y esto hace que acabemos fallando.\"","pagina":"","question":"Si quieres empezar un hábito nuevo importante, ¿deberías comprometerte desde el primer día a la versión completa de ese hábito?","answer":"No, es mejor reducirlo a una versión de menos de dos minutos. El error típico es empezar motivado a lo grande (una hora de meditación, una rutina de ejercicio completa) y fallar pronto porque el esfuerzo inicial es demasiado alto. Reducir el hábito a algo que se pueda hacer en menos de dos minutos (poner música tranquila, abrir el cuaderno) hace que empezar sea casi automático, y una vez empiezas, es mucho más fácil continuar.","aplicacion":{"personal":"Sustituir un hábito ambicioso que no estoy sosteniendo (meditar y hacer journaling largo) por una versión de menos de dos minutos, como poner música tranquila y encender incienso.","proyecto":"Aplicar esta regla a nuevas prácticas que quiera instaurar en Reelz, reduciendo la primera versión al mínimo posible para asegurar que se empiece.","teamcompany":"Proponer a SPARK que cualquier nuevo ritual de equipo empiece en su versión de dos minutos, para no fracasar por exceso de ambición inicial."},"mtime":1785881701},{"id":"la-rueda-y-la-espiral-de-declive","fichero":"La rueda y la espiral de declive.md","titulo":"La rueda y la espiral de declive","libro":"Good to Great","competencia":"Innovation \u0026 Strategy","tags":["modelo-mental","estrategia","constancia"],"highlight":"\"Imagínate que tienes que girar un gran y pesado volante. Al principio casi no se moverá, una vez que la inercia juegue a tu favor será sencillo y cada vez irá más rápido. ¿Cuál ha sido el gran empujón? Todos.\" — frente a la espiral de declive: \"No hay creación (no hay impulso) -\u003e Resultados decepcionantes -\u003e Reaccionar sin conocer -\u003e Novedades.\"","pagina":"","question":"Cuando un proyecto por fin \"despega\" de golpe, ¿fue por ese último gran acierto que hiciste justo antes?","answer":"No, es una ilusión óptica. Es como empujar una rueda gigante y pesada: al principio apenas se mueve por mucho que empujes, pero cada empujón se va acumulando, hasta que un día la inercia juega a tu favor y de repente gira sola, cada vez más rápido. Ese \"avance decisivo\" que parece milagroso desde fuera es en realidad la suma de todos los empujones anteriores, no uno solo. El error opuesto es la espiral de declive: cuando no hay impulso real, cada mal resultado empuja a reaccionar con novedades improvisadas, sin dirección, y la rueda nunca coge inercia.","aplicacion":{"personal":"Confiar en que cada pequeño esfuerzo sostenido está empujando \"mi rueda\" aunque hoy no se note, en vez de buscar el empujón único que lo cambie todo.","proyecto":"Imaginar Reelz como una rueda que algún día girará sola a toda velocidad gracias a la suma de esfuerzos actuales, y evitar caer en la espiral de declive de cambiar de dirección cada vez que llega un mal resultado.","teamcompany":"Ayudar a SPARK a distinguir si estamos en \"rueda\" (proceso orgánico y consistente) o en \"declive\" (cambios radicales buscando un milagro), y hablarlo abiertamente como equipo."},"mtime":1785881296},{"id":"la-secuencia-estrategica-correcta-utilidad-precio-coste-adopcion","fichero":"La secuencia estratégica correcta - utilidad precio coste adopción.md","titulo":"La secuencia estratégica correcta: utilidad, precio, coste y adopción","libro":"La Estrategia del Océano Azul","competencia":"Business Model Creation","tags":["framework","modelo-de-negocio"],"highlight":"\"El punto de partida es la utilidad para el comprador. ¿Libera su producto o servicio una utilidad excepcional? [...] Si no hay nada de esto, el potencial del océano azul es inexistente. Ante esta situación sólo caben dos opciones: abandonar la idea o reformularla.\" (pág. 144)","pagina":"144","question":"Si tengo una idea que me entusiasma, ¿por dónde debería empezar a validarla: por si la gente la va a comprar, por cuánto puedo cobrar, o por si me sale rentable?","answer":"Es un orden obligatorio de cuatro preguntas, y si fallas una tienes que reformular la idea antes de seguir a la siguiente — no puedes saltarte pasos. Primero: ¿esto da una utilidad excepcional al comprador, una razón de peso para elegirlo? Si no, para. Segundo: ¿el precio que puedo poner es asequible para el grueso del mercado (no solo para early adopters)? Si no, para. Tercero: ¿puedo llegar a ese precio y aun así ganar dinero, ajustando mi coste al precio (y no al revés)? Si no, para. Cuarto: ¿qué obstáculos de adopción existen (miedos, hábitos, intereses de terceros afectados) y los he resuelto desde el principio? Solo si pasas las cuatro tienes una idea de océano azul comercialmente viable — muchas ideas mueren no porque la utilidad esté mal, sino porque nadie pensó en el precio o en la adopción hasta el final.","aplicacion":{"personal":"No encuentro una aplicación directa.","proyecto":"Aplicar la secuencia completa a cualquier servicio o proyecto nuevo que plantee: validar primero la utilidad real, luego si el precio encaja con el grueso del mercado objetivo, luego si con ese precio nos sale rentable, y solo al final pensar en cómo facilitar que el cliente lo adopte.","teamcompany":"Si SPARK plantea alguna iniciativa nueva de Team Company, proponer pasarla por esta secuencia antes de comprometer recursos de todo el equipo."},"mtime":1789034768},{"id":"la-tecnologia-es-un-acelerador-no-un-impulso","fichero":"La tecnología es un acelerador, no un impulso.md","titulo":"La tecnología es un acelerador, no un impulso","libro":"Good to Great","competencia":"Digital Skill","tags":["concepto","tecnología","estrategia"],"highlight":"\"Es muy importante remarcar que cuando utilizas de manera correcta la tecnología consigues un acelerador del impulso, no el creador de este.\" / \"el 80% de directivos de las empresas extraordinarias NO mencionaron la tecnología como un factor.\"","pagina":"","question":"Si tu proyecto no está funcionando, ¿incorporar la última tecnología (como IA) es lo que le va a dar el impulso que necesita?","answer":"No. La tecnología solo puede acelerar un impulso que ya existe; no puede crear ese impulso de la nada. Si tu proyecto no tiene ya una base sólida (buena gente, buena cultura, un concepto claro), meterle tecnología encima no lo va a arreglar, solo acelerará lo que ya estaba pasando, bien o mal. El miedo a \"quedarse atrás\" es lo que hace que se sobrevalore la tecnología como solución mágica.","aplicacion":{"personal":"Antes de adoptar una nueva herramienta o app porque \"todos la usan\", preguntarme si de verdad acelera algo que ya funciona en mi rutina.","proyecto":"En Reelz, no aplicar la edición con Inteligencia Artificial por miedo a quedarnos atrás, sino como acelerador de un servicio que ya es excelente por sí mismo.","teamcompany":"Recordar a SPARK que ninguna herramienta digital nueva va a arreglar un problema de base (cultura, foco, disciplina) del equipo; primero el impulso, después el acelerador."},"mtime":1785881286},{"id":"la-tecnica-del-sandwich-para-dar-el-precio","fichero":"La técnica del sándwich para dar el precio.md","titulo":"La técnica del sándwich para dar el precio","libro":"El arte de cerrar la venta","competencia":"Teampreneurship \u0026 Customer Co-creation","tags":["herramienta","ventas","precio"],"highlight":"\"Técnica del Sandwich: Colocar el precio entre dos bloques de beneficios.\" — \"Un precio presentado fuera de lugar mata la venta: primero debes construir un valor del producto tan alto que el precio no sorprenda.\"","pagina":"","question":"¿Cuándo es el mejor momento para decir el precio de tu producto: al principio, para ser transparente, o al final?","answer":"Ni al principio ni suelto: hay que meterlo entre dos bloques de beneficios, como el relleno de un sándwich. Si dices el precio antes de que el cliente entienda el valor real de lo que ofreces, el número suena caro por sí solo. Si lo dices rodeado de beneficios concretos (antes y después), el precio se percibe en su contexto real, no como una cifra aislada que asusta.","aplicacion":{"personal":"Aplicar esta misma lógica al \"vender\" cualquier propuesta personal: rodear cualquier coste o esfuerzo pedido con los beneficios antes y después.","proyecto":"Aplicar la técnica del sándwich al decir el precio en las llamadas de Reelz, tal como decidí en los Next Steps del ensayo — algo que además ya hacía de forma inconsciente sacando el precio solo al final.","teamcompany":"Enseñar esta técnica a mis socios de SPARK que hacen ventas, sobre todo ahora que estamos subiendo precios."},"mtime":1785881505},{"id":"la-ventana-y-el-espejo-para-atribuir-causas","fichero":"La ventana y el espejo para atribuir causas.md","titulo":"La ventana y el espejo para atribuir causas","libro":"Good to Great","competencia":"Personal Cultivation","tags":["modelo-mental","responsabilidad"],"highlight":"\"Los líderes de nivel 5 miran por la ventana y atribuyen a lo exterior (suerte) cuando las cosas van bien. Por otro lado, miran a un espejo y lo atribuyen a lo interior (ellos mismos) cuando las cosas no van bien. Los líderes mediocres hacen lo contrario.\"","pagina":"","question":"Cuando algo te sale bien, ¿es la suerte o tu mérito? ¿Y cuando te sale mal?","answer":"Los líderes extraordinarios responden al revés de lo que parece natural: cuando algo sale bien, miran \"por la ventana\" y reconocen la suerte y la ayuda de otros; cuando algo sale mal, miran \"al espejo\" y se hacen responsables ellos mismos. Los líderes mediocres hacen justo lo contrario: se atribuyen el mérito de lo bueno y culpan a la mala suerte de lo malo — y por eso nunca mejoran, porque si siempre es culpa de fuera, nunca hay nada que cambiar dentro.","aplicacion":{"personal":"La próxima vez que algo me salga bien, reconocer conscientemente el papel de la suerte y de otros; cuando algo me salga mal, mirar primero mi propia responsabilidad.","proyecto":"En Reelz, al analizar por qué funcionó o no una campaña, aplicar este mismo filtro antes de sacar conclusiones fáciles.","teamcompany":"Cuando algo vaya mal en SPARK, animar a que el equipo mire primero \"al espejo\" en vez de buscar culpables externos."},"mtime":1785881230},{"id":"la-violencia-pasiva-alimenta-la-violencia-fisica","fichero":"La violencia pasiva alimenta la violencia física.md","titulo":"La violencia pasiva alimenta la violencia física","libro":"Comunicación No Violenta","competencia":"Empathy \u0026 Diversity","tags":["concepto","comunicación","conflicto"],"highlight":"\"La violencia pasiva es el combustible que alimenta el fuego de la violencia física\" (Pág 14)","pagina":"14","question":"Si nunca has llegado a las manos con nadie, ¿significa que no eres una persona violenta en tu comunicación?","answer":"No necesariamente. Solemos pensar en violencia como peleas o guerras, pero las burlas, los malentendidos y los pequeños desprecios en cómo hablamos también son violencia, solo que \"pasiva\". Y esa violencia pequeña es el combustible que, acumulado, acaba encendiendo conflictos mucho más grandes. Si quieres evitar el incendio, tienes que quitar el combustible desde el principio, no esperar a apagar el fuego grande.","aplicacion":{"personal":"Prestar atención a los pequeños comentarios o burlas que suelto sin pensar, e identificar si están sembrando un malentendido que luego crecerá.","proyecto":"En Reelz, cuando surja una fricción pequeña con un socio o cliente, tratarla en el momento en vez de dejarla acumular hasta que se convierta en un conflicto mayor.","teamcompany":"En SPARK, poner el foco en resolver esa \"violencia camuflada\" del día a día (comentarios, tonos) antes que en los grandes conflictos, ya que suelen nacer justo de ahí."},"mtime":1785880604},{"id":"la-zona-de-confort-frena-el-crecimiento","fichero":"La zona de confort frena el crecimiento.md","titulo":"La zona de confort frena el crecimiento","libro":"El líder que no tenía cargo","competencia":"Personal Cultivation","tags":["concepto","crecimiento","miedo"],"highlight":"Aprendizaje \"Zona de Confort\" (Pág 50): a casi todos nos da miedo lo desconocido, en vez de verlo como una oportunidad de crecer; fuera de la zona de confort es donde se halla el crecimiento.","pagina":"50","question":"Si algo te genera resistencia y pocas ganas al principio, ¿es una señal de que debes evitarlo?","answer":"Al revés: suele ser la señal de que ahí está el crecimiento. Lo desconocido da miedo de forma automática, pero ese miedo no significa peligro real, solo significa que estás fuera de lo conocido. Cuando cambias la forma de ver esa incomodidad —de amenaza a oportunidad de mejorar una habilidad— es cuando esa situación se convierte en una herramienta de crecimiento mucho más poderosa.","aplicacion":{"personal":"Durante la Challenge Week sentí resistencia inicial y pocas ganas; transformar esa visión a \"oportunidad de mejorar\" fue lo que hizo que esa semana se convirtiera en una herramienta de crecimiento real.","proyecto":"Identificar en Reelz qué tarea evito por incomodidad (vender, cobrar, negociar) y tratarla como zona de crecimiento en vez de evitarla.","teamcompany":"Animar en SPARK a que el equipo entre voluntariamente en situaciones incómodas (nuevos roles, conversaciones difíciles) en vez de repartir siempre las mismas tareas cómodas entre los mismos socios."},"mtime":1785881109},{"id":"las-10-leyes-del-ikigai-checklist-de-habitos","fichero":"Las 10 leyes del ikigai - checklist de hábitos.md","titulo":"Las 10 leyes del ikigai: checklist de hábitos","libro":"Ikigai","competencia":"Personal Cultivation","tags":["plantilla","hábitos","checklist"],"highlight":"\"Mantente siempre activo, nunca te retires. Tómatelo con calma. No comas hasta llenarte. Rodéate de buenos amigos. Ponte en forma para tu próximo cumpleaños. Sonríe. Reconecta con la naturaleza. Da las gracias. Vive el momento. Sigue tu ikigai.\"","pagina":"","question":"Si solo pudiera quedarme con una checklist del libro entero para pegar en la nevera, ¿cuál sería?","answer":"El propio libro las resume al final en 10 normas cortas y muy concretas —desde no jubilarte nunca del todo hasta sonreír y dar las gracias— que funcionan como un chequeo rápido de si estás viviendo alineado con tu ikigai, sin tener que repasar el libro entero cada vez.","aplicacion":{"personal":"Para mi esto queda como mantra del libro, así que a la hora de revisarlo, esto será una de mis prioridades a mantener presente.","proyecto":"Usar \"tómatelo con calma\" y \"no comas hasta llenarte\" (equivalente a no sobrecargar el roadmap) como filtro antes de aceptar nuevas tareas en el proyecto.","teamcompany":"Quizá podamos compartir las 10 leyes en un checklist visible para el equipo y revisarlas juntos una vez al mes como parte de la cultura del equipo."},"mtime":1785928876},{"id":"las-4-fases-del-desarrollo-de-clientes","fichero":"Las 4 fases del desarrollo de clientes.md","titulo":"Las 4 fases del desarrollo de clientes","libro":"El Manual del Emprendedor","competencia":"Business Model Creation","tags":["framework","clientes","validación"],"highlight":"Fase 1: Descubrimiento de clientes. Fase 2: Validación de Clientes (\"la validación se mide por ventas\"). Fase 3: Creación de Clientes (\"se debe pisar el acelerador\"). Fase 4: Creación de la Empresa (\"el día de la graduación, llega cuando la startup encuentra un modelo de negocio repetible y escalable\").","pagina":"","question":"¿Cuándo se considera que una startup realmente se ha convertido en una empresa?","answer":"No cuando tienes un producto terminado, ni siquiera cuando tienes tu primer cliente. Hay un proceso de cuatro fases: primero descubres si entiendes el problema del cliente, después validas si de verdad pagan por tu solución, luego pisas el acelerador para conseguir muchos más clientes, y solo cuando ese proceso es repetible y escalable, \"te gradúas\" como empresa de verdad, con departamentos y estructura. Muchos proyectos se saltan las primeras fases y dan su proyecto por \"creado\" sin tener todavía ni un cliente real.","aplicacion":{"personal":"Aplicar esta lógica de fases a proyectos personales: no dar algo por \"hecho\" solo porque existe, sino porque ha pasado por descubrimiento y validación reales.","proyecto":"Identificar en qué fase concreta está Reelz ahora mismo (descubrimiento, validación, creación de clientes o creación de empresa) para saber en qué debemos centrar el esfuerzo.","teamcompany":"Evitar en SPARK el error de considerar \"creado\" un proyecto solo porque tiene una idea definida, cuando todavía no tiene ni un cliente real validado."},"mtime":1785881363},{"id":"las-4-leyes-del-cambio-de-conducta","fichero":"Las 4 leyes del cambio de conducta.md","titulo":"Las 4 leyes del cambio de conducta","libro":"Hábitos Atómicos","competencia":"Personal Cultivation","tags":["framework","hábitos","plantilla"],"highlight":"\"La señal desencadena el anhelo que motiva la obtención de una respuesta, la cual, nos brinda una recompensa.\" Para crear un buen hábito: hacerlo obvio, atractivo, sencillo y satisfactorio. Para eliminar uno malo: hacerlo invisible, poco atractivo, difícil e insatisfactorio.","pagina":"","question":"Si quieres adquirir un hábito nuevo o eliminar uno malo, ¿basta con tener fuerza de voluntad?","answer":"No, es mucho más fiable rediseñar las cuatro fases de cualquier hábito: la señal que lo dispara, el anhelo que te motiva, la respuesta que ejecutas y la recompensa que obtienes. Para crear un buen hábito, haces cada fase más fácil (obvia, atractiva, sencilla, satisfactoria); para eliminar uno malo, haces cada fase más difícil (invisible, poco atractiva, difícil, insatisfactoria). Es un sistema de cuatro palancas, no solo una batalla de voluntad.","aplicacion":{"personal":"Elegir un hábito que quiera reforzar y otro que quiera eliminar, y rediseñar sus cuatro fases en vez de confiar solo en mi fuerza de voluntad.","proyecto":"Aplicar esta misma lógica a \"hábitos de proyecto\" en Reelz: hacer obvio y sencillo el proceso que quiero que el equipo repita (como registrar cada llamada), y difícil el que quiero eliminar.","teamcompany":"Usar el marco de las 4 leyes para diseñar rituales de SPARK que queramos que se conviertan en hábito de equipo, como parte de nuestra cultura."},"mtime":1785881684},{"id":"las-6-vias-para-reconstruir-las-fronteras-del-mercado","fichero":"Las 6 vías para reconstruir las fronteras del mercado.md","titulo":"Las 6 vías para reconstruir las fronteras del mercado","libro":"La Estrategia del Océano Azul","competencia":"Innovation \u0026 Strategy","tags":["framework","estrategia"],"highlight":"\"Para escapar de los océanos rojos, las compañías deben salir de las fronteras generalmente aceptadas que definen la forma en que deben competir. En lugar de mirar en el interior de estas fronteras, los directivos deben mirar sistemáticamente fuera de ellas a fin de crear océanos azules.\" (pág. 71)","pagina":"71","question":"Si llevo meses sin encontrar una idea diferencial para mi sector, ¿es porque no existe, o porque estoy buscando siempre dentro de las mismas fronteras mentales?","answer":"El libro identifica seis sitios concretos donde mirar fuera de las fronteras normales de un sector para encontrar un océano azul: (1) sectores alternativos — no competidores directos sino cosas que la gente elige en su lugar (cine vs. restaurante); (2) grupos estratégicos dentro del propio sector — combinar lo mejor de la gama alta y la gama baja (Curves, Ralph Lauren); (3) la cadena de compradores — cambiar el foco de quién paga a quién usa o quién influye (Bloomberg, Canon, SAP); (4) productos y servicios complementarios — resolver lo que pasa antes, durante y después del uso (Dyson); (5) el atractivo funcional vs. emocional — cambiar de orientación (de emocional a funcional como Vanguard, o al revés); (6) el tiempo — anticipar tendencias irreversibles y decisivas en vez de reaccionar a ellas (Apple/iTunes). Las seis asunciones convencionales que nos atrapan en océano rojo son justo mirar siempre lo mismo: mismo sector, mismo grupo estratégico, mismo comprador, mismo alcance de producto, misma orientación, mismo momento en el tiempo.","aplicacion":{"personal":"Coger un reto personal en el que me siento estancado y aplicarle al menos dos de las seis vías (por ejemplo: ¿qué \"sector alternativo\" está resolviendo el mismo problema de otra forma? ¿estoy mirando solo al comprador y no al usuario real?).","proyecto":"En Reelz, aplicar la Vía 1 (sectores alternativos): ¿a qué recurre un cliente potencial cuando no contrata una agencia de edición? (hacerlo él mismo con IA, no editar nada, contratar un freelance suelto) y ver qué variable clave de esas alternativas podríamos incorporar.","teamcompany":"No he encontrado una aplicación directa."},"mtime":1788955206},{"id":"las-cuatro-barreras-organizacionales-al-cambio-estrategico","fichero":"Las cuatro barreras organizacionales al cambio estratégico.md","titulo":"Las cuatro barreras organizacionales al cambio estratégico","libro":"La Estrategia del Océano Azul","competencia":"Cooperative Leadership","tags":["concepto","liderazgo"],"highlight":"\"1. Barrera cognitiva: Una organización casada con el statu quo. 2. Barrera de los recursos: Recursos limitados. 3. Barrera motivacional: Personal desmotivado. 4. Barrera política: Oposición por parte de poderosos intereses creados.\" (pág. 174)","pagina":"174","question":"Si un equipo entiende perfectamente que necesita cambiar de estrategia, ¿por qué sigue sin cambiar nada meses después?","answer":"Tener una buena estrategia sobre el papel no basta: hay cuatro obstáculos distintos que frenan la ejecución y hay que atacarlos de forma diferente cada uno. La barrera cognitiva es que la gente ni siquiera ve el problema como urgente (no ha \"sentido\" el dolor). La barrera de recursos es que crees que necesitas mucho más dinero o gente del que realmente tienes. La barrera motivacional es que aunque la gente vea el problema, no está enganchada para actuar. La barrera política es que hay alguien con poder a quien el cambio le perjudica y se resiste activamente. Bill Bratton, cuando limpió el metro de Nueva York, no atacó las cuatro con el mismo remedio: usó tácticas muy distintas para cada una (que se detallan en notas separadas: enfrentar la realidad, personas influyentes clave, atomización).","aplicacion":{"personal":"La próxima vez que sepa que debo cambiar un hábito y no lo haga, diagnosticar cuál de las cuatro barreras es la real (¿no veo el problema urgente? ¿creo que me faltan recursos? ¿no estoy motivado? ¿hay algo/alguien -incluido yo mismo- que se resiste?) antes de intentar \"fuerza de voluntad\" genérica.","proyecto":"Si en Reelz queremos cambiar algo del proceso de trabajo y cuesta que se adopte, diagnosticar cuál de las cuatro barreras está frenando realmente (probablemente motivacional o de recursos percibidos) antes de simplemente insistir en la nueva norma.","teamcompany":"Cuando SPARK proponga un cambio de dinámica de equipo y no cuaje, usar este marco para diagnosticar en una conversación de equipo cuál de las cuatro barreras es la que de verdad está bloqueando, en vez de asumir que \"no se han enterado\"."},"mtime":1788562431},{"id":"las-necesidades-son-la-raiz-de-los-sentimientos","fichero":"Las necesidades son la raíz de los sentimientos.md","titulo":"Las necesidades son la raíz de los sentimientos","libro":"Comunicación No Violenta","competencia":"Empathy \u0026 Diversity","tags":["modelo-mental","comunicación","emociones"],"highlight":"\"Lo que hacen otros puede ser el estímulo de nuestros sentimientos, pero no la causa\" (Pág 59)","pagina":"59","question":"Si alguien te hace sentir mal, ¿esa persona es la causa de tu malestar?","answer":"No exactamente. Lo que hace el otro es solo el \"botón\" que activa tu sentimiento, pero la causa real es una necesidad tuya que no se está cumpliendo. Si dos personas viven la misma situación, pueden sentir cosas completamente distintas, porque cada una tiene necesidades distintas detrás. Por eso, en vez de culpar al otro por cómo te sientes, conviene buscar qué necesidad tuya está detrás de ese sentimiento.","aplicacion":{"personal":"Cuando note un sentimiento negativo, preguntarme primero \"¿qué necesidad mía no se está cumpliendo aquí?\" antes de buscar un culpable fuera.","proyecto":"En Reelz, si un comentario de un socio me genera malestar, identificar la necesidad real detrás (¿reconocimiento?, ¿seguridad?) antes de reaccionar contra la persona.","teamcompany":"En SPARK, aprender a no tomarme los estímulos como algo \"personal\" y, si se genera un sentimiento negativo entre socios, ponerle voz a la necesidad detrás en vez de acumular resentimiento, tal como reflexioné en el ensayo sobre nuestra convivencia de cuatro años."},"mtime":1785880588},{"id":"las-objeciones-son-una-buena-senal-de-interes","fichero":"Las objeciones son una buena señal de interés.md","titulo":"Las objeciones son una buena señal de interés","libro":"El arte de cerrar la venta","competencia":"Teampreneurship \u0026 Customer Co-creation","tags":["modelo-mental","ventas","objeciones"],"highlight":"\"Las objeciones son una buena señal. Las objeciones son una muestra de que hay interés.\"","pagina":"","question":"Cuando un cliente potencial pone muchas pegas a tu oferta, ¿es una señal de que vas a perder la venta?","answer":"No necesariamente, puede ser justo lo contrario. Si a alguien no le interesara nada tu producto, ni se molestaría en poner objeciones: simplemente pasaría de largo. El hecho de que ponga pegas concretas significa que está evaluando en serio si comprarte, lo cual es una señal de interés real, no de rechazo. Cambiar esta interpretación cambia por completo cómo te sientes al recibir una objeción.","aplicacion":{"personal":"La próxima vez que alguien ponga objeciones a una idea mía, interpretarlo como una señal de que se lo está tomando en serio, no como un rechazo.","proyecto":"En las llamadas de Reelz, dejar de desmotivarme ante las objeciones y verlas como una oportunidad de avanzar en la conversación, no como un obstáculo.","teamcompany":"Transmitir esta reinterpretación a mis socios de SPARK que llevan ventas, para que las objeciones dejen de sentirse como un fracaso y empiecen a sentirse como una oportunidad."},"mtime":1785881482},{"id":"las-tres-capas-del-cambio-de-conducta-la-identidad-primero","fichero":"Las tres capas del cambio de conducta, la identidad primero.md","titulo":"Las tres capas del cambio de conducta: la identidad primero","libro":"Hábitos Atómicos","competencia":"Personal Cultivation","tags":["framework","identidad","hábitos"],"highlight":"\"La de veces que intentamos empezar los cambios por los resultados, sin tener en cuenta que hasta que no cambiemos nuestra identidad, nada tendrá un verdadero impacto en nuestra vida.\" / \"Porque si actúas como X durante el tiempo suficiente, finalmente te conviertes en X.\"","pagina":"","question":"Si quieres adoptar un hábito nuevo, ¿lo más eficaz es empezar fijándote un resultado concreto que quieres lograr?","answer":"No es lo más duradero. Hay tres capas de cambio: los resultados (qué consigues), los procesos (qué haces) y la identidad (quién crees que eres). La mayoría empezamos por los resultados, pero el cambio que de verdad se sostiene en el tiempo empieza por la identidad: no es \"quiero correr una maratón\", es \"soy una persona que corre\". Cuando actúas de una forma el tiempo suficiente, acabas convirtiéndote realmente en esa identidad, y entonces el hábito deja de requerir esfuerzo.","aplicacion":{"personal":"En mi caso, entrenar no es una obligación ni un hábito, es parte de mi identidad (\"¿quién soy sin entrenar?\"); identificar qué otros hábitos quiero anclar del mismo modo a mi identidad, no solo a un resultado.","proyecto":"Trabajar mi identidad como emprendedor (\"soy alguien que valida antes de construir\") para que las buenas prácticas de Reelz salgan solas, no por fuerza de voluntad.","teamcompany":"Ayudar a que SPARK se piense a sí misma como \"un equipo que X\" (por ejemplo, que mide con datos, que cuida al cliente), para que esos comportamientos se sostengan por identidad de equipo, no solo por normas."},"mtime":1785881668},{"id":"las-tres-palancas-para-alcanzar-el-coste-objetivo","fichero":"Las tres palancas para alcanzar el coste objetivo.md","titulo":"Las tres palancas para alcanzar el coste objetivo","libro":"La Estrategia del Océano Azul","competencia":"Financial Skill","tags":["herramienta","finanzas"],"highlight":"\"La primera palanca consiste en racionalizar las operaciones e introducir innov
